name: Doc Validation CI

on:
  pull_request:
  push:
    branches: [ "main", "develop" ]
    paths: ["doc/**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Run tests
      run: java test/XMLValidation.java doc/NLCSValidatieRegels.xsd doc/NLCSValidatieRegels.xml

    - name: Install dependencies
      run: scripts/install_dependencies.sh

    - name: Upload installed dependencies
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: installed-dependencies
        path: |
          saxon-he.jar
          lib/
          transpile.xsl
          xerces-cli.jar
          NLCS_Netbeheer.xsd
          NLCS_Netbeheer_Keuzelijst.xsd
        if-no-files-found: warn

    - name: Generate and compare HTMLs
      run: scripts/generate_and_compare_htmls.sh

    - name: Generate and compare SVGs
      run: scripts/generate_and_compare_svgs.sh
