name: Deliverables

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  upload-deliverables:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: scripts/install_dependencies.sh

      - name: Upload installed dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-dependencies
          path: |
            saxon-he.jar
            lib/
            transpile.xsl
            xerces-cli.jar
            schemas/
          if-no-files-found: warn

      # Before any version is transpiled: main_scope_checks.sch includes the scope-checked
      # abstract patterns of the versions it inherits from
      - name: Add scope checks
        run: |
          for SCOPE_VERSION in $(scripts/versions.sh list); do
            scripts/add_scope_checks.sh "$SCOPE_VERSION"
          done

      - name: Transpile Schematron to XSL
        run: |
          for VERSION in $(scripts/versions.sh list); do
            java -jar saxon-he.jar -xsl:transpile.xsl -s:$VERSION/rules/main_scope_checks.sch -o:$VERSION/rules/transpiled_phases/main_scope_checks.xsl
          done

      - name: Bundle deliverables
        run: scripts/bundle.sh

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: nlcspp_inhoudelijke_validaties.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
