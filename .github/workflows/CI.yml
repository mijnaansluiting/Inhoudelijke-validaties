name: CI

on:
  pull_request:
  push:
    branches: [ "main", "develop" ]

# The versions and dependencies are resolved once, after which the full pipeline (pipeline.yml) runs
# per version as a matrix job. Dependencies are downloaded once and shared with every version as an artifact.
jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check active versions declarations
        run: scripts/check_active_version.sh

      - name: List versions
        id: list
        run: echo "matrix=$(scripts/versions.sh matrix)" >> "$GITHUB_OUTPUT"

  install-dependencies:
    needs: versions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: scripts/install_dependencies.sh

      - name: Upload installed dependencies
        uses: actions/upload-artifact@v4
        with:
          name: installed-dependencies
          path: |
            saxon-he.jar
            lib/
            transpile.xsl
            xerces-cli.jar
            schemas/
          if-no-files-found: error
          retention-days: 1

  pipeline:
    needs: [versions, install-dependencies]

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}

    uses: ./.github/workflows/pipeline.yml
    with:
      version: ${{ matrix.version }}
