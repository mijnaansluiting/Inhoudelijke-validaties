name: CI

on:
  pull_request:
  push:
    branches: [ "main", "develop" ]

# Jobs run in a fixed order; each job only starts when the previous one succeeded.
# Dependencies are downloaded once and shared with later jobs as an artifact.
jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check active versions declarations
        run: scripts/check_active_version.sh

      - name: List versions
        id: list
        run: echo "matrix=$(scripts/versions.sh matrix)" >> "$GITHUB_OUTPUT"

  covered-rules:
    needs: versions
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}

    env:
      VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check rule coverage
        run: scripts/check_rule_coverage.sh "$VERSION"

  install-dependencies:
    needs: covered-rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: scripts/install_dependencies.sh

      - name: Upload installed dependencies
        uses: actions/upload-artifact@v4
        with:
          name: installed-dependencies
          path: |
            saxon-he.jar
            lib/
            transpile.xsl
            xerces-cli.jar
            schemas/
          if-no-files-found: error
          retention-days: 1

  validate-rules:
    needs: [versions, install-dependencies]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}

    env:
      VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download installed dependencies
        uses: actions/download-artifact@v5
        with:
          name: installed-dependencies

      - name: Validate rule test data XSD compliance
        run: scripts/validate_test_data_xsd.sh "$VERSION"
      - name: Transpile phases to XSL
        run: scripts/transpile_phases.sh "$VERSION"

      - name: Validate rules
        run: scripts/validate_rules.sh "$VERSION"

      - name: Upload validation reports
        uses: actions/upload-artifact@v4
        with:
          name: rule-validation-reports-${{ matrix.version }}
          path: ${{ matrix.version }}/rule_validation_reports

      - name: Validate test reports
        run: scripts/validate_rule_reports.sh "$VERSION"

      - name: Check rule object coverage
        run: scripts/check_rule_object_coverage.sh "$VERSION"

  validate-scopes:
    needs: [versions, install-dependencies]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.versions.outputs.matrix) }}

    env:
      VERSION: ${{ matrix.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download installed dependencies
        uses: actions/download-artifact@v5
        with:
          name: installed-dependencies

      # Every version, not just this one: main_scope_checks.sch includes the scope-checked
      # abstract patterns of the versions it inherits from
      - name: Add scope checks
        run: |
          for SCOPE_VERSION in $(scripts/versions.sh list); do
            scripts/add_scope_checks.sh "$SCOPE_VERSION"
          done

      - name: Transpile Schematron to XSL
        run: java -jar saxon-he.jar -xsl:transpile.xsl -s:$VERSION/rules/main_scope_checks.sch -o:$VERSION/rules/transpiled_phases/main_scope_checks.xsl

      - name: Validate scopes
        run: scripts/validate_scopes.sh "$VERSION"

  validate-docs:
    needs: install-dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download installed dependencies
        uses: actions/download-artifact@v5
        with:
          name: installed-dependencies

      - name: Run tests
        run: |
          version=$(scripts/versions.sh latest)
          java test/XMLValidation.java doc/NLCSValidatieRegels.xsd $version/doc/NLCSValidatieRegels.xml

      - name: Generate and compare HTMLs
        run: |
          version=$(scripts/versions.sh latest)
          scripts/generate_and_compare_htmls.sh $version

      - name: Generate and compare SVGs
        run: |
          version=$(scripts/versions.sh latest)
          scripts/generate_and_compare_svgs.sh $version
