name: Scope Validation CI

on:
  pull_request:
  push:
    branches: [ "main", "develop" ]

jobs:
  validate-scopes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: scripts/install_dependencies.sh

      - name: Upload installed dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-dependencies
          path: |
            saxon-he.jar
            lib/
            transpile.xsl
            xerces-cli.jar
            NLCS_Netbeheer.xsd
            NLCS_Netbeheer_Keuzelijst.xsd
          if-no-files-found: warn

      - name: Add scope checks
        run: scripts/add_scope_checks.sh

      - name: Transpile Schematron to XSL
        run: java -jar saxon-he.jar -xsl:transpile.xsl -s:validation_schemas/base_scope_checks/v12.sch -o:validation_schemas/base_scope_checks/v12.xsl

      - name: Validate scopes
        run: scripts/validate_scopes.sh
