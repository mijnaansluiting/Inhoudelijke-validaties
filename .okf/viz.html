, {"id": "rules/R.3", "type": "Validation Rule", "title": "R.3 \u2014 Geometrie binnen Projectvlak", "description": "Checks that every point, line, and area geometry of every NLCS object in the file interacts with the project area of the AprojectReferentie.", "tags": ["geometrie"], "group": "rules", "sz": 31, "body": "# Overview\n\nEvery NLCS object's geometry must spatially interact with the project area (the gml:Surface geometry) declared on the AprojectReferentie. This prevents objects from being submitted that lie entirely outside the project's own geographic scope.\n\n# Details\n\n- soort: Geometrie\n- validatieObjecten: Aaanlegtechniek, AbeschermingVlak, Akunstwerk, Amantelbuis, Eaarddraad, Eaardpen, LSkabel, LSmof, LSoverdrachtspunt, MSkabel, MSmof, MSoverdrachtspunt, MSstation, OVLoverdrachtspunt\n- Condition: depending on the geometry type of the object, the check differs:\n  - Point objects (MSmof, MSoverdrachtspunt, LSmof, LSoverdrachtspunt, OVLoverdrachtspunt, Eaardpen): the object's gml:Point must interact with the project area (`ma:point-interacts-with-area`).\n  - Line objects (MSkabel, Amantelbuis, Akunstwerk, Eaarddraad, Aaanlegtechniek, LSkabel): the object's gml:Curve must interact with the project area (`ma:line-interacts-with-area`).\n  - Area objects (MSstation, AbeschermingVlak): the object's gml:Surface must interact with the project area (`ma:area-interacts-with-area`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [geometrie_binnen_projectvlak.sch](../../validation_schemas/abstract_patterns/v12/geometrie/geometrie_binnen_projectvlak.sch)"}, {"id": "rules/R.30", "type": "Validation Rule", "title": "R.30 \u2014 Mantelbuis Inhoud referenties", "description": "Checks that an AmantelbuisInhoud correctly references a surrounding Amantelbuis and a distinct content object of the declared ObjectTypeInhoud.", "tags": ["consistentie"], "group": "rules", "sz": 31, "body": "# Overview\n\nAn AmantelbuisInhoud object links a duct (mantelbuis) to the asset it contains. This rule checks that the two references are internally consistent: the content ID must differ from the duct ID, MantelbuisID must actually point to an Amantelbuis object, and InhoudID must point to an object whose type matches the declared ObjectTypeInhoud.\n\n# Details\n\n- soort: Consistentie\n- validatieObjecten: AmantelbuisInhoud\n- Condition:\n  - `mantelbuis-inhoud-is-not-self`: InhoudID must not equal MantelbuisID (message `mantelbuis-inhoud-is-self`).\n  - `mantelbuis-id-refers-to-mantelbuis`: the NLCS object with ID = MantelbuisID must exist and be an Amantelbuis (message `mantelbuis-id-does-not-refer-to-mantelbuis`).\n  - `object-type-inhoud-matches-inhoud`: the NLCS object with ID = InhoudID must have a type name matching the AmantelbuisInhoud's own ObjectTypeInhoud value (message `object-type-inhoud-does-not-match-inhoud`).\n\nThis rule is closely related to [R.27](/rules/R.27.md) and [R.36](/rules/R.36.md), which impose further consistency and geometric constraints on the same mantelbuis/inhoud relationship.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [mantelbuis_inhoud_referenties.sch](../../validation_schemas/abstract_patterns/v12/consistentie/mantelbuis_inhoud_referenties.sch)"}, {"id": "rules/R.31", "type": "Validation Rule", "title": "R.31 \u2014 Aanwezigheid bestand bijlage aardpen", "description": "Checks that every Eaardpen (earth pin) has a linked AbestandBijlage attachment of SoortBestand \"Aardingsrapport\".", "tags": ["document"], "group": "rules", "sz": 28, "body": "# Overview\n\nAn earth pin (Eaardpen) must be documented with a grounding report. This rule checks that an AbestandBijlage object linked to the Eaardpen exists and that its SoortBestand is \"Aardingsrapport\".\n\n# Details\n\n- soort: Document\n- validatieObjecten: Eaardpen\n- Condition (objects related via Eaardpen.ID = AbestandBijlage.AssetObjectID):\n  - `check-bestand-bijlage-present`: at least one related AbestandBijlage must exist (message `object-not-present`, placeholder `Abestandbijlage`).\n  - `check-correct-bestandsoort`: if present, its SoortBestand must equal \"Aardingsrapport\" (message `soort-bestand-not-correct`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [aanwezigheid_bestand_bijlage_aardpen.sch](../../validation_schemas/abstract_patterns/v12/document/aanwezigheid_bestand_bijlage_aardpen.sch)"}, {"id": "rules/R.32", "type": "Validation Rule", "title": "R.32 \u2014 Aanwezigheid bestand bijlage kunstwerk", "description": "Checks that every zinker-type Akunstwerk has a linked AbestandBijlage attachment of SoortBestand \"Zinkertekening\".", "tags": ["document"], "group": "rules", "sz": 30, "body": "# Overview\n\nA subaqueous crossing structure (a \"zinker\") must be documented with a drawing. This rule checks that, for any Akunstwerk whose SoortKunstwerk starts with \"ZINKER\" (e.g. ZINKER, ZINKER_BOOG, ZINKER_SLEEP, ZINKER_OMGEKEERD, ZINKER_SPUIT), a related AbestandBijlage object exists with SoortBestand \"Zinkertekening\".\n\n# Details\n\n- soort: Document\n- validatieObjecten: Akunstwerk\n- Condition (objects related via Akunstwerk.ID = AbestandBijlage.AssetObjectID):\n  - Only applies when `is_zinker` (SoortKunstwerk starts with \"ZINKER\"); non-zinker kunstwerken are not constrained.\n  - `check-bestand-bijlage-present`: for zinker kunstwerken, at least one related AbestandBijlage must exist (message `object-not-present`, placeholder `Abestandbijlage`).\n  - `soort_bestand_correct`: for zinker kunstwerken, the related AbestandBijlage's SoortBestand must equal \"Zinkertekening\" (message `soort-bestand-not-correct`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [aanwezigheid_bestand_bijlage_kunstwerk.sch](../../validation_schemas/abstract_patterns/v12/document/aanwezigheid_bestand_bijlage_kunstwerk.sch)"}, {"id": "rules/R.33", "type": "Validation Rule", "title": "R.33 \u2014 Aanwezigheid bestand bijlage aanlegtechniek", "description": "Checks that every Aaanlegtechniek with SoortAanlegTechniek \"GESTUURDE TECHNIEK\" has a linked AbestandBijlage attachment of SoortBestand \"Gestuurde boring\".", "tags": ["document"], "group": "rules", "sz": 29, "body": "# Overview\n\nA directional-drilling installation technique must be documented with a drilling report. This rule checks that, for any Aaanlegtechniek with SoortAanlegTechniek \"GESTUURDE TECHNIEK\", a related AbestandBijlage object exists with SoortBestand \"Gestuurde boring\".\n\n# Details\n\n- soort: Document\n- validatieObjecten: Aaanlegtechniek\n- Condition (objects related via Aaanlegtechniek.ID = AbestandBijlage.AssetObjectID; rule context is already restricted to `SoortAanlegTechniek = 'GESTUURDE TECHNIEK'`):\n  - `check-bestand-bijlage-present`: at least one related AbestandBijlage must exist (message `object-not-present`, placeholder `Abestandbijlage`).\n  - `bestandbijlage-must-be-gestuurde-boring`: the related AbestandBijlage's SoortBestand must equal \"Gestuurde boring\" (message `soort-bestand-not-correct`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [aanwezigheid_bestand_bijlage_aanlegtechniek.sch](../../validation_schemas/abstract_patterns/v12/document/aanwezigheid_bestand_bijlage_aanlegtechniek.sch)"}, {"id": "rules/R.34", "type": "Validation Rule", "title": "R.34 \u2014 Reden niet-verwijdering ingevuld", "description": "Checks that an abandoned cable (Status REVISIE, Bedrijfstoestand VERLATEN) has a value for RedenNietVerwijdering explaining why it was not removed.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "body": "# Overview\n\nWhen a cable is abandoned in place rather than physically removed, the reason for not removing it must be recorded. This rule checks that any LSkabel/MSkabel with Status=REVISIE and Bedrijfstoestand=VERLATEN has a non-empty RedenNietVerwijdering value.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: LSkabel, MSkabel\n- Condition:\n  - `should_be_tested`: Status = 'REVISIE' and Bedrijfstoestand = 'VERLATEN'.\n  - `reden-niet-verwijdering-present`: if `should_be_tested`, RedenNietVerwijdering must exist and be non-empty (message `attribute-not-present`, placeholder `RedenNietVerwijdering`); otherwise the assertion passes vacuously.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [reden_niet_verwijdering_ingevuld.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/reden_niet_verwijdering_ingevuld.sch)"}, {"id": "rules/R.35", "type": "Validation Rule", "title": "R.35 \u2014 Aanwezigheid maaiveldhoogte", "description": "Checks that a revision drawing file (Tekeningtype DEELREVISIE or EINDREVISIE) contains at least one Amaaiveldhoogte (ground level) object.", "tags": ["bestand"], "group": "rules", "sz": 30, "body": "# Overview\n\nA revision drawing must include at least one ground-level measurement. This rule checks, at the level of the whole NLCS++ file, that a revision-type drawing (Tekeningtype DEELREVISIE or EINDREVISIE) contains one or more Amaaiveldhoogte objects.\n\n# Details\n\n- soort: Bestand\n- validatieObjecten: Document (evaluated at NLCSnetbeheer/file level, not per individual object)\n- Condition:\n  - `is_revisie`: AprojectReferentie/Tekeningtype is one of DEELREVISIE or EINDREVISIE.\n  - `revisie-has-maaiveldhoogte`: if `is_revisie`, the count of Amaaiveldhoogte children must be greater than 0 (message `revisie-no-maaiveldhoogte-present`); otherwise the assertion passes vacuously.\n  - Note this assertion's `properties` list is `rule-number severity` only (no `scope`/`object-type`/`object-id`), consistent with it being a file-level rather than object-level check.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [aanwezigheid_maaiveldhoogte.sch](../../validation_schemas/abstract_patterns/v12/bestand/aanwezigheid_maaiveldhoogte.sch)"}, {"id": "rules/R.36", "type": "Validation Rule", "title": "R.36 \u2014 Afstand mantelbuis tot inhoud", "description": "Checks that every content asset related to an Amantelbuis (duct) lies within a configurable maximum distance of that duct's line geometry.", "tags": ["geometrie"], "group": "rules", "sz": 34, "body": "# Overview\n\nThe assets running through a duct (mantelbuis) should physically lie along that duct, not stray far away from it. This rule checks that every content object linked to an Amantelbuis via AmantelbuisInhoud has geometry within a configurable maximum distance of the duct's own line geometry. The check assumes a duct does not cross itself.\n\n# Details\n\n- soort: Geometrie\n- validatieObjecten: Amantelbuis\n- Condition:\n  - Content objects are gathered via `AmantelbuisInhoud[MantelbuisID = duct ID]/InhoudID`, resolved to their NLCS objects.\n  - Both the duct and each content object's `Geometry` are parsed into lines (`ma:parse-line`).\n  - `inhoud-in-range-of-mantelbuis`: every content object's line must be within `ma:mantelbuis-inhoud-asset-max-distance()` of the duct's line (`ma:line-within-range-of-line`); any that are not are reported together (message `inhoud-assets-not-in-range-of-mantelbuis`, with the offending count and the max distance as placeholders).\n\nThe maximum distance is read from `configuration/sys_config.xml`'s `MantelbuisInhoudMaxAfstand` (currently `1`, in meters) via `ma:mantelbuis-inhoud-asset-max-distance()` \u2014 this is the \"configurable\" threshold called for in the rule's definition. See [sys_config reference](/config/sys-config.md).\n\nThe distance/line-buffer calculation behind this rule has been the subject of recent bugfixes (handling sequential coordinates at the same position, and rounding the computed distance to millimeters before comparing against the threshold to avoid floating-point false positives). See [distance precision rounding decision](/decisions/distance-precision-rounding.md) for the rationale behind those choices.\n\nThis rule is closely related to [R.27](/rules/R.27.md) and [R.30](/rules/R.30.md), which impose further consistency constraints on the same mantelbuis/inhoud relationship.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [afstand_mantelbuis_tot_inhoud.sch](../../validation_schemas/abstract_patterns/v12/geometrie/afstand_mantelbuis_tot_inhoud.sch)"}, {"id": "rules/R.37", "type": "Validation Rule", "title": "R.37 \u2014 Inmeetwijze toegestaande waarde", "description": "Checks that Inmeetwijze on linear electrical assets is either GPS or Tachymeter, except for a separately-validated LSkabel AANSLUITNET/Meetlint combination.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 32, "body": "# Overview\n\nThis rule checks that the value of Inmeetwijze is either \"GPS\" or \"Tachymeter\" for linear electrical assets. The one exception is an LSkabel with Subnettype \"AANSLUITNET\", for which Inmeetwijze \"Meetlint\" is also tolerated here \u2014 that specific combination is excluded from this rule's assertion so it can instead be validated separately at its own severity level by [R.38](/rules/R.38.md).\n\n# Details\n\n- soort: Inhoud waarde\n- validatieObjecten: LSkabel, MSkabel, Amantelbuis, Eaarddraad\n- Condition: `Inmeetwijze` must be a member of the configured allowed values, unless the object is an LSkabel with `Subnettype = 'AANSLUITNET'` and `Inmeetwijze = 'Meetlint'` (the `aansluitnet_meetlint_exception`), in which case the assertion is skipped so R.38 can judge it independently.\n- This rule only checks the *value* of Inmeetwijze; whether a value is present at all is checked separately by [R.6](/rules/R.6.md).\n\nThe abstract pattern reads its allowed-values list via `ma:allowed-inmeetwijzen()`, which returns `configuration/sys_config.xml`'s `ToegestaandeInmeetwijzen` entries (GPS, Tachymeter); see [sys-config](/config/sys-config.md). On violation it emits the `inmeetwijze-not-allowed` message from the message catalog; see [localization-messages](/config/localization-messages.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [inmeetwijze_toegestaande_waarde.sch](../../validation_schemas/abstract_patterns/v12/inhoud_waarde/inmeetwijze_toegestaande_waarde.sch)"}, {"id": "rules/R.38", "type": "Validation Rule", "title": "R.38 \u2014 Inmeetwijze aansluitnet toegestaande waarde", "description": "Checks that a LSkabel with Subnettype AANSLUITNET does not use Meetlint as its Inmeetwijze.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 32, "body": "# Overview\n\nFor an LSkabel whose Subnettype is \"AANSLUITNET\", this rule forbids the value \"Meetlint\" for Inmeetwijze. It exists purely to carve this one combination out of the general Inmeetwijze check in [R.37](/rules/R.37.md), so that this specific AANSLUITNET/Meetlint case can be assigned its own severity level per scope, rather than always being treated at the same severity as any other disallowed Inmeetwijze value.\n\n# Details\n\n- soort: Inhoud waarde\n- validatieObjecten: LSkabel\n- Condition: it is not permitted for `Subnettype = 'AANSLUITNET'` and `Inmeetwijze = 'Meetlint'` to hold simultaneously.\n- R.37's abstract pattern explicitly excludes this same AANSLUITNET/Meetlint combination from its own assertion, deferring the judgment to this rule instead. Per the scope model, this combination is typically flagged at a lower severity (e.g. warning) than the general R.37 violation (typically an error).\n\nThe abstract pattern also reads `ma:allowed-inmeetwijzen()` (the `ToegestaandeInmeetwijzen` list in `configuration/sys_config.xml`, i.e. GPS/Tachymeter) purely to include it in the violation message text; see [sys-config](/config/sys-config.md). On violation it emits the `inmeetwijze-not-allowed` message from the message catalog; see [localization-messages](/config/localization-messages.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [inmeetwijze_aansluitnet_toegestaande_waarde.sch](../../validation_schemas/abstract_patterns/v12/inhoud_waarde/inmeetwijze_aansluitnet_toegestaande_waarde.sch)"}, {"id": "rules/R.39", "type": "Validation Rule", "title": "R.39 \u2014 Mof verbonden kabels gelijk verbindingnummer", "description": "Checks that MS/LSkabel objects physically connected to a MS/LSmof share that mof's Verbindingnummer value.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 31, "body": "# Overview\n\nA mof (cable joint) and the cables that connect to it should belong to the same logical connection, so this rule requires that every LSkabel/MSkabel whose geometry touches an LSmof/MSmof's point geometry has the same Verbindingnummer as that mof.\n\n# Details\n\n- soort: Inhoud waarde\n- validatieObjecten: LSmof, MSmof\n- Condition: for an LSmof, the set of LSkabel objects whose line geometry touches the mof's point geometry (`ma:point-touches-line`) must all have `Verbindingnummer` equal to the mof's `Verbindingnummer`; the same check is applied for MSmof against connected MSkabel objects.\n\nThe abstract pattern emits the `connected-cables-have-different-verbindingnummer` message from the message catalog; see [localization-messages](/config/localization-messages.md). This rule complements [R.23](/rules/R.23.md), which also checks Verbindingnummer consistency across connected cables.\n\nThe mof-to-kabel touch check is served by a shared connectivity index rather than a per-rule scan; see [connectivity-index-and-geometry-caching](/decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [mof_verbonden_kabels_gelijk_verbindingnummer.sch](../../validation_schemas/abstract_patterns/v12/inhoud_waarde/mof_verbonden_kabels_gelijk_verbindingnummer.sch)"}, {"id": "rules/R.4", "type": "Validation Rule", "title": "R.4 \u2014 Lijn Geometrie (afstand en hoek van inmeetpunten)", "description": "Checks that line and area-outline geometries respect the minimum/maximum distance between survey points and do not contain sharp kinks between segments.", "tags": ["geometrie"], "group": "rules", "sz": 33, "body": "# Overview\n\nA line (gml:Curve), or the outline of an area (gml:Surface), must meet survey-measurement (inmeet) requirements: consecutive survey points must be neither too close together nor too far apart, and the line must not contain unrealistically sharp kinks between consecutive segments.\n\n# Details\n\n- soort: Geometrie\n- validatieObjecten: Aaanlegtechniek, Amantelbuis, Eaarddraad, LSkabel, MSkabel (segment-length check also applies to MSstation, whose area outline is treated as a line of segments)\n- This rule is implemented as two separate Schematron sub-checks:\n  - **R.4-A** (segment length): each segment between consecutive (inmeet)points of a line or area outline must be at least 10 cm and at most 50 m long. Implemented via `ma:line-segments-not-meeting-length-demands`.\n  - **R.4-B** (segment angle): the angle between consecutive segments of a line must not exceed 45 degrees (no sharp kinks). Applies only to line objects (Aaanlegtechniek, Eaarddraad, LSkabel, MSkabel), not to MSstation areas. Implemented via `ma:line-segments-not-meeting-angle-demands`.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\nLine-buffer and distance calculations underlying this rule's segment-length and angle checks were the subject of recent precision/rounding fixes; see [distance & precision rounding](/decisions/distance-precision-rounding.md) for details.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [lijn_geometrie-afstand_van_inmeetpunten.sch (R.4-A)](../../validation_schemas/abstract_patterns/v12/geometrie/lijn_geometrie-afstand_van_inmeetpunten.sch), [lijn_geometrie-hoek_van_segmenten.sch (R.4-B)](../../validation_schemas/abstract_patterns/v12/geometrie/lijn_geometrie-hoek_van_segmenten.sch)"}, {"id": "rules/R.40", "type": "Validation Rule", "title": "R.40 \u2014 Volgnummer verplicht", "description": "Checks that AprojectReferentie has a Volgnummer value when Tekeningtype is DEELREVISIE or EINDREVISIE.", "tags": ["bestand"], "group": "rules", "sz": 28, "body": "# Overview\n\nA partial or final revision drawing must be sequenced, so this rule requires the AprojectReferentie to carry a Volgnummer value whenever its Tekeningtype is \"DEELREVISIE\" or \"EINDREVISIE\".\n\n# Details\n\n- soort: Bestand\n- validatieObjecten: AprojectReferentie\n- Condition: for any `AprojectReferentie` where `Tekeningtype = 'DEELREVISIE'` or `Tekeningtype = 'EINDREVISIE'`, `Volgnummer` must exist and be non-empty (`ma:element-exists-and-not-empty`).\n\nThe abstract pattern emits the `attribute-not-present` message from the message catalog; see [localization-messages](/config/localization-messages.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [volgnummer_verplicht.sch](../../validation_schemas/abstract_patterns/v12/bestand/volgnummer_verplicht.sch)"}, {"id": "rules/R.41", "type": "Validation Rule", "title": "R.41 \u2014 DatumTijdMutatie gevuld", "description": "Checks that DatumTijdMutatie is populated (and not present) exactly when an NLCS object's Status or Bewerking indicates a mutation, and that it is not a future date.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 31, "body": "# Overview\n\nObjects that represent a change \u2014 anything not in the BESTAAND (existing/unchanged) status, or anything with a Bewerking (edit operation) value \u2014 must record when that mutation happened. This rule enforces that DatumTijdMutatie is present exactly when required, absent otherwise, and never set in the future.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: AlleObjecten (every NLCS object under NLCSnetbeheer except AprojectReferentie)\n- Condition: a mutation date is \"expected\" when `Status != 'BESTAAND'` or `Bewerking` is present and non-empty. If expected, `DatumTijdMutatie` must exist and be non-empty; if not expected, `DatumTijdMutatie` must be absent/empty. Additionally, whenever `DatumTijdMutatie` is present, it may not be later than the current date/time (`xs:dateTime(DatumTijdMutatie) gt current-dateTime()` must be false).\n\nThe abstract pattern emits the `attribute-not-present`, `attribute-present`, and `date-in-the-future` messages from the message catalog; see [localization-messages](/config/localization-messages.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [datumtijdmutatie_gevuld.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/datumtijdmutatie_gevuld.sch)"}, {"id": "rules/R.5", "type": "Validation Rule", "title": "R.5 \u2014 GisId en AssetId", "description": "Checks that objects originating from asset registration (Status BESTAAND, REVISIE, or VERWIJDERD) carry a GisId and AssetId, while newly designed objects (Status NIEUW) do not.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 32, "body": "# Overview\n\nObjects with Status BESTAAND, REVISIE, or VERWIJDERD originate from the asset registration and must therefore carry both a GisId and an AssetId. Conversely, objects with Status NIEUW are created during design or revision and must not have these identifiers filled in.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: AlleObjecten (applies to all NLCS object types)\n- Condition:\n  - If Status is one of BESTAAND, REVISIE, or VERWIJDERD, then GisId and AssetId must both be present (subject to the per-object exceptions below).\n  - If Status is NIEUW, then GisId and AssetId must both be empty.\n  - Objects with Status = REVISIE and Bewerking = VERPLAATSEN are excluded entirely from this check (context excludes them) \u2014 see [R.29](/rules/R.29.md) for the relocation (\"verplaatsen\") exception rule.\n  - Whether an object actually requires a GisId/AssetId is determined by `ma:object-requires-gis-id` / `ma:object-requires-asset-id`, which consult a configured exception list rather than requiring it unconditionally for every object type.\n\nThis rule has a configured exception: `configuration/sys_config.xml`'s `GisIdAssetsIdExceptions/NoGisIdRequired` lists `AmantelbuisInhoud` as an object type that never requires a GisId; see [sys_config reference](/config/sys-config.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [gisid_en_assetid.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/gisid_en_assetid.sch)"}, {"id": "rules/R.6", "type": "Validation Rule", "title": "R.6 \u2014 Inmeetwijze en Nauwkeurigheid Lineaire Assets Elec", "description": "Checks that every linear Elec NLCS object has a value for both Inmeetwijze and Nauwkeurigheid.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "body": "# Overview\n\nLinear Elec objects must record how they were surveyed (Inmeetwijze) and with what accuracy (Nauwkeurigheid), since this metadata is required to assess the reliability of the measured geometry.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: Amantelbuis, Eaarddraad, LSkabel, MSkabel\n- Condition: for each object of these types, `nlcs:Inmeetwijze` must be present and non-empty, and `nlcs:Nauwkeurigheid` must be present and non-empty.\n- This rule only checks *presence* of a value for Inmeetwijze; which specific Inmeetwijze values are actually permitted is constrained separately by [R.37](/rules/R.37.md) and [R.38](/rules/R.38.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [inmeetwijze_en_nauwkeurigheid_assets_elec.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/inmeetwijze_en_nauwkeurigheid_assets_elec.sch)"}, {"id": "rules/R.7", "type": "Validation Rule", "title": "R.7 \u2014 Subnettype gevuld voor LS en MS Kabel", "description": "Checks that MSkabel, LSkabel, and LSmof objects have a value for Subnettype.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 27, "body": "# Overview\n\nMSkabel, LSkabel, and LSmof objects must specify their Subnettype so that the sub-network they belong to is always identifiable.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: MSkabel, LSkabel, LSmof\n- Condition: for each object of these types, `nlcs:Subnettype` must be present and non-empty.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [subnettype_ingevuld_voor_ls_en_ms_kabel.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/subnettype_ingevuld_voor_ls_en_ms_kabel.sch)"}, {"id": "rules/R.8", "type": "Validation Rule", "title": "R.8 \u2014 Verplichte kenmerken Kabels", "description": "Checks that every cable has values for a core set of mandatory attributes, with three additional mandatory attributes for LSkabel.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 31, "body": "# Overview\n\nEvery cable object must carry a baseline set of descriptive attributes (execution, cable construction, manufacturer, connection number, voltage level, phase indication). LSkabel objects additionally must record earthing system, whether they run above ground, and their function.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: HSkabel, LSkabel, MSkabel\n- This rule is implemented as two Schematron sub-checks:\n  - **R.8-A** (general, HSkabel/LSkabel/MSkabel): `nlcs:Uitvoering`, `nlcs:Kabelopbouw`, `nlcs:Fabrikant`, `nlcs:Verbindingnummer`, `nlcs:Spanningsniveau`, and `nlcs:FaseAanduiding` must all be present and non-empty. In addition, if `nlcs:Uitvoering` equals `KEUZE ONTBREEKT IN LIJST`, then `nlcs:OmschrijvingUitvoering` must also be present and non-empty.\n  - **R.8-B** (LSkabel only): `nlcs:Aardingsysteem`, `nlcs:Bovengronds`, and `nlcs:Functie` must all be present and non-empty, in addition to the R.8-A attributes.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verplichte_kenmerken_kabels.sch (R.8-A)](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/verplichte_kenmerken_kabels.sch), [verplichte_kenmerken_kabels-ls_extra.sch (R.8-B)](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/verplichte_kenmerken_kabels-ls_extra.sch)"}, {"id": "rules/R.9", "type": "Validation Rule", "title": "R.9 \u2014 Aanlegdatum gevuld", "description": "Checks that the DatumAanleg (installation date) is populated and does not lie in the future for a broad set of electrical network assets.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 30, "body": "# Overview\nThis rule verifies that every applicable electrical asset carries a populated `DatumAanleg` (installation/laying date) attribute, and that this date is not set later than today. Enforcing this keeps the network's construction-date history complete and internally consistent.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): Eaarddraad, Eaardpen, LSkabel, LSmof, LSoverdrachtspunt, MSstation, MSkabel, MSmof, MSoverdrachtspunt, OVLoverdrachtspunt.\n- Condition: `DatumAanleg` must exist and be non-empty (assert `date-exists`); if present, `DatumAanleg` must be less than or equal to the current date (assert `date-not-in-future`) \u2014 i.e. it may not be a future date.\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `attribute-not-present` and `date-in-the-future` messages from the message catalog; see [localization-messages](../config/localization-messages.md).\n\n# Citations\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [aanlegdatum_gevuld.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/aanlegdatum_gevuld.sch)"}, {"id": "testing/coverage-checks", "type": "Test Subsystem", "title": "Rule and object coverage checks", "description": "Lightweight cross-checks that every documented rule is implemented, and that a rule's asserts touch the object types it claims to.", "tags": ["testing"], "group": "testing", "sz": 31, "body": "# Overview\n\nTwo small, fast (no external dependencies) consistency checks guard against\nthe rule catalog (`doc/NLCSValidatieRegels.xml`) and the Schematron\nimplementation ([schematron-layering](/architecture/schematron-layering.md))\ndrifting apart:\n\n- **`scripts/check_rule_coverage.sh`** \u2014 greps rule numbers out of\n  `doc/NLCSValidatieRegels.xml` (`nummer=\"R.n\"`) and phase ids out of\n  `validation_schemas/base/v12.sch` (`id=\"R.n\"`), diffs the two sets, and\n  emits GitHub Actions annotations for any rule documented but not\n  implemented, or implemented but not documented. Runs standalone as the\n  `RuleCoverage` workflow (no build step needed) \u2014 see\n  [ci/workflows](/ci/workflows.md).\n\n- **`scripts/check_rule_object_coverage.sh`** \u2014 for each rule's\n  [test fixture](/testing/rule-test-fixtures.md) SVRL reports, runs\n  `transformations/check_object_coverage.xsl` against\n  `doc/NLCSValidatieRegels.xml` to confirm the NLCS object types a rule's\n  asserts actually reported on match the `\u003cvalidatieObjecten>` list declared\n  for that rule in the catalog. Posts a coverage table\n  (Rule/Expected/Found/Missing/Extra) to `$GITHUB_STEP_SUMMARY` and fails CI\n  on any mismatch. Runs as the last step of the `RuleValidation` workflow,\n  after fixtures have already been validated.\n\n# Citations\n\n[1] [check_rule_coverage.sh](../../scripts/check_rule_coverage.sh)\n[2] [check_rule_object_coverage.sh](../../scripts/check_rule_object_coverage.sh)"}, {"id": "testing/rule-test-fixtures", "type": "Test Subsystem", "title": "Rule test fixtures", "description": "Hand-authored passing/failing NLCS++ XML fixtures per rule, run through the compiled rule XSLT in CI.", "tags": ["testing"], "group": "testing", "sz": 34, "body": "# Overview\n\nThere is no unit-test framework (no JUnit/pytest) \u2014 rule testing is entirely\ndata-driven. `test/rule_validation_data/v12/R.\u003cn>/` holds hand-authored\nNLCS++ XML fixtures for each rule, split into `passing/` (should produce zero\n`assert-failed` elements) and `failing/` (should trigger the rule's assert).\nFixture filenames describe the geometric/data scenario they exercise \u2014 e.g.\n[R.36](/rules/R.36.md)'s fixtures include `single_line.xml`, `multi_line.xml`,\n`u_turn.xml`, `complex.xml`, and `_offset`/`exact_same_position`/\n`ends_at_same_position` variants that specifically probe distance-calculation\nedge cases (see [distance-precision-rounding](/decisions/distance-precision-rounding.md)).\n\n# How fixtures get validated\n\n`scripts/validate_rules.sh` runs every rule's transpiled XSLT (see\n[compilation-pipeline](/architecture/compilation-pipeline.md)) against both\nits `passing/` and `failing/` fixture sets, writing SVRL reports to\n`rule_validation_reports/v12/\u003crule>/\u003cpassing|failing>/`. `scripts/validate_rule_reports.sh`\nthen reduces each report to a PASS/FAIL verdict via\n`transformations/check_validation_reports.xsl` (PASS = zero asserts for\n`passing/`, at least one for `failing/`) and fails CI \u2014 posting a\n`$GITHUB_STEP_SUMMARY` table of every mismatch \u2014 if any fixture doesn't match\nits expected outcome. This is wired into the `RuleValidation` workflow, see\n[ci/workflows](/ci/workflows.md).\n\nBefore any of this runs, `RuleValidation` also XSD-validates every fixture\nagainst the external Keuzelijst schema via `xerces-cli.jar`, to keep fixtures\nthemselves well-formed NLCS++.\n\n# Related\n\n[test-visualization](/testing/test-visualization.md) renders these same\nfixtures as SVGs. [coverage-checks](/testing/coverage-checks.md) verifies\nevery rule actually has fixtures and that fixtures cover the right object\ntypes.\n\n# Citations\n\n[1] [validate_rules.sh](../../scripts/validate_rules.sh)\n[2] [validate_rule_reports.sh](../../scripts/validate_rule_reports.sh)\n[3] [test/rule_validation_data/v12/](../../test/rule_validation_data/v12/)"}, {"id": "testing/scope-coverage-tests", "type": "Test Subsystem", "title": "Scope coverage tests", "description": "A meta-test verifying the scope/severity engine itself assigns exactly the right rules to every scope, with no gaps or overlaps.", "tags": ["testing"], "group": "testing", "sz": 31, "body": "# Overview\n\nThis test suite doesn't validate end-user NLCS++ data \u2014 it validates that\nthe [scope/severity model](/domain/scope-severity-model.md) itself has full,\nnon-overlapping coverage. `test/scope_validation_data/v12/scope_template.xml`\nis expanded by `transformations/generate_scoped_objects.xsl` into one XML\nobject per (scope \u00d7 Tekeningtype \u00d7 Status \u00d7 Bedrijfstoestand) combination \u2014\nevery cell of the scope matrix gets its own tiny test object.\n\n`scripts/validate_scopes.sh` then, for each generated object:\n1. Runs it through the **scope-checked** schema\n   (`validation_schemas/base_scope_checks/v12.xsl` \u2014 see\n   [compilation-pipeline](/architecture/compilation-pipeline.md)), whose\n   abstract patterns assert an object's actual scope membership.\n2. Compares the resulting SVRL (via `transformations/check_scope_coverage.xsl`)\n   against the expected rule set for that scope, reporting `expected` /\n   `found` / `missing` / `unexpected` rule lists.\n3. Fails CI with a `$GITHUB_STEP_SUMMARY` table (\"Onvolledige of onjuiste\n   scopedekking\") if any scope has missing or unexpected rules.\n\nThis runs as the `ScopeValidation` workflow \u2014 see\n[ci/workflows](/ci/workflows.md). It's the reason\n[scope-bound-vs-scopeless-rules](/decisions/scope-bound-vs-scopeless-rules.md)\nexists as a decision record: gaps caught by this suite are what drove past\nfixes to which rules are unconditionally in-scope.\n\n# Citations\n\n[1] [validate_scopes.sh](../../scripts/validate_scopes.sh)\n[2] [scope_template.xml](../../test/scope_validation_data/v12/scope_template.xml)"}, {"id": "testing/test-visualization", "type": "Test Subsystem", "title": "Test data visualization", "description": "Auto-generated SVG renderings of every rule fixture's geometry, committed to assets/ for the wiki.", "tags": ["testing", "documentation"], "group": "testing", "sz": 31, "body": "# Overview\n\n`transformations/visualize_test_data.xsl` renders each\n[rule test fixture](/testing/rule-test-fixtures.md)'s geometry (points,\nlines, polygons \u2014 layered polygon\u2192line\u2192point\u2192text, each object given a random\ncolor) as an SVG. `scripts/generate_and_compare_svgs.sh` regenerates these\ninto `assets/R.\u003cn>/\u003cpassing|failing>/*.svg`, removing files with no geometry\n(empty `viewBox`) and empty directories.\n\nThese SVGs are **committed to the repo**, not build artifacts \u2014 they exist as\nhuman-reviewable visual documentation of what each fixture geometrically\nrepresents, intended for consumption on the project's external wiki. Because\nthey're checked in, `generate_and_compare_svgs.sh` fails CI\n(`git diff --quiet assets/`) if regenerating them produces a diff, forcing\ncontributors to regenerate and commit SVGs whenever fixture geometry changes.\nThis runs as part of the `DocValidation` workflow \u2014 see\n[ci/workflows](/ci/workflows.md) \u2014 since it's triggered by `doc/**` changes\nalongside the HTML doc regeneration.\n\nThe equivalent script for the rendered rule-catalog HTML\n(`doc/NLCSValidatieRegels.html`, generated from `doc/NLCSValidatieRegels.xml`\nvia `doc/NLCSValidatieRegels.xsl`) is `scripts/generate_and_compare_htmls.sh`,\nwhich follows the same \"regenerate and diff, fail if stale\" pattern.\n\n# Citations\n\n[1] [generate_and_compare_svgs.sh](../../scripts/generate_and_compare_svgs.sh)\n[2] [visualize_test_data.xsl](../../transformations/visualize_test_data.xsl)"}], EDGES=[{"source": "architecture/build-and-release", "target": "ci/workflows"}, {"source": "architecture/build-and-release", "target": "architecture/compilation-pipeline"}, {"source": "architecture/build-and-release", "target": "architecture/xsl-function-libraries"}, {"source": "architecture/build-and-release", "target": "domain/nlcs-plus-plus"}, {"source": "architecture/compilation-pipeline", "target": "architecture/schematron-layering"}, {"source": "architecture/compilation-pipeline", "target": "testing/rule-test-fixtures"}, {"source": "architecture/compilation-pipeline", "target": "testing/scope-coverage-tests"}, {"source": "architecture/compilation-pipeline", "target": "architecture/build-and-release"}, {"source": "architecture/schematron-layering", "target": "architecture/xsl-function-libraries"}, {"source": "architecture/schematron-layering", "target": "domain/scope-severity-model"}, {"source": "architecture/schematron-layering", "target": "architecture/compilation-pipeline"}, {"source": "architecture/xsl-function-libraries", "target": "architecture/schematron-layering"}, {"source": "architecture/xsl-function-libraries", "target": "rules/R.3"}, {"source": "architecture/xsl-function-libraries", "target": "rules/R.4"}, {"source": "architecture/xsl-function-libraries", "target": "rules/R.36"}, {"source": "architecture/xsl-function-libraries", "target": "config/sys-config"}, {"source": "architecture/xsl-function-libraries", "target": "rules/R.37"}, {"source": "architecture/xsl-function-libraries", "target": "rules/R.26"}, {"source": "architecture/xsl-fu const byId=Object.fromEntries(NODES.map(n=>[n.id,n]));

const side=document.getElementById('side');

function relList(title,arr){if(!arr.length)return'';

function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>

 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${relList('Links to',outL[id])}${relList('Cited by',inL[id])}

        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');});}

document.getElementById('type').oninput=applyFilter;
