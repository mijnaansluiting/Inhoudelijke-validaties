const NODES=[{"id": "architecture/build-and-release", "type": "Architecture Component", "title": "Build and release", "description": "How the scope-checked schema, config, and docs are packaged into the versioned deliverable consumers actually use.", "tags": ["architecture, release"], "group": "architecture", "sz": 38, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-05 00:00:00+00:00"}, "verified": [], "sources": [{"title": "bundle.sh", "resource": "../../scripts/bundle.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "Deliverables.yml", "resource": "../../.github/workflows/Deliverables.yml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nThe artifact netbeheerders/contractors actually consume isn't this source\nrepo directly \u2014 it's a packaged zip produced by `scripts/bundle.sh` and\npublished as a GitHub Release asset by the `Deliverables` workflow (see\n[ci/workflows](../ci/workflows.md)) whenever a `v*` tag is pushed.\n\n`bundle.sh` assembles a `dist/` directory that **mirrors the repository\nlayout**, so every relative path in the compiled schema\n(`../../xsl_functions/`, `../../../\u003colder version>/xsl_functions/`) and in\nthe function libraries (`../../configuration/`, `../../localization/`,\n`../../\u003cversion>/doc/`) resolves the\nsame way in `dist/` as in the repository:\n- the **scope-checked** schema of the bundled version, transpiled to XSLT\n  (`\u003cversion>/rules/transpiled_phases/main_scope_checks.xsl` \u2014 see\n  [compilation-pipeline](./compilation-pipeline.md) for how the scope-checked\n  variant is produced), at the same path\n  `dist/\u003cversion>/rules/transpiled_phases/main_scope_checks.xsl`\n- the [xsl-function-libraries](./xsl-function-libraries.md) of every version\n  the bundled `main.sch` includes them from (its own and/or inherited ones,\n  read from its `xsl:include` lines) under `dist/\u003cthat version>/xsl_functions/`\n- `configuration/` (`sys_config.xml`, `user_config.xml`, `versions.xml`)\n  under `dist/configuration/`\n- the version's rule catalog (`\u003cversion>/doc/NLCSValidatieRegels.xml`,\n  needed at runtime by `rule_scope_functions.xsl`) under\n  `dist/\u003cversion>/doc/`\n- `localization/messages.xml` under `dist/localization/`\n\n...then zips `dist/` as `nlcspp_inhoudelijke_validaties.zip`. This is the\n\"run the same validations on every device\" deliverable the\n[project's stated goal](../domain/nlcs-plus-plus.md) refers to: a\nself-contained bundle a consumer can run against their own NLCS++ files with\njust Saxon, no dependency on this build toolchain.\n\n# Version scoping\n\nDecided 2026-11-04: **one zip with every version**; revised 2026-11-05, when\nthe `released` flag was dropped, so every registered NLCS++ version is shipped.\n`bundle.sh` takes no argument; it loops over `versions.sh list` and copies the\nfiles above for each. Consumers run the compiled schema of the NLCS++ version\nthey need, `dist/\u003cversion>/rules/transpiled_phases/main_scope_checks.xsl`\n(e.g. `dist/v12.1/\u2026`). `configuration/versions.xml` is bundled unchanged.\n`bundle.sh` starts from an empty `dist/` and fails if a version's\n`main_scope_checks.xsl` hasn't been compiled. The `Deliverables` workflow adds\nscope checks to every version (a version's scope-checked schema includes the\nscope-checked abstract patterns of the versions it inherits from) and compiles\nevery version before bundling. The software release number only exists as\nthe `v*` git tag that triggers the workflow and names the GitHub Release; the\nzip is always `nlcspp_inhoudelijke_validaties.zip`."}, {"id": "architecture/compilation-pipeline", "type": "Architecture Component", "title": "Compilation and execution pipeline", "description": "How a Schematron rule becomes runnable XSLT and produces an SVRL validation report.", "tags": ["architecture, build"], "group": "architecture", "sz": 41, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-02 00:00:00+00:00"}, "verified": [], "sources": [{"title": "transpile_phases.sh", "resource": "../../scripts/transpile_phases.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "transpile_phase_wrapper.xsl", "resource": "../../wrappers/transpile_phase_wrapper.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "validate_rules.sh", "resource": "../../scripts/validate_rules.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nThere is no persistent validation service \u2014 this repo is a toolchain that\ncompiles [Schematron rules](./schematron-layering.md) into\nstandalone XSLT, which is then run directly against an NLCS++ XML instance.\nThe pipeline, driven by bash scripts and **Saxon-HE** (Java, XSLT/XPath 3.0)\nplus **SchXSLT2** (a Schematron\u2192XSLT transpiler):\n\n1. **Dependency install** (`scripts/install_dependencies.sh`) \u2014 downloads\n   Saxon-HE, SchXSLT2's `transpile.xsl`, a custom `xerces-cli.jar` (XSD\n   validation), and the external `NLCS_Netbeheer.xsd` /\n   `NLCS_Netbeheer\u003cprovider>Import_Keuzelijst.xsd` schemas that define the\n   NLCS++ input format itself, from `schemas.mijnaansluiting.nl`. None of\n   these are vendored \u2014 they're fetched fresh on every run.\n\n2. **Per-phase transpilation** (`scripts/transpile_phases.sh`) \u2014 for every\n   rule (a Schematron \"phase\"), runs SchXSLT2's `transpile.xsl` (wrapped by\n   `wrappers/transpile_phase_wrapper.xsl`, which works around Saxon CLI not\n   accepting namespaced `schxslt:phase` parameters) against\n   a version's `\u003cversion>/rules/main.sch`, producing one standalone `.xsl`\n   stylesheet per rule in `\u003cversion>/rules/transpiled_phases/\u003crule>.xsl`\n   (git-ignored):\n\n   ```bash\n   java -jar saxon-he.jar -xsl:wrappers/transpile_phase_wrapper.xsl \\\n     -s:v12.1/rules/main.sch \\\n     -o:v12.1/rules/transpiled_phases/R.36.xsl phase=R.36\n   ```\n\n   SchXslt copies `main.sch`'s `\u003cxsl:include href=\"../../xsl_functions/\u2026\"/>`\n   (or `../../../\u003colder version>/xsl_functions/\u2026` when inherited)\n   lines unchanged into every compiled file, and Saxon resolves them from\n   the compiled file's own location. So **every** stylesheet compiled from a\n   `main.sch` lives exactly three folders below the repository root, in\n   `\u003cversion>/rules/transpiled_phases/`: the per-rule phases and the\n   scope-checked `main_scope_checks.xsl` alike. A compiled file anywhere else\n   cannot find the function libraries in `\u003cversion>/xsl_functions/`.\n\n3. **Execution** \u2014 running that generated XSLT via Saxon against an NLCS++\n   XML instance produces an **SVRL** report (Schematron Validation Report\n   Language) listing `\u003csuccessful-report>`/`\u003cassert-failed>` elements\n   annotated with the `scope`/`severity`/`object-type` properties from\n   [schematron-layering](./schematron-layering.md).\n   `scripts/validate_rules.sh` does this for every rule against its\n   [test fixtures](../testing/rule-test-fixtures.md), and\n   `transformations/check_validation_reports.xsl` reduces a report to a\n   PASS/FAIL verdict by counting `\u003cassert-failed>` elements.\n\n4. **Scope-checked variant** \u2014 `scripts/add_scope_checks.sh` runs\n   `transformations/abstract_patterns_scope_checks.xsl` and\n   `transformations/base_scope_checks.xsl` to produce a rewritten schema\n   (`\u003cversion>/rules/abstract_patterns_scope_checks/`,\n   `\u003cversion>/rules/main_scope_checks.sch`, all git-ignored) whose abstract patterns\n   additionally assert that each object falls within its expected scope \u2014\n   this variant is what [scope-coverage-tests](../testing/scope-coverage-tests.md)\n   and the release bundle ([build-and-release](./build-and-release.md))\n   use, not the plain rule logic. CI transpiles it with\n   `-s:\u003cversion>/rules/main_scope_checks.sch\n   -o:\u003cversion>/rules/transpiled_phases/main_scope_checks.xsl`.\n\nThis whole pipeline exists so that a \"phase\" (= one rule) can be compiled and\nrun in isolation, which is what makes per-rule pass/fail testing in CI\ntractable \u2014 see [rule-test-fixtures](../testing/rule-test-fixtures.md)."}, {"id": "architecture/multiversion-plan", "type": "Plan", "title": "Multiversion implementation plan", "description": "Ordered steps to make scripts, CI and the release support several NLCS++ versions, with what is done and what remains.", "tags": ["versioning, plan, ci"], "group": "architecture", "sz": 58, "status": "draft", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "Multiversion model", "resource": "../decisions/multiversion-model.md", "cid": "decisions/multiversion-model", "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nImplementation order for the [multiversion-model](../decisions/multiversion-model.md),\nfirst to last. Each step must leave the results for `v12.1` (the released\nrule set, formerly `v2026.1.0`) unchanged. Since 2026-11-05 a version is an\nNLCS++ version. `v12` held the fictional test changes of the former\n`v9999.1.0` until it was removed on 2026-11-10; `v12.1` is now the only\nversion.\n\n# Done\n\n1. **Version model decided** \u2014 [multiversion-model](../decisions/multiversion-model.md).\n2. **Version registry** \u2014 `configuration/versions.xml` and\n   `scripts/versions.sh` (see [version-registry](../config/version-registry.md));\n   scripts and workflows read the version from it.\n3. **Per-version config and catalog** \u2014 `sys_config.xml` block per version,\n   selected through `$active_version` in each `main.sch`; catalog in\n   `\u003cversion>/doc/`; `scripts/check_active_version.sh` in CI.\n4. **XSD per version** \u2014 `schemas/\u003cxsd version>/`, test data checked against\n   its own version's XSD and `VersieNummer` (= the version id without `v`) by\n   `scripts/validate_test_data_xsd.sh`.\n5. **Folders per NLCS++ version** (2026-11-05) \u2014 `v2026.1.0` \u2192 `v12.1`,\n   `v9999.1.0` \u2192 `v12`, inheritance flipped so `v12.1` includes from `v12`;\n   registry reduced to `id`, `released` flag dropped; rule validation\n   reports byte-identical to before. See\n   [multiversion-model](../decisions/multiversion-model.md).\n6. **`v12` removed** (2026-11-10) \u2014 everything `v12.1` inherited from it\n   (patterns, abstract patterns, fixtures, SVGs, `xsl_functions/`) moved\n   into `v12.1/`; `v12`'s registry entry and `sys_config` block removed;\n   every rule's `laatstGewijzigd` is `v12.1`. This also settled step 5.7\n   and the step 9 decision below.\n\n**Repository layout: one folder per version at the root.** Everything\nversion-specific lives under `\u003cversion>/` (e.g. `v12.1/`):\n`rules/` (`main.sch`, `patterns/`, `abstract_patterns/` and the generated\n`transpiled_phases/`, `abstract_patterns_scope_checks/`,\n`main_scope_checks.{sch,xsl}`), `doc/NLCSValidatieRegels.{xml,html}`,\n`test/rule_validation_data/`, `test/scope_validation_data/`, `assets/`\n(committed test-data SVGs) and the generated `rule_validation_reports/`,\n`validation_test_results/`, `scoped_objects/` and `scoped_objects_reports/`.\nFunction libraries are versioned as `\u003cversion>/xsl_functions/` (inherited\nlike patterns). Shared tooling stays at the root: `configuration/`,\n`localization/`, `transformations/`, `wrappers/`, `scripts/`, `schemas/`,\nand `doc/NLCSValidatieRegels.{xsl,css,xsd}`. The release `dist/` mirrors\nthis layout (see [build-and-release](./build-and-release.md)).\n\n# Step 5: run the pipeline per version\n\n1. **Fix the scope-validation crash.** All objects in\n   `scope_template.xml` share ID `0000`, which makes the `\u003cmap>` in\n   `connectivity_functions.xsl` fail with \"Duplicate key\"; build it with\n   `map:merge` and `'duplicates': 'combine'`. Make `validate_scopes.sh` fail\n   when Saxon fails or a report is empty.\n2. **`main.sch` include checks** (new script, CI `covered-rules` job): every\n   include exists; phases and pattern includes match; includes only point to\n   the version itself or older versions; a rule's pattern files\n   come from one version; a version with its own pattern for a rule has\n   that rule's test data.\n3. **Rule-source helper**: reads a version's `main.sch` and prints, per\n   phase, the version folder its pattern is included from. A rule's test\n   data comes from `\u003cthat version>/test/rule_validation_data/R.x/`\n   (`scripts/versions.sh rules`).\n4. **Scripts per version**, using the helper:\n   * `transpile_phases.sh` loops over the phases in `main.sch` (not over\n     test data folders) and writes to\n     `\u003cversion>/rules/transpiled_phases/\u003crule>.xsl`, the same\n     folder as the compiled `main_scope_checks.xsl` (`main.sch` includes\n     `../../xsl_functions/` or `../../../\u003colder version>/xsl_functions/`,\n     which only resolve from there);\n   * `validate_rules.sh`, `validate_rule_reports.sh` (report links point to\n     the fixture's real folder), `check_rule_object_coverage.sh` read\n     fixtures through the helper;\n   * `add_scope_checks.sh` runs for **every** version folder before any\n     scope schema is transpiled, because `../../vX/rules/abstract_patterns/\u2026`\n     includes become `../../vX/rules/abstract_patterns_scope_checks/\u2026`;\n   * `validate_scopes.sh` writes to `\u003cversion>/scoped_objects/` and\n     `\u003cversion>/scoped_objects_reports/`;\n   * `generate_and_compare_svgs.sh` writes `\u003cversion>/assets/` for each\n     version's own fixtures (the current SVGs live in\n     `v12.1/assets/`).\n5. **CI matrix**: a first job outputs `scripts/versions.sh matrix`; the\n   rule, scope and docs jobs run per version (`fail-fast: false`) with the\n   version in every artifact name. `install-dependencies` stays a single\n   job.\n6. **Verify**: every result for `v12.1` is identical to before.\n7. ~~**Make the `v12` test data pass the XSD check.**~~ Resolved by removing\n   `v12` (2026-11-10): the inherited fixtures, which were 12.1 data checked\n   against XSD 12, now live in `v12.1`, and `validate_test_data_xsd.sh v12.1`\n   passes.\n\n# Step 6: version scripts\n\n* `scripts/new_version.sh \u003cnew>` (e.g. `v13`): registry entry;\n  copy the previous version's `main.sch`, turning its own relative pattern\n  includes (`patterns/\u2026`) into `../../\u003cprevious>/rules/patterns/\u2026` and keeping\n  existing `../../vX/rules/` includes (abstract-pattern includes already always name\n  a version folder); set `active_version`; empty `patterns/`,\n  `abstract_patterns/` and test data folders; copy the scope template,\n  catalog and `sys_config` block, all under the new `\u003cnew>/` root folder.\n* ~~`scripts/rename_version.sh`~~ \u2014 no longer needed: fixes are made in\n  place and folders are never renamed (2026-11-05).\n\n# Step 7: fictional version\n\nDone differently: `v12` (formerly `v9999.1.0`) added `R.44`, removed `R.13`\nand edited `R.15` compared to `v12.1`. It was removed on 2026-11-10 without\never passing CI (step 5.7), so inheritance between versions is untested\nuntil the next real NLCS++ version is added.\n\n# Step 8: selection and release\n\n* Validation-time version selection: wire `version_functions.xsl`\n  (`ma:select-version`) into a dispatcher that picks the version from\n  the root's `VersieNummer` or the optional `version` parameter, and fails on\n  an unsupported XSD version.\n* ~~Release packaging~~ \u2014 decided 2026-11-04: one zip with every version\n  (see [build-and-release](./build-and-release.md)).\n\n# Step 9: clean up\n\n* ~~Decide what happens to the fictional rule changes in `v12`~~ \u2014\n  decided 2026-11-10: `v12` was removed; its `R.44` and `R.15` override\n  were dropped.\n* ~~Update the OKF pages that still describe `v12` paths~~ \u2014 done\n  2026-11-02 together with the per-version root restructure."}, {"id": "architecture/rule-catalog", "type": "Data Format", "title": "Rule catalog (NLCSValidatieRegels.xml)", "description": "The per-version rule catalog XML, its shared XSD, and the XSL that renders it to the HTML documentation.", "tags": ["documentation, schema, rules"], "group": "architecture", "sz": 38, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCSValidatieRegels.xsd", "resource": "../../doc/NLCSValidatieRegels.xsd", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "NLCSValidatieRegels.xsl", "resource": "../../doc/NLCSValidatieRegels.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "v12.1 rule catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nEvery NLCS++ version folder has its own rule catalog,\n`\u003cversion>/doc/NLCSValidatieRegels.xml` (namespace\n`NLCSValidatieRegelsNameSpace`). It is the source of truth for the rule\nmetadata described in [rules](../rules/index.md) and for the scopes in the\n[scope \u00d7 severity model](../domain/scope-severity-model.md). All versions share\none schema, `doc/NLCSValidatieRegels.xsd`, and one stylesheet,\n`doc/NLCSValidatieRegels.xsl`, which renders the catalog to\n`\u003cversion>/doc/NLCSValidatieRegels.html`.\n\n# Schema\n\nRoot `NLCSValidatieregels` holds `validatieRegels` followed by `scopes`.\n\nEach `validatieRegel` (`ValidatieRegelType`)[^xsd]:\n\n| Item | Kind | Required | Content |\n|---|---|---|---|\n| `nummer` | attribute | yes | `xs:ID`, e.g. `R.1`; referenced from scopes via `xs:IDREF` |\n| `naam` | attribute | yes | Rule name |\n| `beschrijving` | element | yes | Short description |\n| `soort` | element | yes | `SoortValidatieRegelType` (Bestand, Geometrie, Verplichte waarde, \u2026) |\n| `definitie` | element | yes | Definition the Schematron rule is implemented from |\n| `toelichting` | element | no | Extra explanation |\n| `validatieObjecten` | element | yes | List of `validatieObject/naam` (`NLCSObjectType`) |\n| `laatstGewijzigd` | element | yes | `XsdVersieType`: the NLCS++ XSD version in which the rule was last changed |\n\n`XsdVersieType` is an `xs:string` restricted to the pattern\n`v[0-9]+(\\.[0-9]+)*` (e.g. `v12`, `v12.1`), so a new NLCS++ version needs\nno XSD change. The value must equal the version folder the rule's concrete\npattern (`patterns/R.x.sch`, `R.x_A.sch`, \u2026) is included from in that\nversion's `rules/main.sch`; `scripts/check_rule_coverage.sh` enforces this\n([coverage-checks](../testing/coverage-checks.md)). Since `v12` was removed (2026-11-10), `v12.1` is the only version and has\nits own pattern for every rule, so every rule is `v12.1`.\n\nEach `scope` has a `naam` attribute, a `tekeningSoort`, `statussen`,\n`bedrijfsToestanden` and `scopeValidatieRegels` (pairs of `nummer` + `niveau`).\n\n# HTML rendering\n\nThe XSL renders each rule as a table with one row per child element[^xsl].\nRow labels are the element name with its first letter capitalised, except\n`laatstGewijzigd`, which is shown as \"Laatst gewijzigd\". The HTML is\ncommitted; CI regenerates it and fails if it differs. See\n[ci/workflows](../ci/workflows.md) (`validate-docs` job).\n\n# Consumers\n\n* `v12.1/xsl_functions/rule_scope_functions.xsl` reads `soort` and the scopes at\n  validation time ([xsl-function-libraries](./xsl-function-libraries.md)).\n* `transformations/check_object_coverage.xsl`,\n  `check_scope_coverage.xsl` and `generate_scoped_objects.xsl`\n  ([coverage-checks](../testing/coverage-checks.md)).\n* `scripts/check_rule_coverage.sh`, `check_active_version.sh` and\n  `bundle.sh` ([build-and-release](./build-and-release.md)).\n\n[^xsd]: `doc/NLCSValidatieRegels.xsd`, `ValidatieRegelType`.\n[^xsl]: `doc/NLCSValidatieRegels.xsl`, templates `tablefy` and `human-string`."}, {"id": "architecture/schematron-layering", "type": "Architecture Component", "title": "Schematron rule layering", "description": "The three-layer design that separates rule metadata from rule logic \u2014 base schema, concrete pattern, abstract pattern.", "tags": ["architecture, schematron"], "group": "architecture", "sz": 40, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "v12.1/rules/main.sch", "resource": "../../v12.1/rules/main.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "v12.1/rules/patterns/R.36.sch", "resource": "../../v12.1/rules/patterns/R.36.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "v12.1/rules/abstract_patterns/geometrie/afstand_mantelbuis_tot_inhoud.sch", "resource": "../../v12.1/rules/abstract_patterns/geometrie/afstand_mantelbuis_tot_inhoud.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nThe validation logic is a **Schematron** schema (`queryBinding=\"xslt3\"`) split\nacross three layers so that rule metadata (id, scope, severity) stays separate\nfrom the actual check logic, and so a single implementation can be reused by\nsub-checks that only differ in parameters:\n\n1. **`\u003cversion>/rules/main.sch`** (e.g. `v12.1/rules/main.sch`) \u2014 the\n   root schema of an NLCS++ version. Declares\n   namespaces (`ma`, `gml`, `xs`, `nlcs`, `nvr`, `math`), a global\n   `\u003cproperties>` block (`scope`, `rule-number`, `severity`, `object-type`,\n   `object-id`, `geometries`, `missing-attributes` \u2014 attached to asserts for\n   downstream reporting), one Schematron `\u003cphase>` per rule id (`R.1` \u2026 `R.41`, with\n   `R.4` and `R.8` each activating two patterns), the 6\n   [xsl-function-libraries](./xsl-function-libraries.md) via\n   `xsl:include href=\"../../xsl_functions/\u2026\"` (own) or\n   `\"../../../\u003colder version>/xsl_functions/\u2026\"` (inherited), then `include`s of every\n   concrete pattern and every abstract pattern file \u2014 the version's own\n   (`patterns/R.\u003cn>.sch`) or inherited from an older version folder\n   (`../../\u003colder version>/rules/patterns/\u2026`, `../../\u003cversion>/rules/abstract_patterns/\u2026`;\n   see [multiversion-model](../decisions/multiversion-model.md)).\n\n2. **`\u003cversion>/rules/patterns/R.\u003cn>.sch`** (concrete patterns) \u2014 one\n   per rule id (`R.4_A.sch`/`R.4_B.sch` and `R.8_A.sch`/`R.8_B.sch` for the\n   two split rules). Each is a thin, non-abstract pattern that only sets\n   `\u003cparam>`s \u2014 `rule_number`, `scope` (via `ma:scope-name(.)`), `severity`\n   (via `ma:rule-severity-within-scope(\u003cn>, .)`, see\n   [scope-severity-model](../domain/scope-severity-model.md)), `object_type`,\n   `object_id` \u2014 and declares `is-a=\"\u003cabstract-pattern-id>\"` to inherit the\n   actual rule body. Example (`R.36.sch`):\n\n   ```xml\n   \u003cpattern id=\"R.36\" is-a=\"afstand-mantelbuis-tot-inhoud\">\n       \u003cparam name=\"rule_number\" value=\"36\"/>\n       \u003cparam name=\"scope\" value=\"ma:scope-name(.)\"/>\n       \u003cparam name=\"severity\" value=\"ma:rule-severity-within-scope(36, .)\"/>\n       \u003cparam name=\"object_type\" value=\"name(.)\"/>\n       \u003cparam name=\"object_id\" value=\"nlcs:ID\"/>\n   \u003c/pattern>\n   ```\n\n3. **`\u003cversion>/rules/abstract_patterns/\u003ccategory>/\u003cname>.sch`**\n   (abstract patterns) \u2014 `abstract=\"true\"` patterns containing the real\n   `\u003crule context=\"...\">`/`\u003cassert>` XPath 3.0 logic. Grouped into 8 category\n   directories that mirror each rule's `soort`: `bestand`, `consistentie`,\n   `document`, `geometrie`, `inhoud_waarde`, `netlogica`, `topologie`,\n   `verplichte_waarde`. Every [rule concept](../rules/index.md) links to its\n   specific abstract pattern file.\n\nThis indirection means the concrete/abstract split can host multiple\nconcrete patterns pointing at one abstract implementation (parameterized\nreuse), and keeps a rule's identity/metadata (id, scope wiring) decoupled\nfrom what it actually checks.\n\n# Turning this into something runnable\n\nThe `.sch` files above are Schematron source, not directly executable.\n[compilation-pipeline](./compilation-pipeline.md) describes how\nSchXSLT2 transpiles a chosen phase (rule) of this schema into standalone\nXSLT that Saxon can run against an NLCS++ instance document."}, {"id": "architecture/xsl-function-libraries", "type": "Architecture Component", "title": "XSL function libraries", "description": "The versioned custom ma:-namespace XSLT function libraries every rule's logic is built from.", "tags": ["architecture, xslt"], "group": "architecture", "sz": 44, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "v12.1/xsl_functions/", "resource": "../../v12.1/xsl_functions/", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\n`\u003cversion>/xsl_functions/` holds XSLT 3.0 function libraries in a custom\n`ma:` (mijnaansluiting) namespace, used by every abstract pattern. They are\nversion-managed like patterns (see\n[multiversion-model](../decisions/multiversion-model.md)): currently only\n`v12.1/xsl_functions/` exists, and `v12.1` uses its own copy.\nA version's [`\u003cversion>/rules/main.sch`](./schematron-layering.md) includes its\nown libraries as `../../xsl_functions/\u2026` or an older version's as\n`../../../\u003colder version>/xsl_functions/\u2026` (both resolved from the compiled\noutput in `\u003cversion>/rules/transpiled_phases/`).\nThe libraries load their data relative to their own folder:\n`document('../../configuration/\u2026')`, `document('../../localization/messages.xml')`\nand `document('../../' || $active_version || '/doc/NLCSValidatieRegels.xml')`,\nso an inherited library still reads the catalog of the version being run;\nthe release `dist/` mirrors this layout so the same paths resolve there.\n`version_functions.xsl` (version selection from `configuration/versions.xml`)\nlives in the same folder but is not included by any `main.sch`.\n\n| File | Purpose |\n|---|---|\n| `geometry_functions.xsl` | Parses and analyzes GML geometry (`gml:Point`/`gml:Curve`/`gml:Surface`): intersection/containment checks, segment length and angle calculations, distance calculations. The largest library \u2014 backs geometric rules like [R.3](../rules/R.3.md), [R.4](../rules/R.4.md), and [R.36](../rules/R.36.md). |\n| `config_functions.xsl` | Reads the active version's block of [`configuration/sys_config.xml`](../config/sys-config.md) \u2014 decimal precision, allowed-value lists, thresholds, exceptions \u2014 e.g. `ma:allowed-inmeetwijzen()` for [R.37](../rules/R.37.md), `ma:mantelbuis-inhoud-asset-max-distance()` for [R.36](../rules/R.36.md), `ma:map-mof-functie()` for [R.26](../rules/R.26.md), and the GisId/AssetId exception lookups for [R.5](../rules/R.5.md). |\n| `localization_functions.xsl` | Looks up a message by id and language in [`localization/messages.xml`](../config/localization-messages.md) (per the `Language` setting in `configuration/user_config.xml`), substituting `{n}` placeholders with rule-specific values before attaching the text to an `assert`. |\n| `rule_scope_functions.xsl` | The scope/severity engine \u2014 reads the `\u003cscopes>` section of the active version's catalog, `\u003cversion>/doc/NLCSValidatieRegels.xml`, to compute `ma:scope-name`, `ma:rule-severity-within-scope`, and `ma:rule-within-scope-for-object`, matching an object's Tekeningtype/Status/Bedrijfstoestand to one of the 8 scopes. See [scope-severity-model](../domain/scope-severity-model.md). |\n| `helper_functions.xsl` | Misc utilities shared across abstract patterns (e.g. object-existence and attribute-presence helpers used by many \"verplichte kenmerken\" rules), plus `ma:parse-point`/`ma:parse-line`/`ma:parse-area` \u2014 GML coordinate-string parsing, memoized per geometry node via lazily-built XPath maps since [geometry-parse-caching](../decisions/geometry-parse-caching.md), used directly by [R.3](../rules/R.3.md), [R.4](../rules/R.4.md), [R.21](../rules/R.21.md), [R.36](../rules/R.36.md) and transitively by [R.20](../rules/R.20.md)/[R.22](../rules/R.22.md)/[R.23](../rules/R.23.md)/[R.25](../rules/R.25.md)/[R.26](../rules/R.26.md)/[R.39](../rules/R.39.md) via `connectivity_functions.xsl`. Parsed coordinates are `array(xs:double)` values (a point is `array{x, y[, z]}`), not XML element nodes \u2014 see [coord-representation-array-vs-node](../decisions/coord-representation-array-vs-node.md) for the ~34% performance benchmark behind that choice. |\n| `connectivity_functions.xsl` | A shared mof/overdrachtspunt \u2194 kabel/eaarddraad touch index (`ma:touching-kabels`, `ma:touching-moffen`, `ma:touching-kabels-via-moffen`), computed once per run and reused by [R.20](../rules/R.20.md), [R.22](../rules/R.22.md), [R.23](../rules/R.23.md), [R.25](../rules/R.25.md), [R.26](../rules/R.26.md), and [R.39](../rules/R.39.md) instead of each doing its own brute-force scan. See [connectivity-index-and-geometry-caching](../decisions/connectivity-index-and-geometry-caching.md) for why. |"}, {"id": "ci/workflows", "type": "CI/CD Pipeline", "title": "GitHub Actions workflows", "description": "The 3 workflows \u2014 CI (rules/scopes/docs/coverage on every PR), Deliverables (release zip) and GitHub Pages (rule catalog).", "tags": ["ci-cd"], "group": "ci", "sz": 37, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-09 00:00:00+00:00"}, "verified": [], "sources": [{"title": ".github/workflows/", "resource": "../../.github/workflows/", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nThere are three workflows. The jobs run on `ubuntu-latest` with JDK 21\nTemurin. Every version-dependent step takes the version explicitly, today\nalways `$(scripts/versions.sh latest)` (see\n[version-registry](../config/version-registry.md)); paths are the per-version\nroot folders of [multiversion-model](../decisions/multiversion-model.md)\n(`\u003cversion>/rules/`, `\u003cversion>/doc/`, \u2026).\n\n| Workflow | Trigger | Purpose |\n|---|---|---|\n| `CI.yml` | PR, push to `main`/`develop` | Jobs in order (each needs the previous): **`covered-rules`** \u2014 no toolchain; cross-checks rule ids between `\u003cversion>/doc/NLCSValidatieRegels.xml` and `\u003cversion>/rules/main.sch` via [coverage-checks](../testing/coverage-checks.md), and runs `check_active_version.sh`. **`install-dependencies`** \u2014 `scripts/install_dependencies.sh` once (Saxon-HE, SchXSLT2, xerces-cli, `schemas/\u003cxsd>/`), shared with later jobs as an artifact. **`validate-rules`** \u2014 XSD-validates rule fixtures \u2192 [transpiles phases](../architecture/compilation-pipeline.md) into `\u003cversion>/rules/transpiled_phases/` \u2192 runs every rule against its [passing/failing fixtures](../testing/rule-test-fixtures.md) \u2192 uploads `v*/rule_validation_reports` as the `rule-validation-reports` artifact \u2192 checks pass/fail verdicts \u2192 [checks object coverage](../testing/coverage-checks.md). **`validate-scopes`** \u2014 `add_scope_checks.sh`, transpiles `-s:$version/rules/main_scope_checks.sch -o:$version/rules/transpiled_phases/main_scope_checks.xsl`, then runs [scope-coverage-tests](../testing/scope-coverage-tests.md). **`validate-docs`** \u2014 XSD-validates `$version/doc/NLCSValidatieRegels.xml` against the shared `doc/NLCSValidatieRegels.xsd` (`test/XMLValidation.java`) \u2192 regenerates and diff-checks `$version/doc/NLCSValidatieRegels.html` and the [test-visualization](../testing/test-visualization.md) SVGs in `$version/assets/`, failing if either is stale. |\n| `Deliverables.yml` | push of a `v*` tag | Adds scope checks to every version and compiles the scope-checked schema of every version, runs [build-and-release](../architecture/build-and-release.md)'s `bundle.sh` (all NLCS++ versions in one zip), uploads `dist/` as an artifact and `nlcspp_inhoudelijke_validaties.zip` as a GitHub Release asset. |\n| `DeployWithGhPages.yml` | push to `main` | Publishes the whole repository to GitHub Pages with an `index.html` generated by `scripts/generate_pages_index.sh`: a Dutch landing page linking to `\u003cversion>/doc/NLCSValidatieRegels.html` for every version in [the registry](../config/version-registry.md), newest first, the latest marked \"nieuwste\". The script fails if a registered version has no HTML. |"}, {"id": "config/localization-messages", "type": "Configuration", "title": "Localization messages (messages.xml)", "description": "The nl/en message catalog that validation rules use to produce human-readable failure text.", "tags": ["configuration, localization"], "group": "config", "sz": 45, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "messages.xml", "resource": "../../localization/messages.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "localization_functions.xsl", "resource": "../../v12.1/xsl_functions/localization_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\n`localization/messages.xml` is a flat catalog of `\u003cmessage id=\"...\">` entries,\neach with an `nl` and `en` `\u003cmessage-text>` variant. Message text may contain\n`{1}`, `{2}`, ... placeholders that\n`\u003cversion>/xsl_functions/localization_functions.xsl` substitutes with\nrule-specific values (attribute names, expected/found values, thresholds)\nbefore the text is attached to a Schematron `assert`. Which language variant\nis picked is controlled by [user-config](./user-config.md)'s `Language`\nsetting.\n\nAbstract pattern implementations call into this catalog by message id \u2014 each\n[rule concept](../rules/index.md) that emits a specific message links back here.\nSeveral ids are generic and reused across many \"verplichte kenmerken\" style\nrules (e.g. `attribute-not-present`, `property-required-for-statuses`), while\nothers are specific to a single rule (e.g.\n`inhoud-assets-not-in-range-of-mantelbuis` for\n[R.36](../rules/R.36.md)).\n\n# Schema\n\n| Message id | Used for |\n|---|---|\n| `no-nlcs-objects-present` | [R.1](../rules/R.1.md) \u2014 file has no NLCS objects. |\n| `invalid-status-for-tekening-type` | [R.2](../rules/R.2.md) \u2014 Status not allowed for the Tekeningsoort. |\n| `object-outside-project-area` | [R.3](../rules/R.3.md) \u2014 geometry outside the project area. |\n| `line-segment-measurement-incorrect` | [R.4](../rules/R.4.md) (R.4-A) \u2014 segment shorter than 10cm or longer than 50m. |\n| `line-angle-larger-than-45` | [R.4](../rules/R.4.md) (R.4-B) \u2014 angle between segments exceeds 45\u00b0. |\n| `attribute-not-present` / `attribute-present` | Generic mandatory-attribute presence/absence checks (R.9\u2013R.15, R.40, R.41, etc). |\n| `attributes-not-present` | Plural of `attribute-not-present`, for one assert reporting several missing attributes; chosen by `ma:missing-attributes-message`. |\n| `property-required-for-statuses` / `property-not-allowed-for-statuses` | Generic status-conditional attribute checks (e.g. R.5). |\n| `object-not-present` | Generic required-related-object checks (R.31\u2013R.33). |\n| `date-in-the-future` | [R.9](../rules/R.9.md), [R.41](../rules/R.41.md) \u2014 a date attribute is in the future. |\n| `point-not-connected-to-any-line` | [R.20](../rules/R.20.md) \u2014 point object not connected to a cable. |\n| `cable-not-connected-to-valid-object` | [R.21](../rules/R.21.md) \u2014 invalid cable endpoint. |\n| `connected-cable-does-not-match-netvlak` | [R.22](../rules/R.22.md) \u2014 joined cables differ in netvlak. |\n| `connected-cable-does-not-match-property` | [R.23](../rules/R.23.md) \u2014 joined cables differ in a shared attribute. |\n| `fase-not-the-same-as-uitvoering` | [R.24](../rules/R.24.md) \u2014 Fase/Uitvoering mismatch. |\n| `connected-fases-not-allowed` / `connected-fases-do-not-match` / `connected-fases-do-not-split` | [R.25](../rules/R.25.md) \u2014 phase-combination checks at a joint. |\n| `cable-amount-incorrect` / `cable-amount-unknown` / `existing-cable-not-connected-to-new-cable` | [R.26](../rules/R.26.md) \u2014 cable-count-vs-Functie checks. |\n| `mantelbuis-inhoud-diameter-larger-than-own` | [R.27](../rules/R.27.md) \u2014 nested duct diameter too large. |\n| `inhoud-found` / `inhoud-not-found` | [R.28](../rules/R.28.md) \u2014 duct-content presence/absence vs Bedrijfstoestand. |\n| `verplaatsing-incorrectly-applied` | [R.29](../rules/R.29.md) \u2014 relocation not recorded with a matching pair. |\n| `mantelbuis-inhoud-is-self` / `mantelbuis-id-does-not-refer-to-mantelbuis` / `object-type-inhoud-does-not-match-inhoud` | [R.30](../rules/R.30.md) \u2014 duct-content reference checks. |\n| `soort-bestand-not-correct` | [R.31](../rules/R.31.md)\u2013[R.33](../rules/R.33.md) \u2014 attached-document SoortBestand mismatch. |\n| `revisie-no-maaiveldhoogte-present` | [R.35](../rules/R.35.md) \u2014 missing ground-level object in a revision. |\n| `inmeetwijze-not-allowed` | [R.37](../rules/R.37.md), [R.38](../rules/R.38.md) \u2014 disallowed survey method. |\n| `inhoud-assets-not-in-range-of-mantelbuis` | [R.36](../rules/R.36.md) \u2014 duct content farther than the configured max distance. |\n| `connected-cables-have-different-verbindingnummer` | [R.39](../rules/R.39.md) \u2014 cable/joint Verbindingnummer mismatch. |\n\nThis table lists the ids confirmed while authoring the rule concepts; it is\nnot necessarily exhaustive of every id in the file."}, {"id": "config/sys-config", "type": "Configuration", "title": "System configuration (sys_config.xml)", "description": "Version-scoped thresholds, allowed-value lists, and exceptions consumed by several validation rules.", "tags": ["configuration"], "group": "config", "sz": 34, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "sys_config.xml", "resource": "../../configuration/sys_config.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "config_functions.xsl", "resource": "../../v12.1/xsl_functions/config_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\n`configuration/sys_config.xml` holds tunable values for rule logic, with\none full `\u003cversion id=\"v12.1\">` block per NLCS++ version (no\ndefaults or inheritance between blocks; see\n[multiversion-model](../decisions/multiversion-model.md)). Values are read at\nvalidation time by functions in\n`\u003cversion>/xsl_functions/config_functions.xsl`, which select the\nblock whose `id` equals `$active_version` (declared by each version's\n`main.sch`) and raise an error if there is none. A rule's actual behavior\ncan be adjusted without touching Schematron pattern code.\n`scripts/check_active_version.sh` fails CI when a registered version has no\nblock.\n\n# Schema\n\n| Field | Value (v12.1) | Used by |\n|---|---|---|\n| `DecimalPrecision` | `3` | Numeric rounding precision used across geometric/numeric comparisons. |\n| `MofFuncties/Aftak` | `AFTAK SPLITSEND` | [R.26](../rules/R.26.md) \u2014 maps joint Functie values to the \"Aftak\" category. |\n| `MofFuncties/Eind` | `EINDMOF`, `EINDDOP`, `LOODKOP`, `EIND GEAARD` | [R.26](../rules/R.26.md) \u2014 \"Eind\" category. |\n| `MofFuncties/Verbinding` | `VERBINDING`, `ZEGELWIJZIGING`, `MANTELREPARATIE` | [R.26](../rules/R.26.md) \u2014 \"Verbinding\" category. |\n| `MofFuncties/Faseovergang` | `3FASE 3x1FASE` | [R.26](../rules/R.26.md) \u2014 \"Faseovergang\" category. |\n| `ToegestaandeInmeetwijzen/Inmeetwijze` | `GPS`, `Tachymeter` | [R.37](../rules/R.37.md) \u2014 allowed survey-method values. |\n| `GisIdAssetsIdExceptions/NoGisIdRequired` | `AmantelbuisInhoud` | [R.5](../rules/R.5.md) \u2014 object types exempt from the GisId requirement. |\n| `MantelbuisInhoudMaxAfstand` | `1` (meter) | [R.36](../rules/R.36.md) \u2014 max allowed distance between a protection pipe and its content. |\n\n`GisIdAssetsIdExceptions` also has a commented-out `NoAssetIdRequired` slot,\nreserved for future AssetId exceptions but currently unused.\n\n# Related\n\n[user-config.md](./user-config.md) holds the separate `Language`\nsetting consumed by [localization-messages](./localization-messages.md).\nThe `DecimalPrecision`/rounding behavior here is closely related to the\ngeometric precision issues discussed in\n[distance-precision-rounding](../decisions/distance-precision-rounding.md)."}, {"id": "config/user-config", "type": "Configuration", "title": "User configuration (user_config.xml)", "description": "The single language setting that selects which localized message text validation reports use.", "tags": ["configuration, localization"], "group": "config", "sz": 25, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "user_config.xml", "resource": "../../configuration/user_config.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "localization_functions.xsl", "resource": "../../v12.1/xsl_functions/localization_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\n`configuration/user_config.xml` is a minimal, per-run config file with a\nsingle field:\n\n```xml\n\u003cconfig>\n    \u003cLanguage>nl\u003c/Language>\n\u003c/config>\n```\n\n`Language` (`nl` or `en`) selects which `xml:lang` variant\n`\u003cversion>/xsl_functions/localization_functions.xsl` picks when\nresolving a message id from\n[localization-messages](./localization-messages.md) for an SVRL assert\nreport."}, {"id": "config/version-registry", "type": "Configuration", "title": "Version registry (versions.xml)", "description": "The single list of NLCS++ versions that have a rule folder; read by scripts, CI and the XSL version-selection functions.", "tags": ["configuration, versioning"], "group": "config", "sz": 38, "status": "draft", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "versions.xml", "resource": "../../configuration/versions.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "versions.sh", "resource": "../../scripts/versions.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "version_functions.xsl", "resource": "../../v12.1/xsl_functions/version_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\n`configuration/versions.xml` lists the versions the repository holds rules\nfor. A version is an **NLCS++ version** (see\n[multiversion-model](../decisions/multiversion-model.md)): its id is the NLCS++\nversion prefixed with `v` and equals its root folder name (e.g. `v12.1/`).\nScripts, CI and XSL read the list from here instead of hardcoding folder\nnames.\n\n# Schema\n\nOne `\u003cversion/>` element per line (the bash helper parses lines, not XML).\nThere is no schema for the registry; `scripts/check_active_version.sh`\nchecks that every registered version has a `\u003cversion>/rules/main.sch`\ndeclaring a matching `active_version`, a `sys_config` block and a catalog\n`\u003cversion>/doc/NLCSValidatieRegels.xml`, and that every `v*/` root folder is\nregistered.\n\n| Attribute | Required | Meaning |\n|---|---|---|\n| `id` | yes | Folder name: `v` + the NLCS++ (NLCS_Netbeheer XSD) version, e.g. `v12.1`. Unique. |\n\nThe XSD version is derived from the id (`v12.1` \u2192 `12.1`, so\n`schemas/12.1/`), so there is no separate `nlcspp` attribute. There is no\n`released` flag: every registered version is tested in CI, shipped and\nselectable.\n\n```xml\n\u003cversion id=\"v12.1\"/>\n```\n\n# Bash: scripts/versions.sh\n\n| Command | Output |\n|---|---|\n| `list` | All ids, oldest first (`sort -V`, so `v12.10` comes after `v12.9`). |\n| `latest` | Newest version. |\n| `resolve \u003cversion>` | The id itself if it is registered; fails otherwise. Only the folder name is accepted (`v12.1`, not `12.1`). |\n| `xsd \u003cversion>` | That version's XSD version: the id without the `v`. |\n| `rules \u003cversion>` | One `R.x \u003cversion>` line per phase in `\u003cversion>/rules/main.sch`: the version folder the rule's pattern is included from, parsed from includes matching `(../../v*/rules/)?patterns/R.*` (a relative `patterns/R.x.sch` means the version itself). Scripts use it to find a rule's test data in `\u003cthat version>/test/rule_validation_data/`. |\n| `xsds` | XSD versions of all versions. |\n| `matrix` | JSON array of all ids, for a CI matrix. |\n\n`VERSIONS_REGISTRY` overrides the file path (used for testing). Every\nper-version script in `scripts/` **requires** a version argument; there is no\ndefault. Without one, `versions.sh resolve` stops with \"a version is\nrequired\". The workflows pass the version explicitly. Scripts that work on\nall versions at once (`check_active_version.sh`, `install_dependencies.sh`,\n`bundle.sh`) take no argument; `validate_test_data_xsd.sh` takes an optional\none and checks every version without it.\n\n# XSL: version_functions.xsl\n\n`ma:select-version($document, $requested)` returns the version to validate\nwith: `$requested` if it is a registered id, else `v` + the `VersieNummer`\nattribute of the file's root element (`ma:file-xsd-version`) if that is\nregistered. Empty means unsupported, and the caller must report that as an\nerror. Helpers: `ma:resolve-version`, `ma:file-xsd-version`,\n`ma:version-for-xsd`. Not yet included by any `main.sch`; wiring happens with\nthe per-version dispatch."}, {"id": "decisions/connectivity-index-and-geometry-caching", "type": "Decision", "title": "Shared connectivity index and geometry caching for mof/kabel touch checks", "description": "Why R.20, R.22, R.23, R.25, R.26, and R.39 now share one precomputed touch index instead of each doing its own brute-force geometry scan.", "tags": ["decision, performance, geometry"], "group": "decisions", "sz": 62, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-27 00:00:00+00:00"}, "verified": [], "sources": [{"title": "connectivity_functions.xsl", "resource": "../../v12.1/xsl_functions/connectivity_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Context\n\nA local stress-test document (not in the repository: 286 LSkabel, 251 LSmof, 136\nLSoverdrachtspunt, 99 OVLoverdrachtspunt, 7 MSkabel; geometries averaging ~32\nvertices, one line with ~593) took **132 seconds** to validate under\n\"Bestaande Situatie\" \u2014 far too slow for a single file. An earlier, separate\nfix to [xsl-function-libraries](../architecture/xsl-function-libraries.md)'s\n`geometry_functions.xsl` (rounding/line-buffer precision work, unrelated to\nthis decision) had already cut that from an even higher baseline; this\ndecision covers a second, structural fix.\n\nProfiling pointed at [R.20](../rules/R.20.md), [R.22](../rules/R.22.md),\n[R.23](../rules/R.23.md), [R.25](../rules/R.25.md), and [R.26](../rules/R.26.md) \u2014\nplus [R.39](../rules/R.39.md), found to share the identical pattern during\nthis investigation \u2014 as the dominant cost, all built on `ma:point-touches-line`.\n\n# Root causes\n\nReading every abstract pattern that calls `ma:point-touches-line`/\n`ma:parse-line`/`ma:parse-point` (in `helper_functions.xsl`/\n`geometry_functions.xsl`) surfaced two compounding problems:\n\n1. **No caching.** `ma:parse-line`/`ma:parse-point` re-tokenize the raw GML\n   coordinate string and rebuild a fresh element tree on *every* call. Every\n   rule invoked them inside a per-context-node predicate that rescans the\n   whole candidate population, so the same object's geometry was rebuilt\n   thousands of times per run.\n2. **No shared \"which kabels does this mof touch\" index.** R.20, R.22, R.23,\n   R.25, R.26, and R.39 each independently brute-force scanned\n   `//nlcs:MSkabel`/`//nlcs:LSkabel` for every mof/overdrachtspunt. Since\n   the benchmark ran the full combined schema (all phases in one\n   stylesheet \u2014 see [compilation-pipeline](../architecture/compilation-pipeline.md)),\n   this identical relationship was recomputed 6 separate times per run.\n   R.22 and R.23 additionally **nested** the scan: for every kabel, find\n   connected moffen, then re-scan *all* cables again per connected mof \u2014\n   effectively O(cables\u00b2 \u00d7 moffen-per-cable).\n\n# Decision\n\nAdded `\u003cversion>/xsl_functions/connectivity_functions.xsl`\n(see [xsl-function-libraries](../architecture/xsl-function-libraries.md)),\ncomputed lazily once per validation run and reused by all 6 rules:\n\n- Each covered object's geometry (`MSmof`/`LSmof`/`Eaardmof`/\n  `MSoverdrachtspunt`/`LSoverdrachtspunt`/`OVLoverdrachtspunt` on the point\n  side; `MSkabel`/`LSkabel`/`HSkabel`/`Eaarddraad` on the line side) is\n  parsed exactly once.\n- The touch relationship is represented as **two XPath 3.1 maps** \u2014\n  `mof-id -> touching kabel-ids` and its inverse \u2014 rather than a constructed\n  element tree indexed via `xsl:key`. The inverse is derived from the\n  forward map with `map:merge(..., map{'duplicates':'combine'})` instead of\n  re-running the geometry scan a second time.\n- Three public functions replace every rule's inline brute-force predicate:\n  `ma:touching-kabels($point)`, `ma:touching-moffen($kabel)`, and\n  `ma:touching-kabels-via-moffen($moffen, $kabel_type)` (the \"second hop\"\n  R.22/R.23 need \u2014 composes two O(1)-ish map lookups instead of a nested\n  full-document rescan).\n- R.20, R.22, R.23, R.25, R.26, and R.39's abstract patterns were rewritten\n  to call these functions. Every `\u003cassert>` test/message is byte-for-byte\n  unchanged \u2014 only the source of each `$connected_*` variable changed.\n\nThis eliminates the \u00d76 duplicated computation (built once instead of once\nper rule) and replaces R.22/R.23's O(cables\u00b2 \u00d7 moffen) nested rescan with\nO(1)-ish composed lookups, without changing what any rule actually checks.\n\n# Why maps instead of a constructed tree + `xsl:key`\n\nThe first implementation represented the touch table as constructed\n`\u003cTouch mof_id=\"...\" kabel_id=\"...\" kabel_type=\"...\"/>` elements, indexed via\n`xsl:key` \u2014 the more \"obvious\" XSLT idiom, and consistent with how\n[rule_scope_functions.xsl](../architecture/xsl-function-libraries.md) already\nuses a top-level `document()`-backed variable. It worked correctly in\nisolated tests (a minimal stylesheet including just the geometry/config/\nhelper/connectivity libraries) but **intermittently failed once compiled\ninto the full 41-rule schema** and run against the ~142,000-pair cross\nproduct (486 points \u00d7 293 lines), with a Saxon error claiming an empty\nsequence where a point or line node was expected.\n\nThis was tracked down to a genuine Saxon lazy/tail-call evaluation defect,\nnot a logic bug: wrapping every individual pair's check in `xsl:try`/\n`xsl:catch` and re-running all ~142,000 pairs produced **zero** real\nfailures \u2014 every pair evaluates correctly on its own. The error only\nappeared when Saxon was left to lazily defer and batch many thousands of\nthese calls inside one large `xsl:variable`'s constructed content, at which\npoint it would occasionally force a deferred call against a stale context.\n`xsl:try` reliably avoided it (by forcing eager evaluation) in isolation,\nbut the failure mode reappeared once nested inside the much larger compiled\nschema's own template-dispatch machinery, so it wasn't a fix that could be\ntrusted in production.\n\nRebuilding the same relationship as two XPath maps \u2014 `xsl:map`/\n`xsl:map-entry` construction with a pure `for ... return ... if ... then ...\nelse` XPath expression as each entry's value, no element nodes, no\n`xsl:key` \u2014 sidesteps that evaluation path entirely and has run cleanly\nthrough the full schema and benchmark repeatedly since. It's also arguably\nthe more idiomatic XPath 3.1 way to express a lookup table that was never\nmeant to be traversed as a document.\n\n# Explicitly out of scope\n\n- **Spatial/grid indexing.** The remaining cost is the one-time O(points \u00d7\n  lines) index build itself \u2014 every point is still bounding-box-tested\n  against every candidate line at least once. A grid/bucket pre-filter\n  (only comparing objects whose bounding boxes fall in the same or\n  neighboring cell) would cut this further but is a separate, larger piece\n  of work not undertaken here. **Update:** before pursuing this, see\n  [geometry-parse-caching](./geometry-parse-caching.md) \u2014 a cheaper\n  fix (memoizing the geometry parse itself, not the spatial comparison) cut\n  the benchmark further from ~27s to 10s, and R.21's uncached endpoint scan\n  (see next bullet) turned out to be a bigger contributor than this\n  decision's own remaining points\u00d7lines cost.\n- **R.21** (`geldig_eindpunt_kabel.sch`) calls `ma:parse-point` on the same\n  object populations but checks point-to-point coincidence, not\n  point-to-line touching \u2014 a structurally different relationship the\n  connectivity index above doesn't model. It was deliberately left\n  untouched to keep this change's blast radius limited to the 6 rules that\n  actually share the rewritten relationship, rather than also modifying\n  `ma:parse-point`/`ma:parse-line` themselves (which are called by all 41\n  rules, not just these 6). **Update:** [geometry-parse-caching](./geometry-parse-caching.md)\n  did modify those two functions (adding memoization only, signatures\n  unchanged) and found R.21's O(kabels \u00d7 moffen) reparsing \u2014 not the\n  points\u00d7lines cost above \u2014 to be the dominant remaining cost at benchmark\n  scale.\n\n# Verification\n\n- All 41 rules' `passing`/`failing` fixtures under\n  [rule-test-fixtures](../testing/rule-test-fixtures.md) produced identical\n  PASS/FAIL verdicts before and after (`scripts/validate_rules.sh` +\n  `scripts/validate_rule_reports.sh`), including R.20/22/23/25/26/39.\n- [coverage-checks](../testing/coverage-checks.md)\n  (`check_rule_coverage.sh`, `check_rule_object_coverage.sh`): zero\n  mismatches.\n- Full schema against the local stress-test document: **132s \u2192 ~27s** in this\n  environment (~5x), consistent with removing the \u00d76 cross-rule duplication\n  and the R.22/R.23 nested rescans."}, {"id": "decisions/coord-representation-array-vs-node", "type": "Decision", "title": "Adopted array(xs:double) coordinate representation (~34% faster than Coord nodes)", "description": "Benchmark finding that representing parsed coordinates as Coord XML element nodes was measurably slower than a flat array(xs:double) representation, independent of the caching/connectivity-index wins; subsequently adopted.", "tags": ["decision, performance, geometry"], "group": "decisions", "sz": 47, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-27 00:00:00+00:00"}, "verified": [], "sources": [{"title": "helper_functions.xsl", "resource": "../../v12.1/xsl_functions/helper_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "geometry_functions.xsl", "resource": "../../v12.1/xsl_functions/geometry_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "geometry-parse-caching", "resource": "/decisions/geometry-parse-caching.md", "cid": "decisions/geometry-parse-caching", "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "connectivity-index-and-geometry-caching", "resource": "/decisions/connectivity-index-and-geometry-caching.md", "cid": "decisions/connectivity-index-and-geometry-caching", "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Context\n\n[geometry-parse-caching](./geometry-parse-caching.md) and\n[connectivity-index-and-geometry-caching](./connectivity-index-and-geometry-caching.md)\nboth improved performance without questioning the coordinate\n*representation* itself: parsed geometry had been a sequence of `Coord` XML\nelement nodes (`\u003cCoord>\u003cX>.../X>\u003cY>.../Y>\u003c/Coord>`) ever since the shared\n`ma:parse-point`/`ma:parse-line`/`ma:parse-area` abstraction in\n[helper_functions.xsl](../architecture/xsl-function-libraries.md) was\nintroduced between release `v12.0.0` and `v12.1.0` \u2014 confirmed via\n`git show v12.1.0:validation_schemas/xsl_functions/helper_functions.xsl`,\nthe `Coord`-node shape already existed at v12.1.0, only the memoization\nwrapper came later. Before v12.0.0 there was no shared parse function at\nall: every rule inlined `tokenize(normalize-space(...))` into a **flat\nsequence of `xs:double`**, indexed positionally, with fully separate 2D/3D\nfunction variants.\n\nQuestion investigated: is constructing `Coord` element nodes (vs. plain\nnumeric values) itself a meaningful cost, separate from the caching/index\nwins already measured?\n\n# Method\n\nA literal flat `xs:double*` sequence (the true v12.0.0 style) can't coexist\nwith the current unified 2D/3D `geometry_functions.xsl`, which relies\nthroughout on per-vertex sequence operations (`$line[1]`,\n`subsequence($line, $i, 2)`, `min($line/X)`). Reproducing v12.0.0's\nduplicated 2D/3D function set would be a much larger, unrelated rewrite.\nInstead, a parsed point is now represented as\n**`array(xs:double)`** (`array{x, y}` / `array{x, y, z}`) \u2014 a genuine list of\ndoubles with zero XML node-construction overhead, while\n`array(xs:double)*` stayed a flat, indexable sequence so every existing\nper-vertex operation (`$line[1]`, `subsequence`, `count`) kept working\nunchanged. This isolated the one variable (element-node construction) while\nholding the memoized-cache architecture, connectivity index, and full 41-rule\nset constant. Changes were confined to `helper_functions.xsl`,\n`geometry_functions.xsl`, and one type annotation in\n`connectivity_functions.xsl` \u2014 no `.sch` abstract pattern needed to change,\nsince they only call the `ma:*` functions and index parsed lines\npositionally, never dereferencing `/X` etc. directly.\n\nThe benchmark harness, the stress-test document and the raw measurements\nwere local working files and are not in the repository.\n\n# Verification\n\n- All 41 rules' `passing`/`failing` fixtures\n  ([rule-test-fixtures](../testing/rule-test-fixtures.md)) produced\n  byte-identical SVRL output between the current `Coord`-node code and the\n  array-based variant (after excluding a leaked `xmlns:array` namespace\n  declaration via `exclude-result-prefixes`).\n- The local stress-test document validated under both variants produced\n  exactly the same 7388 `svrl:failed-assert`/`svrl:successful-report` count.\n\n# Finding\n\nFull schema against the local stress-test document, 10 runs per variant, controlled\ncomparison (same 41 rules, same memoized-cache + connectivity-index\narchitecture, only the representation differs):\n\n| Variant | Coord representation | Mean | Stdev |\n|---|---|---|---|\n| pre-migration | `Coord` element nodes | 11.00s | 0.67 |\n| adopted | `array(xs:double)` | 7.30s | 0.67 |\n\n**11.00s \u2192 7.30s: a 3.70s / 33.6% reduction.** `Coord`-element-node\nconstruction and traversal (`generate-id()` cache keys, node copying when\n`Coord` sequences are subsequenced/reversed/passed around, element\nconstruction in `ma:coord`) is a real, measurable cost at stress-test\nscale \u2014 smaller than the prior caching/connectivity-index wins (132s \u2192 27s \u2192\n10s) but not noise: roughly the same order of magnitude as the\nmemoized-parsing win alone (~2.7x) layered on top of an already\ncached/indexed baseline (~1.5x further).\n\nA `v12.0.0` release build (30 rules, no cache, no connectivity index, flat doubles) was\nalso benchmarked for historical context (5.10s mean) but is **not** a\ncontrolled data point \u2014 it differs from current in four ways at once, not\njust representation.\n\n# Status\n\n**Adopted (2026-07-27).** This started as an investigation \u2014 the experimental\n`array(xs:double)` code was first reverted (`git checkout --`) after the\ninitial benchmark, weighing the ~34% win against touching every consumer in\n`geometry_functions.xsl`/`helper_functions.xsl`/`connectivity_functions.xsl`.\nIt was subsequently re-applied to the same 3 files (byte-identical to the\ninvestigation's already-verified code) and re-verified before landing:\nfixture PASS/FAIL and the stress-test 7388-assert count both stayed identical, and a freshly rebuilt\n`dist/` benchmarked at ~7.6s mean (5 runs), consistent with the original\n`array(xs:double)` measurement. The committed codebase now uses\n`array(xs:double)`, not `Coord` element nodes."}, {"id": "decisions/distance-precision-rounding", "type": "Decision", "title": "Rounding geometric comparisons to millimeters", "description": "Why distance/touch checks round to a configured decimal precision instead of comparing raw floating-point doubles.", "tags": ["decision, geometry"], "group": "decisions", "sz": 37, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "5a58dee \u2014 R.36: Fix line buffer calculation with sequential coords at same position (#90)", "resource": "https://github.com/mijnaansluiting/Inhoudelijke-validaties/commit/5a58dee5ae6f40613922d7ad15207575701a2d7a", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "1e78ce1 \u2014 Limit rounding to millimeters for final interaction checks (#92)", "resource": "https://github.com/mijnaansluiting/Inhoudelijke-validaties/commit/1e78ce1313103608cae025b24ac141a9d7403b31", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "geometry_functions.xsl", "resource": "../../v12.1/xsl_functions/geometry_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "helper_functions.xsl", "resource": "../../v12.1/xsl_functions/helper_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Context\n\nSeveral geometric checks \u2014 [R.3](../rules/R.3.md) (geometry within project\narea), [R.4](../rules/R.4.md) (line segment length/angle), and\n[R.36](../rules/R.36.md) (duct-to-content distance) \u2014 rely on\n`geometry_functions.xsl` computing whether two coordinates are \"the same\npoint,\" whether a point lies exactly on a segment, or whether a buffered line\ntouches an area. Comparing raw `xs:double` results of floating-point distance\nmath directly (`= 0`, `a + b = c`) is fragile: real-world surveyed\ncoordinates that are geometrically coincident can differ by a\nfloating-point epsilon, causing an intersection/touch check to spuriously\nfail.\n\n# Decision\n\nTwo related fixes, in order:\n\n1. **`5a58dee` \u2014 \"R.36: Fix line buffer calculation with sequential coords\n   at same position\" (#90)** (2026-05-01). `ma:buffer-line`'s\n   left/right-bounds construction produced degenerate orthogonal segments\n   when two sequential coordinates in a line were at the exact same\n   position (segment length 0) \u2014 a legitimate scenario for surveyed/GML\n   data with duplicate vertices. Fixed by skipping zero-length segments\n   when building the buffer's bounding polygon (`ma:segment-length($segment)\n   != 0` guard), verified with a new `complex.xml` fixture exercising\n   exactly this shape (see [rule-test-fixtures](../testing/rule-test-fixtures.md)).\n\n2. **`1e78ce1` \u2014 \"Limit rounding to millimeters for final interaction\n   checks\" (#92)** (2026-05-07). Introduced `configuration/sys_config.xml`'s\n   `DecimalPrecision` (`3`, i.e. millimeter precision at the project's\n   coordinate units) and a new `ma:trim-decimals` helper\n   (`round($number * 10^precision) div 10^precision`) in\n   [config/sys-config.md](../config/sys-config.md)-backed\n   `helper_functions.xsl`. `ma:point-equals-point` and\n   `ma:point-touches-segment` now round both sides of their equality checks\n   through `ma:trim-decimals` before comparing, instead of comparing raw\n   doubles. `ma:line-touches-area` also gained an additional interaction\n   check (`some $point in $area satisfies ma:point-touches-line($point,\n   $line)`) to catch a line barely touching an area's boundary \u2014 verified\n   with the new `line_barely_touching_area.xml` fixture under\n   [R.3](../rules/R.3.md).\n\n# Why this matters\n\nAny new geometric check built on `point-equals-point`, `point-touches-segment`,\nor `line-touches-area` inherits millimeter-level tolerance automatically \u2014\ndon't reintroduce raw `=` comparisons on distance/coordinate doubles, and\ndon't change `DecimalPrecision` without checking which rules' pass/fail\nfixtures assume 1mm tolerance (notably [R.36](../rules/R.36.md)'s `_offset`\nand `exact_same_position` fixtures)."}, {"id": "decisions/geometry-parse-caching", "type": "Decision", "title": "Memoized geometry parsing (ma:parse-point/ma:parse-line/ma:parse-area)", "description": "Why parsing a geometry's raw GML coordinate string is now cached per node instead of redone on every call, and why R.21 was the dominant remaining cost the connectivity-index fix didn't touch.", "tags": ["decision, performance, geometry"], "group": "decisions", "sz": 50, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-27 00:00:00+00:00"}, "verified": [], "sources": [{"title": "helper_functions.xsl", "resource": "../../v12.1/xsl_functions/helper_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "geldig_eindpunt_kabel.sch", "resource": "../../v12.1/rules/abstract_patterns/topologie/geldig_eindpunt_kabel.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "connectivity-index-and-geometry-caching", "resource": "/decisions/connectivity-index-and-geometry-caching.md", "cid": "decisions/connectivity-index-and-geometry-caching", "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Context\n\nFollow-on to [connectivity-index-and-geometry-caching](./connectivity-index-and-geometry-caching.md),\nwhich cut a local stress-test document (not in the repository) from 132s\nto ~27s by\nbuilding one shared mof/kabel touch index instead of 6 duplicated\nbrute-force scans. That decision explicitly left `ma:parse-point`/\n`ma:parse-line`/`ma:parse-area` (in\n[helper_functions.xsl](../architecture/xsl-function-libraries.md)) unmodified,\nnoting they're \"called by all 41 rules, not just these 6\" \u2014 too broad a\nblast radius for that pass.\n\nInvestigating a proposal to add a quad tree for the remaining\n[R.20](../rules/R.20.md)/[R.22](../rules/R.22.md)/[R.23](../rules/R.23.md)/\n[R.25](../rules/R.25.md)/[R.26](../rules/R.26.md)/[R.39](../rules/R.39.md)\npoints\u00d7lines cost surfaced a bigger, cheaper, unrelated problem first:\n`ma:parse-point`/`ma:parse-line`/`ma:parse-area` re-tokenize the raw GML\ncoordinate string and rebuild a fresh `\u003cCoord>` element per vertex on\n*every single call*, with zero memoization of the parse itself \u2014 only the\nfinal touch/connectivity *result* was ever cached.\n\n# Root cause\n\nAuditing every call site (only 5 abstract patterns plus\n`connectivity_functions.xsl` call these functions directly \u2014 `geometry_functions.xsl`'s\nfunctions all take already-parsed nodes, so the blast radius is smaller than\nthe \"all 41 rules\" concern above suggested):\n\n- [R.21](../rules/R.21.md) (`geldig_eindpunt_kabel.sch`) \u2014 **the dominant cost**.\n  For every `MSkabel`/`LSkabel`/`Eaarddraad`, it re-parses every candidate\n  `MSmof`/`MSoverdrachtspunt`/`MSstation`/etc. geometry twice (once for the\n  start point check, once for the end point) via `some $x_geometry in\n  //nlcs:Xxx/nlcs:Geometry satisfies ma:point-connected-to-point(...,\n  ma:parse-point($x_geometry))` \u2014 true O(kabels \u00d7 moffen) reparsing, never\n  covered by the connectivity index (R.21 checks point-to-point coincidence,\n  a structurally different relationship, and was deliberately left alone by\n  that decision).\n- `connectivity_functions.xsl` itself re-parses every candidate line's\n  geometry for every point while building its touch index \u2014 O(points \u00d7\n  lines) reparses, on top of the O(points \u00d7 lines) bbox/segment comparisons\n  already accounted for.\n- [R.3](../rules/R.3.md), [R.4](../rules/R.4.md), [R.36](../rules/R.36.md)\n  re-parse a geometry once per rule instance/candidate \u2014 smaller\n  contributors but the same underlying gap.\n\n# Decision\n\nWrapped `ma:parse-point`/`ma:parse-line`/`ma:parse-area` in\n[helper_functions.xsl](../architecture/xsl-function-libraries.md) with three\nlazily-evaluated global XPath 3.1 maps (`parsed_point_cache`,\n`parsed_line_cache`, `parsed_area_cache`), each keyed by `generate-id()` of\nthe `nlcs:Geometry` node and built once per validation run by scanning all\ngeometries of the matching shape (`gml:Point`/`gml:LineString`/`gml:Polygon`).\nThe three public functions now do a single `map:get(...)` instead of\nre-tokenizing and rebuilding the `Coord*` tree.\n\nFunction signatures are unchanged (still take a geometry node, still return\nthe same parsed node sequence), so **no `.sch` abstract pattern needed to\nchange** \u2014 the blast radius is one file, despite the functions being used by\n11 rules in total (R.3, R.4-A, R.4-B, R.21, R.36 directly; R.20/22/23/25/26/39\ntransitively via `connectivity_functions.xsl`).\n\nFollowed the same pure-map style connectivity_functions.xsl already\nestablished \u2014 `\u003cmap>`/`\u003cmap-entry>` construction, no constructed element\ntree indexed via `xsl:key` for the cache itself \u2014 since that combination\npreviously caused a real Saxon lazy-evaluation defect at ~142k-pair scale\n(see that decision's \"Why maps instead of a constructed tree\" section). Every\ngeometry node passed to these functions was confirmed (by reading every call\nsite) to always be a real, stable source-document node, never synthetic, so\n`generate-id()` is a safe cache key.\n\n# Verification\n\n- All 41 rules' `passing`/`failing` fixtures under\n  [rule-test-fixtures](../testing/rule-test-fixtures.md)\n  (`scripts/transpile_phases.sh` + `scripts/validate_rules.sh` +\n  `scripts/validate_rule_reports.sh`) produced identical PASS/FAIL before\n  and after.\n- [coverage-checks](../testing/coverage-checks.md)\n  (`check_rule_coverage.sh`, `check_rule_object_coverage.sh`): zero\n  mismatches.\n- Full schema against the local stress-test document: **~27s \u2192 10s**\n  (consistent across repeated runs), with the resulting SVRL report\n  containing the identical 7389 `failed-assert`/`successful-report`\n  elements as the pre-change baseline \u2014 same findings, ~2.7x faster.\n\n# Relation to spatial indexing (quad tree)\n\nThis fix was prioritized ahead of a proposed quad tree for the\npoints\u00d7lines connectivity-index cost, since a spatial index only prunes\n*which* lines get compared to a point \u2014 it doesn't touch the fact that every\ncandidate's geometry was being fully re-tokenized and rebuilt on every\ncomparison. With parsing now O(1) amortized per geometry, the residual\npoints\u00d7lines comparison cost (the one thing a quad tree/grid would target)\nis much smaller than it was; whether it's still worth a spatial index should\nbe re-assessed against the new 10s baseline rather than the old 27s one."}, {"id": "decisions/multiversion-model", "type": "Decision", "title": "Multiversion model", "description": "What a version (an NLCS++ version) is, how versions share and override schemas, config, catalog and test data, and how a version is selected at validation time.", "tags": ["decision, versioning, architecture"], "group": "decisions", "sz": 70, "status": "draft", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "#136 \u2014 setup for multiversion support (v12 -> v2026.1.0 folders)", "resource": "https://github.com/mijnaansluiting/Inhoudelijke-validaties/pull/136", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "install_dependencies.sh (NLCS_NETBEHEER_VERSION)", "resource": "../../scripts/install_dependencies.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "sys_config.xml", "resource": "../../configuration/sys_config.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Context\n\nPR #136 moved the Schematron and rule test data from `v12` into\n`v2026.1.0` folders, but everything else (scripts, CI, `sys_config.xml`,\nthe rule catalog, the bundle) still assumed exactly one version. Before\ngeneralizing that, the version model itself had to be decided. The\ndecisions below were made by the team (interview, 2026-10-27) and are the\ncontract the implementation steps build on.\n\nRevised 2026-11-05: versions were software releases (`vYEAR.RELEASE.FIX`\nfolders such as `v2026.1.0`, renamed on every fix). They are now **NLCS++\nversions**: one set of rules per NLCS++ version. `v2026.1.0` became `v12.1`;\nthe fictional test version `v9999.1.0` became `v12`, and the inheritance\ndirection was flipped so that the newer `v12.1` includes from the older\n`v12` (see \"Restructure of 2026-11-05\" below).\n\nRevised 2026-11-10: the test version `v12` was removed and everything\n`v12.1` inherited from it was moved into `v12.1`, which is now the only\nversion (see \"Removal of `v12` (2026-11-10)\" below).\n\n# Decision\n\n## What a version is\n\n* A **version** is an **NLCS++ version** (the NLCS_Netbeheer XSD version):\n  there is one set of rules per NLCS++ version. The mapping onto XSD\n  versions is **one-to-one**.\n* Version **folders** are named `v` + the NLCS++ version, e.g. `v12.1/`.\n  The same id is used in the registry, in `sys_config.xml` and as\n  `active_version` in `main.sch`.\n* **Rule changes within an NLCS++ version are made in place**, in that\n  version's folder (or, for an inherited file, by overriding it first; see\n  below). The software release number exists only as the `v*` git tag and\n  the GitHub Release (see [build-and-release](../architecture/build-and-release.md));\n  no folder, registry entry or parameter carries it.\n* **All versions are supported** \u2014 in the repo, in CI, shipped in the\n  release and selectable at validation time. There is no `released` flag.\n\n## Repository layout: one root folder per version\n\nRevised 2026-11-02. Version-specific content no longer sits in a version\nsubfolder of each topic folder (`rules/\u003cversion>/`, `doc/\u003cversion>/`,\n`test/rule_validation_data/\u003cversion>/`, \u2026); each version has **one folder\nat the repository root** that holds everything belonging to it:\n\n```\n\u003cversion>/                       e.g. v12.1/\n  rules/main.sch                 phases + includes\n  rules/patterns/                concrete patterns this version adds/changes\n  rules/abstract_patterns/       abstract patterns this version adds\n  rules/transpiled_phases/       compiled XSLT (generated, git-ignored)\n  rules/abstract_patterns_scope_checks/, rules/main_scope_checks.{sch,xsl}\n                                 scope-checked variant (generated, git-ignored)\n  doc/NLCSValidatieRegels.{xml,html}   rule catalog + rendered HTML\n  test/rule_validation_data/     rule fixtures\n  test/scope_validation_data/    scope_template.xml\n  assets/                        committed SVGs of the test data\n  rule_validation_reports/, validation_test_results/,\n  scoped_objects/, scoped_objects_reports/   (generated, git-ignored)\n```\n\nEach version folder also holds `xsl_functions/` (the\n[XSL function libraries](../architecture/xsl-function-libraries.md)), unless it\ninherits them. Shared, version-independent tooling stays at the root:\n`configuration/`, `localization/`, `transformations/`, `wrappers/`,\n`scripts/`, `schemas/\u003cxsd version>/`, `doc/NLCSValidatieRegels.{xsl,css,xsd}`\nand `test/XMLValidation.java`. Adding or deleting a version is one folder\noperation, and the release `dist/` mirrors this layout so the relative paths\nare identical (see [build-and-release](../architecture/build-and-release.md)).\n\n## Rule numbering\n\nRule numbers are never reused. An edited rule keeps its number; a removed\nrule's number is retired; a new rule gets the next free number globally.\n\n## Sharing and overriding: explicit includes\n\nRevised 2026-10-28. This replaces two earlier designs: \"every later version\ninherits from a base version through a `base` attribute\", and \"a resolve\nscript combines a version with older versions into a `resolved_\u003cversion>`\nfolder\".\n\n* **Every version's `main.sch` says exactly which file it uses for each\n  rule and abstract pattern.** A version folder only holds its own\n  `main.sch` and the files it adds or changes; everything else is included\n  by path from the older ver
