 {"id": "rules/R.38", "type": "Validation Rule", "title": "R.38 \u2014 Inmeetwijze aansluitnet toegestaande waarde", "description": "Checks that a LSkabel with Subnettype AANSLUITNET does not use Meetlint as its Inmeetwijze.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 31, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "inmeetwijze_aansluitnet_toegestaande_waarde.sch", "resource": "../../v12.1/rules/abstract_patterns/inhoud_waarde/inmeetwijze_aansluitnet_toegestaande_waarde.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nFor an LSkabel whose Subnettype is \"AANSLUITNET\", this rule forbids the value \"Meetlint\" for Inmeetwijze. It exists purely to carve this one combination out of the general Inmeetwijze check in [R.37](./R.37.md), so that this specific AANSLUITNET/Meetlint case can be assigned its own severity level per scope, rather than always being treated at the same severity as any other disallowed Inmeetwijze value.\n\n# Details\n\n- soort: Inhoud waarde\n- validatieObjecten: LSkabel\n- Condition: it is not permitted for `Subnettype = 'AANSLUITNET'` and `Inmeetwijze = 'Meetlint'` to hold simultaneously.\n- R.37's abstract pattern explicitly excludes this same AANSLUITNET/Meetlint combination from its own assertion, deferring the judgment to this rule instead. Per the scope model, this combination is typically flagged at a lower severity (e.g. warning) than the general R.37 violation (typically an error).\n\nThe abstract pattern also reads `ma:allowed-inmeetwijzen()` (the `ToegestaandeInmeetwijzen` list in `configuration/sys_config.xml`, i.e. GPS/Tachymeter) purely to include it in the violation message text; see [sys-config](../config/sys-config.md). On violation it emits the `inmeetwijze-not-allowed` message from the message catalog; see [localization-messages](../config/localization-messages.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.39", "type": "Validation Rule", "title": "R.39 \u2014 Mof verbonden kabels gelijk verbindingnummer", "description": "Checks that MS/LSkabel objects physically connected to a MS/LSmof share that mof's Verbindingnummer value.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 30, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "mof_verbonden_kabels_gelijk_verbindingnummer.sch", "resource": "../../v12.1/rules/abstract_patterns/inhoud_waarde/mof_verbonden_kabels_gelijk_verbindingnummer.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA mof (cable joint) and the cables that connect to it should belong to the same logical connection, so this rule requires that every LSkabel/MSkabel whose geometry touches an LSmof/MSmof's point geometry has the same Verbindingnummer as that mof.\n\n# Details\n\n- soort: Inhoud waarde\n- validatieObjecten: LSmof, MSmof\n- Condition: for an LSmof, the set of LSkabel objects whose line geometry touches the mof's point geometry (`ma:point-touches-line`) must all have `Verbindingnummer` equal to the mof's `Verbindingnummer`; the same check is applied for MSmof against connected MSkabel objects.\n\nThe abstract pattern emits the `connected-cables-have-different-verbindingnummer` message from the message catalog; see [localization-messages](../config/localization-messages.md). This rule complements [R.23](./R.23.md), which also checks Verbindingnummer consistency across connected cables.\n\nThe mof-to-kabel touch check is served by a shared connectivity index rather than a per-rule scan; see [connectivity-index-and-geometry-caching](../decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.4", "type": "Validation Rule", "title": "R.4 \u2014 Lijn Geometrie (afstand en hoek van inmeetpunten)", "description": "Checks that line and area-outline geometries respect the minimum/maximum distance between survey points and do not contain sharp kinks between segments.", "tags": ["geometrie"], "group": "rules", "sz": 31, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "lijn_geometrie-afstand_van_inmeetpunten.sch (R.4-A)", "resource": "../../v12.1/rules/abstract_patterns/geometrie/lijn_geometrie-afstand_van_inmeetpunten.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "lijn_geometrie-hoek_van_segmenten.sch (R.4-B)", "resource": "../../v12.1/rules/abstract_patterns/geometrie/lijn_geometrie-hoek_van_segmenten.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA line (gml:Curve), or the outline of an area (gml:Surface), must meet survey-measurement (inmeet) requirements: consecutive survey points must be neither too close together nor too far apart, and the line must not contain unrealistically sharp kinks between consecutive segments.\n\n# Details\n\n- soort: Geometrie\n- validatieObjecten: Aaanlegtechniek, Amantelbuis, Eaarddraad, LSkabel, MSkabel (segment-length check also applies to MSstation, whose area outline is treated as a line of segments)\n- This rule is implemented as two separate Schematron sub-checks:\n  - **R.4-A** (segment length): each segment between consecutive (inmeet)points of a line or area outline must be at least 10 cm and at most 50 m long. Implemented via `ma:line-segments-not-meeting-length-demands`.\n  - **R.4-B** (segment angle): the angle between consecutive segments of a line must not exceed 45 degrees (no sharp kinks). Applies only to line objects (Aaanlegtechniek, Eaarddraad, LSkabel, MSkabel), not to MSstation areas. Implemented via `ma:line-segments-not-meeting-angle-demands`.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values.\n\nLine-buffer and distance calculations underlying this rule's segment-length and angle checks were the subject of recent precision/rounding fixes; see [distance & precision rounding](../decisions/distance-precision-rounding.md) for details."}, {"id": "rules/R.40", "type": "Validation Rule", "title": "R.40 \u2014 Volgnummer verplicht", "description": "Checks that AprojectReferentie has a Volgnummer value when Tekeningtype is DEELREVISIE or EINDREVISIE.", "tags": ["bestand"], "group": "rules", "sz": 28, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "volgnummer_verplicht.sch", "resource": "../../v12.1/rules/abstract_patterns/bestand/volgnummer_verplicht.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA partial or final revision drawing must be sequenced, so this rule requires the AprojectReferentie to carry a Volgnummer value whenever its Tekeningtype is \"DEELREVISIE\" or \"EINDREVISIE\".\n\n# Details\n\n- soort: Bestand\n- validatieObjecten: AprojectReferentie\n- Condition: for any `AprojectReferentie` where `Tekeningtype = 'DEELREVISIE'` or `Tekeningtype = 'EINDREVISIE'`, `Volgnummer` must exist and be non-empty (`ma:element-exists-and-not-empty`).\n\nThe abstract pattern emits the `attribute-not-present` message from the message catalog and reports Volgnummer as an `\u003cattribute>` element in the `missing-attributes` property; see [localization-messages](../config/localization-messages.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.41", "type": "Validation Rule", "title": "R.41 \u2014 DatumTijdMutatie gevuld", "description": "Checks that DatumTijdMutatie is populated (and not present) exactly when an NLCS object's Status or Bewerking indicates a mutation, and that it is not a future date.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "datumtijdmutatie_gevuld.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/datumtijdmutatie_gevuld.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nObjects that represent a change \u2014 anything not in the BESTAAND (existing/unchanged) status, or anything with a Bewerking (edit operation) value \u2014 must record when that mutation happened. This rule enforces that DatumTijdMutatie is present exactly when required, absent otherwise, and never set in the future.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: AlleObjecten (every NLCS object under NLCSnetbeheer except AprojectReferentie)\n- Condition: a mutation date is \"expected\" when `Status != 'BESTAAND'` or `Bewerking` is present and non-empty. If expected, `DatumTijdMutatie` must exist and be non-empty; if not expected, `DatumTijdMutatie` must be absent/empty. Additionally, whenever `DatumTijdMutatie` is present, it may not be later than the current date/time (`xs:dateTime(DatumTijdMutatie) gt current-dateTime()` must be false).\n\nThe abstract pattern emits the `attribute-not-present`, `attribute-present`, and `date-in-the-future` messages from the message catalog; see [localization-messages](../config/localization-messages.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.5", "type": "Validation Rule", "title": "R.5 \u2014 GisId en AssetId", "description": "Checks that objects originating from asset registration (Status BESTAAND, REVISIE, or VERWIJDERD) carry a GisId and AssetId, while newly designed objects (Status NIEUW) do not.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 31, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "gisid_en_assetid.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/gisid_en_assetid.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nObjects with Status BESTAAND, REVISIE, or VERWIJDERD originate from the asset registration and must therefore carry both a GisId and an AssetId. Conversely, objects with Status NIEUW are created during design or revision and must not have these identifiers filled in.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: AlleObjecten (applies to all NLCS object types)\n- Condition:\n  - If Status is one of BESTAAND, REVISIE, or VERWIJDERD, then GisId and AssetId must both be present (subject to the per-object exceptions below).\n  - If Status is NIEUW, then GisId and AssetId must both be empty.\n  - Objects with Status = REVISIE and Bewerking = VERPLAATSEN are excluded entirely from this check (context excludes them) \u2014 see [R.29](./R.29.md) for the relocation (\"verplaatsen\") exception rule.\n  - Whether an object actually requires a GisId/AssetId is determined by `ma:object-requires-gis-id` / `ma:object-requires-asset-id`, which consult a configured exception list rather than requiring it unconditionally for every object type.\n\nThis rule has a configured exception: `configuration/sys_config.xml`'s `GisIdAssetsIdExceptions/NoGisIdRequired` lists `AmantelbuisInhoud` as an object type that never requires a GisId; see [sys_config reference](../config/sys-config.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.6", "type": "Validation Rule", "title": "R.6 \u2014 Inmeetwijze en Nauwkeurigheid Lineaire Assets Elec", "description": "Checks that every linear Elec NLCS object has a value for both Inmeetwijze and Nauwkeurigheid.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 27, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "inmeetwijze_en_nauwkeurigheid_assets_elec.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/inmeetwijze_en_nauwkeurigheid_assets_elec.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nLinear Elec objects must record how they were surveyed (Inmeetwijze) and with what accuracy (Nauwkeurigheid), since this metadata is required to assess the reliability of the measured geometry.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: Amantelbuis, Eaarddraad, LSkabel, MSkabel\n- Condition: for each object of these types, `nlcs:Inmeetwijze` must be present and non-empty, and `nlcs:Nauwkeurigheid` must be present and non-empty.\n- This rule only checks *presence* of a value for Inmeetwijze; which specific Inmeetwijze values are actually permitted is constrained separately by [R.37](./R.37.md) and [R.38](./R.38.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.7", "type": "Validation Rule", "title": "R.7 \u2014 Subnettype gevuld voor LS en MS Kabel", "description": "Checks that MSkabel, LSkabel, and LSmof objects have a value for Subnettype.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 26, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "subnettype_ingevuld_voor_ls_en_ms_kabel.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/subnettype_ingevuld_voor_ls_en_ms_kabel.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nMSkabel, LSkabel, and LSmof objects must specify their Subnettype so that the sub-network they belong to is always identifiable.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: MSkabel, LSkabel, LSmof\n- Condition: for each object of these types, `nlcs:Subnettype` must be present and non-empty.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.8", "type": "Validation Rule", "title": "R.8 \u2014 Verplichte kenmerken Kabels", "description": "Checks that every cable has values for a core set of mandatory attributes, with three additional mandatory attributes for LSkabel.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verplichte_kenmerken_kabels.sch (R.8-A)", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/verplichte_kenmerken_kabels.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verplichte_kenmerken_kabels-ls_extra.sch (R.8-B)", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/verplichte_kenmerken_kabels-ls_extra.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nEvery cable object must carry a baseline set of descriptive attributes (execution, cable construction, manufacturer, connection number, voltage level, phase indication). LSkabel objects additionally must record earthing system, whether they run above ground, and their function.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: HSkabel, LSkabel, MSkabel\n- This rule is implemented as two Schematron sub-checks:\n  - **R.8-A** (general, HSkabel/LSkabel/MSkabel): `nlcs:Uitvoering`, `nlcs:Kabelopbouw`, `nlcs:Fabrikant`, `nlcs:Verbindingnummer`, `nlcs:Spanningsniveau`, and `nlcs:FaseAanduiding` must all be present and non-empty. In addition, if `nlcs:Uitvoering` equals `KEUZE ONTBREEKT IN LIJST`, then `nlcs:OmschrijvingUitvoering` must also be present and non-empty.\n  - **R.8-B** (LSkabel only): `nlcs:Aardingsysteem`, `nlcs:Bovengronds`, and `nlcs:Functie` must all be present and non-empty, in addition to the R.8-A attributes.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.9", "type": "Validation Rule", "title": "R.9 \u2014 Aanlegdatum gevuld", "description": "Checks that the DatumAanleg (installation date) is populated and does not lie in the future for a broad set of electrical network assets.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "aanlegdatum_gevuld.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/aanlegdatum_gevuld.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\nThis rule verifies that every applicable electrical asset carries a populated `DatumAanleg` (installation/laying date) attribute, and that this date is not set later than today. Enforcing this keeps the network's construction-date history complete and internally consistent.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): Eaarddraad, Eaardpen, LSkabel, LSmof, LSoverdrachtspunt, MSstation, MSkabel, MSmof, MSoverdrachtspunt, OVLoverdrachtspunt.\n- Condition: `DatumAanleg` must exist and be non-empty (assert `date-exists`); if present, `DatumAanleg` must be less than or equal to the current date (assert `date-not-in-future`) \u2014 i.e. it may not be a future date.\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `attribute-not-present` and `date-in-the-future` messages from the message catalog; see [localization-messages](../config/localization-messages.md)."}, {"id": "testing/coverage-checks", "type": "Test Subsystem", "title": "Rule and object coverage checks", "description": "Lightweight cross-checks that every documented rule is implemented, and that a rule's asserts touch the object types it claims to.", "tags": ["testing"], "group": "testing", "sz": 33, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-09 00:00:00+00:00"}, "verified": [], "sources": [{"title": "check_rule_coverage.sh", "resource": "../../scripts/check_rule_coverage.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "check_rule_object_coverage.sh", "resource": "../../scripts/check_rule_object_coverage.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nTwo small, fast (no external dependencies) consistency checks guard against\na version's rule catalog (`\u003cversion>/doc/NLCSValidatieRegels.xml`) and the Schematron\nimplementation ([schematron-layering](../architecture/schematron-layering.md))\ndrifting apart:\n\n- **`scripts/check_rule_coverage.sh`** \u2014 greps rule numbers out of\n  `\u003cversion>/doc/NLCSValidatieRegels.xml` (`nummer=\"R.n\"`) and phase ids out of\n  `\u003cversion>/rules/main.sch` (`id=\"R.n\"`), diffs the two sets, and\n  emits GitHub Actions annotations for any rule documented but not\n  implemented, or implemented but not documented. It also checks that each\n  rule's concrete pattern is included from the version folder named by the\n  rule's `\u003claatstGewijzigd>` (exact match): it takes the folder per phase\n  from `scripts/versions.sh rules \u003cversion>` and the value per rule from the\n  catalog, and emits an error annotation on the `main.sch` include line for\n  every mismatch, or on the catalog when a rule has no `laatstGewijzigd`.\n  Abstract-pattern includes are not checked, since they are shared between\n  rules. See [rule-catalog](../architecture/rule-catalog.md). Runs in the\n  first `covered-rules` job of the `CI` workflow (no build step needed) \u2014 see\n  [ci/workflows](../ci/workflows.md).\n\n- **`scripts/check_rule_object_coverage.sh`** \u2014 for each rule's\n  [test fixture](./rule-test-fixtures.md) SVRL reports, runs\n  `transformations/check_object_coverage.xsl` against\n  `\u003cversion>/doc/NLCSValidatieRegels.xml` (it reads the failing reports from\n  `../\u003cversion>/rule_validation_reports/`) to confirm the NLCS object types a rule's\n  asserts actually reported on match the `\u003cvalidatieObjecten>` list declared\n  for that rule in the catalog. Posts a coverage table\n  (Rule/Expected/Found/Missing/Extra) to `$GITHUB_STEP_SUMMARY` and fails CI\n  on any mismatch. Runs as the last step of the `validate-rules` CI job,\n  after fixtures have already been validated."}, {"id": "testing/rule-test-fixtures", "type": "Test Subsystem", "title": "Rule test fixtures", "description": "Hand-authored passing/failing NLCS++ XML fixtures per rule, run through the compiled rule XSLT in CI.", "tags": ["testing"], "group": "testing", "sz": 35, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "validate_rules.sh", "resource": "../../scripts/validate_rules.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "validate_rule_reports.sh", "resource": "../../scripts/validate_rule_reports.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "v12.1/test/rule_validation_data/", "resource": "../../v12.1/test/rule_validation_data/", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nThere is no unit-test framework (no JUnit/pytest) \u2014 rule testing is entirely\ndata-driven. `\u003cversion>/test/rule_validation_data/R.\u003cn>/` (e.g.\n`v12.1/test/rule_validation_data/R.36/`) holds hand-authored NLCS++ XML\nfixtures for each rule a version adds or changes; a rule's fixtures are taken\nfrom the version folder its pattern is included from (`scripts/versions.sh\nrules`, see [multiversion-model](../decisions/multiversion-model.md)).\nFixtures are split into `passing/` (should produce zero `assert-failed`\nelements) and `failing/` (should trigger the rule's assert).\nFixture filenames describe the geometric/data scenario they exercise \u2014 e.g.\n[R.36](../rules/R.36.md)'s fixtures include `single_line.xml`, `multi_line.xml`,\n`u_turn.xml`, `complex.xml`, and `_offset`/`exact_same_position`/\n`ends_at_same_position` variants that specifically probe distance-calculation\nedge cases (see [distance-precision-rounding](../decisions/distance-precision-rounding.md)).\n\n# How fixtures get validated\n\n`scripts/validate_rules.sh` runs every rule's transpiled XSLT (see\n[compilation-pipeline](../architecture/compilation-pipeline.md)) against both\nits `passing/` and `failing/` fixture sets, writing SVRL reports to\n`\u003cversion>/rule_validation_reports/\u003crule>/\u003cpassing|failing>/` (git-ignored).\n`scripts/validate_rule_reports.sh`\nthen reduces each report to a PASS/FAIL verdict via\n`transformations/check_validation_reports.xsl` into\n`\u003cversion>/validation_test_results/` (PASS = zero asserts for\n`passing/`, at least one for `failing/`) and fails CI \u2014 posting a\n`$GITHUB_STEP_SUMMARY` table of every mismatch \u2014 if any fixture doesn't match\nits expected outcome. This is wired into the `validate-rules` job of the\n`CI` workflow, see\n[ci/workflows](../ci/workflows.md).\n\nBefore any of this runs, `validate-rules` also XSD-validates every fixture\nagainst its version's Keuzelijst schema (`schemas/\u003cxsd version>/`) via\n`xerces-cli.jar` (`scripts/validate_test_data_xsd.sh`), to keep fixtures\nthemselves well-formed NLCS++.\n\n# Related\n\n[test-visualization](./test-visualization.md) renders these same\nfixtures as SVGs. [coverage-checks](./coverage-checks.md) verifies\nevery rule actually has fixtures and that fixtures cover the right object\ntypes."}, {"id": "testing/scope-coverage-tests", "type": "Test Subsystem", "title": "Scope coverage tests", "description": "A meta-test verifying the scope/severity engine itself assigns exactly the right rules to every scope, with no gaps or overlaps.", "tags": ["testing"], "group": "testing", "sz": 31, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-02 00:00:00+00:00"}, "verified": [], "sources": [{"title": "validate_scopes.sh", "resource": "../../scripts/validate_scopes.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "scope_template.xml", "resource": "../../v12.1/test/scope_validation_data/scope_template.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nThis test suite doesn't validate end-user NLCS++ data \u2014 it validates that\nthe [scope/severity model](../domain/scope-severity-model.md) itself has full,\nnon-overlapping coverage. `\u003cversion>/test/scope_validation_data/scope_template.xml`\nis expanded by `transformations/generate_scoped_objects.xsl` (reading the\nscopes from `\u003cversion>/doc/NLCSValidatieRegels.xml`) into\n`\u003cversion>/scoped_objects/`, one XML object per (scope \u00d7 Tekeningtype \u00d7 Status \u00d7 Bedrijfstoestand) combination \u2014\nevery cell of the scope matrix gets its own tiny test object.\n\n`scripts/validate_scopes.sh` then, for each generated object:\n1. Runs it through the **scope-checked** schema\n   (`\u003cversion>/rules/transpiled_phases/main_scope_checks.xsl` \u2014 see\n   [compilation-pipeline](../architecture/compilation-pipeline.md)), whose\n   abstract patterns assert an object's actual scope membership; reports go\n   to `\u003cversion>/scoped_objects_reports/`.\n2. Compares the resulting SVRL (via `transformations/check_scope_coverage.xsl`)\n   against the expected rule set for that scope, reporting `expected` /\n   `found` / `missing` / `unexpected` rule lists.\n3. Fails CI with a `$GITHUB_STEP_SUMMARY` table (\"Onvolledige of onjuiste\n   scopedekking\") if any scope has missing or unexpected rules.\n\nThis runs as the `validate-scopes` job of the `CI` workflow \u2014 see\n[ci/workflows](../ci/workflows.md). It's the reason\n[scope-bound-vs-scopeless-rules](../decisions/scope-bound-vs-scopeless-rules.md)\nexists as a decision record: gaps caught by this suite are what drove past\nfixes to which rules are unconditionally in-scope."}, {"id": "testing/test-visualization", "type": "Test Subsystem", "title": "Test data visualization", "description": "Auto-generated SVG renderings of every rule fixture's geometry, committed to \u003cversion>/assets/ for the wiki.", "tags": ["testing, documentation"], "group": "testing", "sz": 30, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "generate_and_compare_svgs.sh", "resource": "../../scripts/generate_and_compare_svgs.sh", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "visualize_test_data.xsl", "resource": "../../transformations/visualize_test_data.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\n`transformations/visualize_test_data.xsl` renders each\n[rule test fixture](./rule-test-fixtures.md)'s geometry (points,\nlines, polygons \u2014 layered polygon\u2192line\u2192point\u2192text, each object given a random\ncolor) as an SVG. `scripts/generate_and_compare_svgs.sh` regenerates these\ninto `\u003cversion>/assets/R.\u003cn>/\u003cpassing|failing>/*.svg` (currently\n`v12.1/assets/`), removing files with no geometry\n(empty `viewBox`) and empty directories.\n\nThese SVGs are **committed to the repo**, not build artifacts \u2014 they exist as\nhuman-reviewable visual documentation of what each fixture geometrically\nrepresents, intended for consumption on the project's external wiki. Because\nthey're checked in, `generate_and_compare_svgs.sh` fails CI\n(`git diff --quiet \u003cversion>/assets/`) if regenerating them produces a diff, forcing\ncontributors to regenerate and commit SVGs whenever fixture geometry changes.\nThis runs in the `validate-docs` job of the `CI` workflow \u2014 see\n[ci/workflows](../ci/workflows.md) \u2014 alongside the HTML doc regeneration.\n\nThe equivalent script for the rendered rule-catalog HTML\n(`\u003cversion>/doc/NLCSValidatieRegels.html`, generated from\n`\u003cversion>/doc/NLCSValidatieRegels.xml` via the shared\n`doc/NLCSValidatieRegels.xsl`) is `scripts/generate_and_compare_htmls.sh`,\nwhich follows the same \"regenerate and diff, fail if stale\" pattern."}], EDGES=[{"source": "architecture/build-and-release", "target": "ci/workflows"}, {"source": "architecture/build-and-release", "target": "architecture/compilation-pipeline"}, {"source": "architecture/build-and-release", "target": "architecture/xsl-function-libraries"}, {"source": "architecture/build-and-release", "target": "domain/nlcs-plus-plus"}, {"source": "architecture/compilation-pipeline", "target": "architecture/schematron-layering"}, {"source": "architecture/compilation-pipeline", "target": "testing/rule-test-fixtures"}, {"source": "architecture/compilation-pipeline", "target": "testing/scope-coverage-tests"}, {"source": "architecture/compilation-pipeline", "target": "architecture/build-and-release"}, {"source": "architecture/multiversion-plan", "target": "decisions/multiversion-model"}, {"source": "architecture/multiversion-plan", "target": "config/version-registry"}, {"source": "architecture/multiversion-plan", "target": "architecture/build-and-release"}, {"source": "architecture/rule-catalog", "target": "domain/scope-severity-model"}, {"source": "architecture/rule-catalog", "target": "testing/coverage-checks"}, {"source": "architecture/rule-catalog", "target": "ci/workflows"}, {"source": // value so a dangling pointer is still visible.
function supersededBy(n){if(!n.superseded_by)return'';
 return n.superseded_cid?relList('Superseded by',[n.superseded_cid])
  :`<div class="rel"><h4>Superseded by</h4><span class="empty">${esc(n.superseded_by)}</span></div>`;}
function show(id){const n=byId[id];if(!n)return;const c=color[n.type];
 side.innerHTML=`<span class="type" style="background:${c}">${esc(n.type)}</span>
 <h2>${esc(n.title)}</h2><div class="desc">${esc(n.description)||'<span class=empty>no description</span>'}</div>
 <div class="tags">${(n.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
 ${badges(n)}${metaBlock(n)}${supersededBy(n)}${srcList(n)}${relList('Links to',outL[id])}${relList('Cited by',inL[id])}
 <div class="body">${n.body?DOMPurify.sanitize(marked.parse(n.body)):'<span class=empty>empty body</span>'}</div>`;
 side.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>select(a.getAttribute('data-go')));
 side.querySelectorAll('.body a[href]').forEach(a=>{const tgt=resolveHref(id,a.getAttribute('href'));
  if(tgt)a.onclick=e=>{e.preventDefault();select(tgt);};});}
function select(id){const ele=cy.getElementById(id);if(!ele.length)return;show(id);
 cy.elements().removeClass('hl').addClass('dim');const nb=ele.closedNeighborhood();nb.removeClass('dim');ele.addClass('hl');
 cy.animate({center:{eles:ele},duration:250});
 try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.batch(()=>cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');}));}
let debounce;
document.getElementById('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(applyFilter,150);};
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
let curLayout='cose';
document.getElementById('layout').onchange=e=>{const v=e.target.value;
 if(v==='cose'&&NODES.length>1000&&!confirm(`force layout on ${NODES.length} concepts can freeze this tab — run anyway?`)){e.target.value=curLayout;return;}
 curLayout=v;cy.layout({name:v,animate:true,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='cose';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;curLayout=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
if(QS&&byId[QS])select(QS);else fromHash();
</script></body></html>
