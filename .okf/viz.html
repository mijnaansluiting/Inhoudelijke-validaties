sion folder that has it. For example, in the\n  `main.sch` of a future `v13`:\n\n  ```xml\n  \u003cinclude href=\"../../v12.1/rules/patterns/R.1.sch\"/>                   \u003c!-- inherited -->\n  \u003cinclude href=\"patterns/R.13.sch\"/>                                    \u003c!-- own -->\n  \u003cinclude href=\"../../v12.1/rules/abstract_patterns/geometrie/x.sch\"/>  \u003c!-- inherited -->\n  \u003cinclude href=\"../../v13/rules/abstract_patterns/geometrie/y.sch\"/>    \u003c!-- own -->\n  ```\n\n  **Abstract-pattern includes always name a version folder**, also for the\n  version's own files (`../../v12.1/rules/abstract_patterns/\u2026`, never\n  `abstract_patterns/\u2026`), so every abstract pattern's origin is explicit.\n  Concrete-pattern includes of the version's own files may stay relative\n  (`patterns/R.13.sch`).\n\n  This works without any build step because concrete patterns include\n  nothing themselves: `main.sch` includes both concrete and abstract\n  patterns directly, and concrete patterns refer to abstract ones by id\n  (`is-a`). SchXslt follows the paths while transpiling. The function\n  libraries are included as `../../xsl_functions/\u2026` (own) or\n  `../../../\u003colder version>/xsl_functions/\u2026` (inherited); SchXslt copies that\n  path into the compiled XSL unchanged, so all compiled output of a version\n  lives in `\u003cversion>/rules/transpiled_phases/`, where it resolves.\n  `scripts/versions.sh rules` finds a rule's source version by parsing\n  includes matching `(../../v*/rules/)?patterns/R.*`.\n* **Allowed include targets:** the version itself, or an **older** NLCS++\n  version. Never a newer one.\n* **A rule is taken whole:** all pattern files of a rule (`R.4_A` + `R.4_B`)\n  come from one version, and the rule's test data comes from the same\n  version folder as its patterns. A version that has its own pattern for a\n  rule must also have that rule's test data.\n* **Editing a rule** = copy its pattern file(s) and its test data folder\n  into the version, change both, and point the includes at the version's\n  own files. **Adding a rule** = new pattern, test data, phase, include and\n  catalog entry. **Removing a rule** = delete its `\u003cphase>` and its\n  `\u003cinclude>` line(s) from the version's `main.sch` and its catalog entry;\n  no files are deleted.\n* **A change to an older version's file is inherited** by every newer\n  version that includes it. Changes to one NLCS++ version that must not reach\n  newer versions go into an override in the newer version first.\n* **Abstract patterns are not overridden.** When a version needs different\n  abstract-pattern behavior, a *new* abstract pattern (new id/file) is\n  added and the version's overriding concrete pattern uses it; the old one\n  stays untouched. An abstract pattern lives in the oldest version that\n  uses it.\n* The registry has **no `base` attribute**: which version a rule comes from\n  is visible in each `main.sch`, not derived from version order.\n* **XSL function libraries are versioned** (revised 2026-11-02; they were\n  a single shared copy at the root that had to stay backwards compatible).\n  They live in `\u003cversion>/xsl_functions/` and are inherited like patterns:\n  a version includes an older version's library until it needs different\n  behavior, then gets its own copy of that library. Currently only\n  `v12.1/xsl_functions/` exists.\n* **Bugs found in a rule present in several versions** are handled case by\n  case; the decision is recorded in the PR.\n\n## Restructure of 2026-11-05\n\nThe software-release folders were mapped onto NLCS++ versions as follows,\nwith every rule result unchanged (the rule validation reports of `v12.1` and\n`v12` are byte-identical to those of `v2026.1.0` and `v9999.1.0`):\n\n| Now | Was | Holds "}, {"id": "decisions/scope-bound-vs-scopeless-rules", "type": "Decision", "title": "Bestand-category rules are severity-scopeless", "description": "Why file-level rules like R.1/R.2/R.35/R.40 always report severity \"Fout\" instead of being matched against a scope.", "tags": ["decision, scope"], "group": "decisions", "sz": 38, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "e365bcb \u2014 R.1 and R.2 always explicitly within scope", "resource": "https://github.com/mijnaansluiting/Inhoudelijke-validaties/commit/e365bcb213b4cc0e05f4c5efcda50974e9e489ec", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "f519af4 \u2014 Scopeless rules consistency (#88)", "resource": "https://github.com/mijnaansluiting/Inhoudelijke-validaties/commit/f519af4517d2a4c181b90ede1096bf24d841ddd4", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "rule_scope_functions.xsl", "resource": "../../v12.1/xsl_functions/rule_scope_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Context\n\n[Rule severity](../domain/scope-severity-model.md) is normally computed by\nmatching the object under validation (its Tekeningsoort/Status/\nBedrijfstoestand) against one of the 8 scopes, then looking up that rule's\n`niveau` within the matched scope. That matching only works when the rule's\nSchematron `\u003crule context>` fires on a per-object basis.\n\nRules of `soort` **Bestand** ([R.1](../rules/R.1.md), [R.2](../rules/R.2.md),\n[R.35](../rules/R.35.md), [R.40](../rules/R.40.md)) don't fit that model \u2014 they\nassert something about the *file as a whole* (context `//nlcs:NLCSnetbeheer`\nor `AprojectReferentie`), not about an individual NLCS object with its own\nStatus/Bedrijfstoestand. There is no single \"object\" to compute a scope from.\n\n# Decision\n\n`ma:rule-severity-within-scope` (in\n[rule_scope_functions.xsl](../architecture/xsl-function-libraries.md))\nspecial-cases rules whose `ma:rule-type` is `Bestand`: rather than attempting\nscope matching, it unconditionally returns `Fout`. This is why\n[scope-severity-model](../domain/scope-severity-model.md)'s matrix shows\n`R.1`, `R.2`, and `R.35` as `Fout` in literally every scope \u2014 the rule\nsimply isn't scope-dependent at all. (`R.40` is the same mechanism, but its\n*own* check logic only applies when Tekeningtype is `DEELREVISIE`/\n`EINDREVISIE`, which is why it shows `\u2013` for the other two Tekeningsoorten\nrather than because of scope matching.)\n\n# History\n\nThis wasn't the original design. Two fixes got here incrementally:\n\n1. **`e365bcb` \u2014 \"R.1 and R.2 always explicitly within scope\"** (2026-01-15).\n   The original code special-cased `object_type = 'NLCSnetbeheer'` to mean\n   \"always in scope\", but that check didn't reliably identify which rules\n   needed it. The fix replaced it with an explicit rule-number allowlist:\n   `$rule_numbers_always_within_scope = (1, 2)`.\n\n2. **`f519af4` \u2014 \"Scopeless rules consistency\" (#88)** (2026-04-14). The\n   allowlist-of-rule-numbers approach was replaced with the current\n   category-based check (`$rule_type = 'Bestand'`), which generalizes to\n   *any* Bestand rule (including `R.35`/`R.40`) instead of needing every new\n   file-level rule added to a hardcoded list. This PR also reworked\n   [R.2](../rules/R.2.md)'s own abstract pattern\n   (`combinatie_nlcs_status_en_tekeningsoort.sch`) to evaluate all objects'\n   statuses in one file-level assert (`distinct-values(*/nlcs:Status)`)\n   instead of one assert per object, and consolidated the corresponding\n   [test fixtures](../testing/rule-test-fixtures.md) (many near-duplicate\n   per-object-type failing fixtures collapsed into one per Tekeningsoort).\n\n# Why this matters\n\nIf a future rule is added with `soort` Bestand, it will automatically be\n`Fout`-severity everywhere via the category check \u2014 no scope-table entry is\nneeded, and none should be added, since [scope-coverage-tests](../testing/scope-coverage-tests.md)\ntests object-level scope matching, not file-level rules."}, {"id": "domain/nlcs-plus-plus", "type": "Domain Concept", "title": "NLCS++ and content validation", "description": "What NLCS++ is and why structural XSD validation isn't enough to guarantee usable grid-asset data.", "tags": ["domain, nlcs"], "group": "domain", "sz": 33, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-02 00:00:00+00:00"}, "verified": [], "sources": [{"title": "README.md", "resource": "../../README.md", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nNLCS++ is the Dutch electricity grid-asset information exchange format used\nbetween contractors/surveyors and netbeheerders (grid operators) to hand over\ngeometries and attributes of grid assets \u2014 LS/MS cables, joints (moffen),\nprotection pipes (mantelbuis), transfer points, stations, and related\ndocuments \u2014 as an XML file (namespace `NS_NLCSnetbeheer`).\n\nAn XSD schema (`NLCS_Netbeheer.xsd`, an external dependency fetched at build\ntime \u2014 see [build-and-release](../architecture/build-and-release.md)) guarantees\nthe file is *structurally* valid: the right elements, in the right shape.\nIt says nothing about whether the *content* is sensible \u2014 whether a cable's\ndeclared endpoints actually exist, whether required attributes are filled in,\nwhether geometry sits inside the project area, and so on. This repository\nimplements exactly that layer: **Inhoudelijke Validaties** (content\nvalidations), expressed as Schematron rules \u2014 see\n[schematron-layering](../architecture/schematron-layering.md).\n\n# Why Schematron\n\nSchematron was chosen specifically because it is a decentralized,\nsystem-agnostic way to validate XML content: any party \u2014 a netbeheerder's\nbackend, a contractor's laptop, a CI pipeline \u2014 can run the exact same rule\nset against an NLCS++ file and get identical results, without depending on a\nshared service. That's the stated goal of the project: run the same content\nvalidations \"on every device\" that the netbeheerder itself runs.\n\n# The rule catalog\n\nThe 37 rules (`R.1`\u2013`R.41`, with gaps at `R.16`\u2013`R.19`) are catalogued with\ntheir full Dutch definitions in a per-version catalog,\n`\u003cversion>/doc/NLCSValidatieRegels.xml` (rendered as\nHTML and published to GitHub Pages). Each rule has its own OKF concept under\n[/rules](../rules/index.md). Rules don't all apply with the same severity in\nevery situation \u2014 see [scope-severity-model](./scope-severity-model.md)\nfor how severity depends on the kind of drawing being submitted."}, {"id": "domain/scope-severity-model", "type": "Domain Concept", "title": "Scope and severity model", "description": "How the same rule can be an error in one drawing context and merely informational in another.", "tags": ["domain, scope, severity"], "group": "domain", "sz": 49, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog \u2014 `\u003cscopes>` section", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "rule_scope_functions.xsl", "resource": "../../v12.1/xsl_functions/rule_scope_functions.xsl", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA single validation rule (e.g. [R.36](../rules/R.36.md)) does not always carry\nthe same severity. Whether a failed rule is a hard error (`Fout`), merely\n`Informerend` (informational), or a `Waarschuwing` (warning) depends on the\n**scope** the object under validation falls into \u2014 a combination of:\n\n- **Tekeningsoort** (drawing type): `Bestaande Situatie`, `Definitief\n  Ontwerp`, `Deelrevisie`, `Eindrevisie`\n- **Status**: `BESTAAND`, `NIEUW`, `REVISIE`, `VERWIJDERD`\n- **Bedrijfstoestand** (operational state): `IN BEDRIJF`, `RESERVE`,\n  `VERLATEN`\n\nThe rule catalog's `\u003cscopes>` section (one catalog per version, e.g.\n`v12.1/doc/NLCSValidatieRegels.xml`) defines 8 named scopes,\neach mapping a Tekeningsoort+Status+Bedrijfstoestand combination to a list of\nrules and, per rule, a `niveau` (severity). This lets the same physical check\n(e.g. \"does a cable have valid endpoints\") be strictly enforced during a final\nhandover but only advisory during an as-built (\"Bestaande Situatie\") capture.\n\nThis logic is implemented in `\u003cversion>/xsl_functions/rule_scope_functions.xsl`\nvia functions like `ma:scope-name`, `ma:rule-severity-within-scope`, and\n`ma:rule-within-scope-for-object`, and consumed by every concrete pattern in\n`\u003cversion>/rules/patterns/` (see\n[schematron-layering](../architecture/schematron-layering.md)) to populate the\n`scope` and `severity` properties attached to every Schematron assert.\n\n# The 8 scopes\n\n| Scope | Tekeningsoort | Status | Bedrijfstoestand |\n|---|---|---|---|\n| Bestaande Situatie | Bestaande Situatie | BESTAAND | IN BEDRIJF, RESERVE, VERLATEN |\n| Definitief Ontwerp | Definitief Ontwerp | NIEUW, REVISIE, VERWIJDERD | IN BEDRIJF, RESERVE, VERLATEN |\n| Deelrevisie nieuwe objecten | Deelrevisie | NIEUW | IN BEDRIJF |\n| Deelrevisie aangepaste objecten | Deelrevisie | REVISIE | IN BEDRIJF, RESERVE |\n| Deelrevisie verlaten objecten | Deelrevisie | REVISIE, VERWIJDERD | VERLATEN |\n| Eindrevisie nieuwe objecten | Eindrevisie | NIEUW | IN BEDRIJF |\n| Eindrevisie aangepaste objecten | Eindrevisie | REVISIE | IN BEDRIJF, RESERVE |\n| Eindrevisie verlaten objecten | Eindrevisie | REVISIE, VERWIJDERD | VERLATEN |\n\n# Rule severity per scope\n\n`F` = Fout (error), `I` = Informerend (informational), `W` = Waarschuwing\n(warning), `\u2013` = rule is not evaluated for this scope at all.\n\n| Rule | Bestaande Situatie | Definitief Ontwerp | Deelrevisie nieuw | Deelrevisie aangepast | Deelrevisie verlaten | Eindrevisie nieuw | Eindrevisie aangepast | Eindrevisie verlaten |\n|---|---|---|---|---|---|---|---|---|\n| [R.1](../rules/R.1.md) | F | F | F | F | F | F | F | F |\n| [R.2](../rules/R.2.md) | F | F | F | F | F | F | F | F |\n| [R.3](../rules/R.3.md) | F | F | F | F | F | F | F | F |\n| [R.4](../rules/R.4.md) | \u2013 | \u2013 | F | F | F | F | F | F |\n| [R.5](../rules/R.5.md) | F | F | F | F | F | F | F | F |\n| [R.6](../rules/R.6.md) | F | \u2013 | F | F | F | F | F | F |\n| [R.7](../rules/R.7.md) | F | F | F | F | F | F | F | F |\n| [R.8](../rules/R.8.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.9](../rules/R.9.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.10](../rules/R.10.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.11](../rules/R.11.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.12](../rules/R.12.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.13](../rules/R.13.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.14](../rules/R.14.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.15](../rules/R.15.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.20](../rules/R.20.md) | I | F | F | F | \u2013 | F | F | \u2013 |\n| [R.21](../rules/R.21.md) | I | \u2013 | I | I | \u2013 | F | F | \u2013 |\n| [R.22](../rules/R.22.md) | I | \u2013 | I | I | \u2013 | F | F | \u2013 |\n| [R.23](../rules/R.23.md) | I | \u2013 | I | I | \u2013 | F | F | \u2013 |\n| [R.24](../rules/R.24.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.25](../rules/R.25.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.26](../rules/R.26.md) | I | \u2013 | I | I | \u2013 | F | F | \u2013 |\n| [R.27](../rules/R.27.md) | I | F | F | F | \u2013 | F | F | \u2013 |\n| [R.28](../rules/R.28.md) | I | F | F | F | \u2013 | F | F | \u2013 |\n| [R.29](../rules/R.29.md) | \u2013 | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.30](../rules/R.30.md) | I | F | F | F | \u2013 | F | F | \u2013 |\n| [R.31](../rules/R.31.md) | \u2013 | \u2013 | W | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.32](../rules/R.32.md) | \u2013 | \u2013 | W | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.33](../rules/R.33.md) | \u2013 | \u2013 | W | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.34](../rules/R.34.md) | \u2013 | \u2013 | \u2013 | \u2013 | F | \u2013 | \u2013 | F |\n| [R.35](../rules/R.35.md) | F | F | F | F | F | F | F | F |\n| [R.36](../rules/R.36.md) | F | F | F | F | \u2013 | F | F | \u2013 |\n| [R.37](../rules/R.37.md) | \u2013 | \u2013 | F | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.38](../rules/R.38.md) | \u2013 | \u2013 | W | \u2013 | \u2013 | W | \u2013 | \u2013 |\n| [R.39](../rules/R.39.md) | \u2013 | \u2013 | F | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.40](../rules/R.40.md) | \u2013 | \u2013 | F | F | F | F | F | F |\n| [R.41](../rules/R.41.md) | F | F | F | F | F | F | F | F |\n\nRules `R.1`, `R.2`, `R.3`, `R.5`, `R.7`, `R.35`, and `R.41` are the only rules\nthat are `Fout` in literally every scope \u2014 regardless of drawing type,\nstatus, or operational state. See\n[scope-bound-vs-scopeless-rules](../decisions/scope-bound-vs-scopeless-rules.md)\nfor why `R.1`/`R.2` specifically were made unconditionally in-scope."}, {"id": "rules/R.1", "type": "Validation Rule", "title": "R.1 \u2014 Bestand bevat NLCS Objecten", "description": "Checks that an NLCS++ file contains exactly one AprojectReferentie plus at least one actual NLCS object, so no \"empty\" project can be submitted.", "tags": ["bestand"], "group": "rules", "sz": 27, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "bestand_bevat_nlcs_objecten.sch", "resource": "../../v12.1/rules/abstract_patterns/bestand/bestand_bevat_nlcs_objecten.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nAn NLCS++ file must contain at least one NLCS object in addition to its project reference. This rule rejects files that consist only of an AprojectReferentie with no actual content, i.e. an \"empty\" project submission.\n\n# Details\n\n- soort: Bestand\n- validatieObjecten: Document\n- Condition: the file's NLCSnetbeheer element must contain exactly one AprojectReferentie (`count($aprojectreferenties) = 1`), and it must contain at least one other child element that is not an AprojectReferentie (`count($nlcs_objects) > 0`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.10", "type": "Validation Rule", "title": "R.10 \u2014 Verplichte kenmerken moffen", "description": "Checks that every cable joint (mof) has its baseline required attributes populated, with extra attributes required depending on voltage level.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 31, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verplichte_kenmerken_moffen.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/verplichte_kenmerken_moffen.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\nThis rule verifies that every mof (cable joint) has a minimal set of attributes filled in, so that its function and connection number are always traceable. Depending on the mof's voltage class, additional attributes are required: low-voltage joints must record whether they sit above ground, while medium- and high-voltage joints must record the installing technician and cross-bonding status.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): HSmof, LSmof, MSmof.\n- Condition:\n  - Every mof (HSmof, LSmof, MSmof) must have a value for `Functie` and `Verbindingnummer`.\n  - Additionally, every `LSmof` must have a value for `Bovengronds`.\n  - Additionally, every `MSmof` and `HSmof` must have a value for `NaamMonteur` and `CrossBondingAanwezig`.\n- The abstract pattern implements this with two separate rule contexts: one for `MSmof | HSmof` (Functie, Verbindingnummer, NaamMonteur, CrossBondingAanwezig) and one for `LSmof` (Functie, Verbindingnummer, Bovengronds).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern reports all missing attributes of an object in one failed assert, with the `attributes-not-present` message from the message catalog (`attribute-not-present` when only one is missing) and the names as `\u003cattribute>` elements in the `missing-attributes` property; see [localization-messages](../config/localization-messages.md)."}, {"id": "rules/R.11", "type": "Validation Rule", "title": "R.11 \u2014 Verplichte kenmerken LSoverdrachtspunt", "description": "Checks that every low-voltage transfer point (LSoverdrachtspunt) has its required attributes populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verplichte_kenmerken_lsoverdrachtspunt.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/verplichte_kenmerken_lsoverdrachtspunt.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\nThis rule verifies that every LSoverdrachtspunt (low-voltage transfer/connection point) has the attributes needed to describe its orientation, function, phasing, and earthing system, so downstream consumers can rely on these being present.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): LSoverdrachtspunt.\n- Condition: every `LSoverdrachtspunt` must have a value for `EigenRichting`, `Functie`, `FaseAanduiding`, and `Aardingsysteem` (asserts `eigen-richting-present`, `functie-present`, `fase-aanduiding-present`, `aardingsysteem-present`).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern reports all missing attributes of an object in one failed assert, with the `attributes-not-present` message from the message catalog (`attribute-not-present` when only one is missing) and the names as `\u003cattribute>` elements in the `missing-attributes` property; see [localization-messages](../config/localization-messages.md)."}, {"id": "rules/R.12", "type": "Validation Rule", "title": "R.12 \u2014 Verplichte kenmerken OVLoverdrachtspunt", "description": "Checks that every overhead-line transfer point (OVLoverdrachtspunt) has its required attributes populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verplichte_kenmerken_ovloverdrachtspunt.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/verplichte_kenmerken_ovloverdrachtspunt.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\nThis rule verifies that every OVLoverdrachtspunt (overhead-line transfer point) carries a full set of attributes describing its connection set, function, voltage level, connection method, switching configuration, and mast number.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): OVLoverdrachtspunt.\n- Condition: every `OVLoverdrachtspunt` must have a value for `Aansluitset`, `Functie`, `Spanningsniveau`, `Aansluitwijze`, `Schakeling`, and `Mastnummer` (asserts `aansluitset-present`, `functie-present`, `spanningsniveau-present`, `aansluitwijze-present`, `schakeling-present`, `mastnummer-present`).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern reports all missing attributes of an object in one failed assert, with the `attributes-not-present` message from the message catalog (`attribute-not-present` when only one is missing) and the names as `\u003cattribute>` elements in the `missing-attributes` property; see [localization-messages](../config/localization-messages.md)."}, {"id": "rules/R.13", "type": "Validation Rule", "title": "R.13 \u2014 Verplichte kenmerken MSoverdrachtspunt", "description": "Checks that every medium-voltage transfer point (MSoverdrachtspunt) has its Identificatie (EAN code) attribute populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 28, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-02 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verplichte_kenmerken_msoverdrachtspunt.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/verplichte_kenmerken_msoverdrachtspunt.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\nThis rule verifies that every MSoverdrachtspunt (medium-voltage transfer point) has an `Identificatie` value, which holds the EAN code that uniquely identifies the connection point in downstream systems.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): MSoverdrachtspunt.\n- Condition: every `MSoverdrachtspunt` must have a value for `Identificatie` (EAN code), enforced by assert `v12-msoverdrachtspunt-has-identification`.\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `attribute-not-present` message from the message catalog when `Identificatie` is missing; see [localization-messages](../config/localization-messages.md)."}, {"id": "rules/R.14", "type": "Validation Rule", "title": "R.14 \u2014 Verplichte kenmerken Stations en Kasten", "description": "Checks that every station or low-voltage cabinet has its Nummer and Functie attributes populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 28, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verplichte_kenmerken_stations_en_kasten.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/verplichte_kenmerken_stations_en_kasten.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\nThis rule verifies that every station or cabinet object records both an identifying number and its function, so these installations can be uniquely referenced and their role in the network understood.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): HSstation, LSkast, MSstation.\n- Condition: every `LSkast`, `MSstation`, and `HSstation` must have a value for `Nummer` and `Functie` (asserts `object-has-number`, `object-has-functie`).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern reports all missing attributes of an object in one failed assert, with the `attributes-not-present` message from the message catalog (`attribute-not-present` when only one is missing) and the names as `\u003cattribute>` elements in the `missing-attributes` property; see [localization-messages](../config/localization-messages.md)."}, {"id": "rules/R.15", "type": "Validation Rule", "title": "R.15 \u2014 Verplichte kenmerken Mantelbuis", "description": "Checks that every conduit (Mantelbuis) has its Materiaal, Diameter, and Thema attributes populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 30, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-02 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verplichte_kenmerken_mantelbuis.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/verplichte_kenmerken_mantelbuis.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\nThis rule verifies that every Mantelbuis (conduit/duct) records its material, diameter, and thematic classification, since these attributes are needed to describe the physical conduit and how it relates to the cables it protects.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): Amantelbuis.\n- Condition: every `Amantelbuis` must have a value for `Materiaal`, `Diameter`, and `Thema` (asserts `mantelbuis-has-materiaal`, `mantelbuis-has-diameter`, `mantelbuis-has-thema`).\n\nThis rule only checks that `Diameter` is *populated*; the value's geometric consistency and unit correctness are checked separately \u2014 see [R.27](./R.27.md) and [R.36](./R.36.md), which apply additional geometric/value checks specific to Amantelbuis and its `Diameter`.\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern reports all missing attributes of an object in one failed assert, with the `attributes-not-present` message from the message catalog (`attribute-not-present` when only one is missing) and the names as `\u003cattribute>` elements in the `missing-attributes` property; see [localization-messages](../config/localization-messages.md)."}, {"id": "rules/R.2", "type": "Validation Rule", "title": "R.2 \u2014 Combinatie NLCS Status en Tekeningsoort", "description": "Checks that the NLCS Status values used by objects in the file are consistent with the Tekeningtype declared on the AprojectReferentie.", "tags": ["bestand"], "group": "rules", "sz": 28, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "combinatie_nlcs_status_en_tekeningsoort.sch", "resource": "../../v12.1/rules/abstract_patterns/bestand/combinatie_nlcs_status_en_tekeningsoort.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nDepending on the Tekeningsoort (drawing type) of the project, only certain NLCS Status values are allowed to occur on the objects in the file. This rule prevents, for example, a \"Bestaande Situatie\" drawing from containing objects with a NIEUW or REVISIE status.\n\n# Details\n\n- soort: Bestand\n- validatieObjecten: Document\n- Condition: the allowed set of Status values is derived from `nlcs:AprojectReferentie/nlcs:Tekeningtype`:\n  - BESTAANDE SITUATIE \u2192 only `BESTAAND`\n  - DEELREVISIE, DEFINITIEF ONTWERP, EINDREVISIE \u2192 `BESTAAND`, `NIEUW`, `REVISIE`, `VERWIJDERD`\n  - VOORONTWERP (and any other/unrecognized Tekeningtype) \u2192 no statuses allowed\n  - The rule fails if any distinct Status value found among the file's objects falls outside the allowed set for the declared Tekeningtype.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.20", "type": "Validation Rule", "title": "R.20 \u2014 Topologie punt objecten Elec", "description": "Checks that Elec point objects are geometrically connected to the correct cable type and do not float unconnected.", "tags": ["topologie"], "group": "rules", "sz": 32, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "topologie_punt_objecten_elec.sch", "resource": "../../v12.1/rules/abstract_patterns/topologie/topologie_punt_objecten_elec.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\nThis rule verifies that point objects (Geometry of type `gml:Point`) in the electrical network are not left floating in space, but touch a cable line of the correct voltage class \u2014 medium-voltage points must connect to a medium-voltage cable, and low-voltage points must connect to a low-voltage cable.\n\n# Details\n- Rule category (`soort`): Topologie.\n- Applies to (`validatieObjecten`): Eaardmof, LSmof, LSoverdrachtspunt, MSmof, MSoverdrachtspunt, OVLoverdrachtspunt.\n- Condition: a point object may not float; it must be connected to the correct kabel:\n  - `MSmof` and `MSoverdrachtspunt` must be connected to an `MSkabel` \u2014 the pattern parses the point's `Geometry` and asserts (`point-connected-to-kabel`) that it touches at least one `MSkabel/Geometry` line.\n  - `Eaardmof`, `LSmof`, `LSoverdrachtspunt`, and `OVLoverdrachtspunt` must be connected to an `LSkabel` \u2014 the same assertion is checked against `LSkabel/Geometry` lines.\n\nThis point-to-cable topology check is complemented by [R.21](./R.21.md), which validates the cable-side topology (valid end points of a kabel).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `point-not-connected-to-any-line` message from the message catalog when a point object is not touching any line of the expected cable type; see [localization-messages](../config/localization-messages.md).\n\nThe point-to-cable touch check itself is served by a shared connectivity index rather than a per-rule scan; see [connectivity-index-and-geometry-caching](../decisions/connectivity-index-and-geometry-caching.md)."}, {"id": "rules/R.21", "type": "Validation Rule", "title": "R.21 \u2014 Geldig eindpunt Kabel", "description": "Checks that every cable has a valid connected object at both its start and end point.", "tags": ["topologie"], "group": "rules", "sz": 32, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "geldig_eindpunt_kabel.sch", "resource": "../../v12.1/rules/abstract_patterns/topologie/geldig_eindpunt_kabel.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nEvery cable must be properly connected at both ends: a dangling start or end point indicates a topology error in the network. The rule checks the start and end point of the cable's geometry against the geometries of the object types that are valid endpoints for that cable type.\n\n# Details\n\n- Rule category (`soort`): Topologie\n- Applies to (`validatieObjecten`): Eaarddraad, LSkabel, MSkabel\n- Valid endpoints per cable type:\n\n  | Object type | Valid endpoint types |\n  |---|---|\n  | Eaarddraad | LSmof, MSmof, Eaardmof, Eaardpen, MSstation, LSkast |\n  | MSkabel | MSmof, MSoverdrachtspunt, MSstation |\n  | LSkabel | LSmof, LSoverdrachtspunt, OVLoverdrachtspunt, MSstation, LSkast |\n\n- A cable's start point is checked for point-connection (or, for MSstation/LSkast, area-touching) against the geometries of the applicable endpoint types; the same check is done independently for the end point.\n- The check is skipped entirely for cables with Bedrijfstoestand \"VERLATEN\".\n- Each endpoint check is only performed when that endpoint lies within the project area (`AprojectReferentie`); endpoints outside the project area are not evaluated.\n- Failing endpoints are reported with their geometry (via `ma:create-gml-point`) so the offending point can be located on the map.\n\nSee [R.20](./R.20.md) for the related point-topology rule.\n\nThis rule's endpoint scan (every cable against every candidate endpoint\nobject) was the dominant remaining cost in the geometry-parsing pipeline \u2014\nsee [geometry-parse-caching](../decisions/geometry-parse-caching.md) for why\n`ma:parse-point`/`ma:parse-area` are now memoized per geometry node.\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix."}, {"id": "rules/R.22", "type": "Validation Rule", "title": "R.22 \u2014 Kabels zelfde Netvlak", "description": "Checks that cables connected to each other through a joint belong to the same network layer (discipline).", "tags": ["netlogica"], "group": "rules", "sz": 30, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "kabels_zelfde_netvlak.sch", "resource": "../../v12.1/rules/abstract_patterns/netlogica/kabels_zelfde_netvlak.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nCables that are physically joined via a mof must belong to the same netvlak (network layer/discipline) \u2014 an LSkabel should not be spliced directly to an MSkabel or HSkabel, and vice versa, since that would mix voltage levels on one continuous conductor.\n\n# Details\n\n- Rule category (`soort`): Netlogica\n- Applies to (`validatieObjecten`): LSkabel, MSkabel\n- For an MSkabel, the joints (MSmof) touching its line are found, and then any LSkabel or HSkabel that also touches one of those joints is collected; the assertion fails if any such cross-netvlak cable is found.\n- For an LSkabel, the joints (LSmof) touching its line are found, and then any MSkabel or HSkabel touching one of those joints is collected; the assertion fails if any such cross-netvlak cable is found.\n- In both cases the failure message reports the counts and types of the mismatching connected cables.\n\nThe mof/kabel touch relationship (both the direct touch and the \"kabel via a shared mof\" second hop) is served by a shared connectivity index rather than a per-rule, per-kabel rescan; see [connectivity-index-and-geometry-caching](../decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix."}, {"id": "rules/R.23", "type": "Validation Rule", "title": "R.23 \u2014 Verbonden kabels juiste kenmerken", "description": "Checks that cables connected to each other via a joint share the same value for a set of key attributes.", "tags": ["netlogica"], "group": "rules", "sz": 36, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-27 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NB Validatie: onterechte melding op subnettype", "resource": "https://github.com/mijnaansluiting/Inhoudelijke-validaties/issues/121", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verbonden_kabels_juiste_kenmerken.sch", "resource": "../../v12.1/rules/abstract_patterns/netlogica/verbonden_kabels_juiste_kenmerken.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nCables spliced together through a joint represent one continuous circuit, so certain descriptive attributes must be identical across the splice; a mismatch signals a data-entry error or an inconsistent circuit definition.\n\n# Details\n\n- Rule category (`soort`): Netlogica\n- Applies to (`validatieObjecten`): LSkabel, MSkabel\n- For each MSkabel/LSkabel, the joints (MSmof/LSmof) touching its line are found, and then all other cables of the same type touching one of those joints are collected as \"connected cables\". The cable under check is left out of\n  that set by node identity (`not(. is $lskabel)`), not by comparing values:\n  `!=` or `ne` compare the cables' text content, so another cable with exactly\n  the same content would also be dropped and never compared.\n- The rule compares the following attributes of the cable against each connected cable, and reports the distinct mismatching values found:\n  - Bedrijfstoestand\n  - Subnettype\n  - Verbindingnummer\n  - Spanningsniveau\n- Each attribute is checked with a separate assertion, so a mismatch on one attribute does not suppress the check of the others.\n- For LSkabel, the Functie of each connecting LSmof relaxes some comparisons:[^issue-121]\n\n  | Functie LSmof  | Subnettype    | Spanningsniveau |\n  |----------------|---------------|-----------------|\n  | AANSLUIT AFTAK | May differ    | May differ      |\n  | COMBI LS OV    | Must be equal | May differ      |\n  | Other / none   | Must be equal | Must be equal   |\n\n  Bedrijfstoestand and Verbindingnummer must always be equal. The relaxation is applied per mof: a cable with an AANSLUIT AFTAK on one end and a VERBINDING on the other is still fully compared to the cable behind the VERBINDING.\n- An LSkabel connected to an LSmof with Functie AFTAK EINDMOF must have Subnettype DISTRIBUTIE (the mof itself is AANSLUITNET).\n- MSkabel is unaffected: no MSmof Functie relaxes a comparison.\n\nSee [R.39](./R.39.md), which also validates a shared attribute \u2014 Verbindingnummer \u2014 across connected cables/joints. The mof/kabel touch relationship this rule composes (touch, then touch-via-mof) is served by a shared connectivity index rather than a per-kabel rescan; see [connectivity-index-and-geometry-caching](../decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n[^issue-121]: Table \"Uitgangspunt: kenmerken van de kabels per Functie LSmof\" in issue #121."}, {"id": "rules/R.24", "type": "Validation Rule", "title": "R.24 \u2014 Fase MS Kabel", "description": "Checks that a cable's FaseAanduiding value is consistent with its Uitvoering value.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 28, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "fase_ms_kabel.sch", "resource": "../../v12.1/rules/abstract_patterns/inhoud_waarde/fase_ms_kabel.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA cable's declared Fase (phase) must match how the cable is actually constructed, as described by Uitvoering: a 3-phase cable should be built as a \"3x\" execution, while a single-phase cable (L1, L2 or L3) should be built as a \"1x\" execution.\n\n# Details\n\n- Rule category (`soort`): Inhoud waarde\n- Applies to (`validatieObjecten`): MSkabel\n- Expected prefix of Uitvoering derived from FaseAanduiding:\n\n  | FaseAanduiding | Expected Uitvoering prefix |\n  |---|---|\n  | 3 Fasen | \"3x\" |\n  | L1 / L2 / L3 | \"1x\" |\n  | N (or any other value) | no prefix required |\n\n- The assertion checks that Uitvoering starts with the expected prefix.\n- If Uitvoering equals \"KEUZE ONTBREEKT IN LIJST\" (no choice made in the list), OmschrijvingUitvoering is compared against the expected prefix instead.\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix."}, {"id": "rules/R.25", "type": "Validation Rule", "title": "R.25 \u2014 Verbonden kabels juiste Fase", "description": "Checks that cables joined at a mof have a Fase combination that is valid for the number of cables connected.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 33, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-24 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NB Validatie: onterechte melding op subnettype", "resource": "https://github.com/mijnaansluiting/Inhoudelijke-validaties/issues/121", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verbonden_kabels_juiste_fase.sch", "resource": "../../v12.1/rules/abstract_patterns/inhoud_waarde/verbonden_kabels_juiste_fase.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nThe set of Fase values on the cables meeting at a joint must be electrically consistent: cables spliced together must carry the same phase(s), except at a designated 3-phase-to-single-phase transition joint where the phases are expected to split.\n\n# Details\n\n- Rule category (`soort`): Inhoud waarde\n- Applies to (`validatieObjecten`): LSmof, MSmof\n- Behaviour depends on the number of cables connected to the joint:\n\n  | Cables connected | Requirement |\n  |---|---|\n  | 1 | No check performed |\n  | 2 | Fase of both cables must be equal |\n  | 3 | Fase of all three cables must be equal |\n  | 4 | One cable must be \"3 Fasen\"; the other three must together be exactly L1, L2 and L3 (a 3-phase to 3\u00d71-phase transition) |\n  | >4 | No check performed |\n\n- Only Fase values within the allowed set (\"3 Fasen\", \"L1\", \"L2\", \"L3\") are permitted at joints with 2, 3 or 4 connections; any other Fase value present triggers a separate assertion.\n- For 4 connections, the rule additionally requires that the four distinct allowed phase values are all represented (i.e., the combined value plus all three split values).\n- At an LSmof with Functie AANSLUIT AFTAK or COMBI LS OV the Fase of the connected cables may differ (e.g. an L1 aansluitkabel branching off a 3 Fasen distributiekabel), so the equal-phase and 4-cable split checks are skipped; the allowed-values check still applies, so N still fails.[^issue-121] MSmof is unaffected.\n\nSee [R.26](./R.26.md), which also keys its check off the number of cables connected to a joint. The mof-to-kabel touch check is served by a shared connectivity index rather than a per-rule scan; see [connectivity-index-and-geometry-caching](../decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n[^issue-121]: Table \"Uitgangspunt: kenmerken van de kabels per Functie LSmof\" in issue #121."}, {"id": "rules/R.26", "type": "Validation Rule", "title": "R.26 \u2014 Aantal kabels en mof functie", "description": "Checks that the number of cables connected to a joint matches what is expected for the joint's Functie.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 33, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "aantal_kabels_en_mof_functie.sch", "resource": "../../v12.1/rules/abstract_patterns/inhoud_waarde/aantal_kabels_en_mof_functie.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA joint's Functie (function) implies how many cables should physically meet there \u2014 an end cap has one cable, a straight splice has two, a branch has three. This rule verifies the actual connected cable count against the count implied by Functie, and additionally checks the special case of a branch joint on an existing cable.\n\n# Details\n\n- Rule category (`soort`): Inhoud waarde\n- Applies to (`validatieObjecten`): Eaardmof, LSmof, MSmof\n- Functie is first mapped to a functional category via `ma:map-mof-functie` (see config dependency below), then the required number of connected cables is derived:\n\n  | Functie category | Example Functie values | Required cables |\n  |---|---|---|\n  | Eind | EINDMOF, EINDDOP, LOODKOP, EIND GEAARD | 1 |\n  | Verbinding | VERBINDING, ZEGELWIJZIGING, MANTELREPARATIE | 2 |\n  | Faseovergang | 3FASE 3x1FASE | 4 |\n  | Aftak, on an existing cable (at least one connected cable has Status \"BESTAAND\") | AFTAK SPLITSEND | 2, and at least one connected cable must have Status \"NIEUW\" |\n  | Aftak, otherwise | AFTAK SPLITSEND | 3 |\n\n- If Functie cannot be mapped to a known category, a separate assertion flags that the required cable amount is unknown.\n- Eaardmof has no Functie; instead it must simply be connected to at least one Eaarddraad (a dedicated rule branch, not driven by the table above).\n\nConfig dependency: the mapping from Functie strings to the Aftak/Eind/Verbinding/Faseovergang categories is defined by the `MofFuncties` group in `configuration/sys_config.xml` and read via the `ma:map-mof-functie` function \u2014 see [/config/sys-config.md](../config/sys-config.md).\n\nThe mof-to-kabel/Eaarddraad touch check is served by a shared connectivity index rather than a per-rule scan; see [connectivity-index-and-geometry-caching](../decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix."}, {"id": "rules/R.27", "type": "Validation Rule", "title": "R.27 \u2014 Mantelbuis past in mantelbuis", "description": "Checks that a protection pipe (mantelbuis) nested inside one or more other protection pipes has a smaller diameter than each of them.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 30, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "mantelbuis_past_in_mantelbuis.sch", "resource": "../../v12.1/rules/abstract_patterns/inhoud_waarde/mantelbuis_past_in_mantelbuis.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA mantelbuis can be laid inside one or more other, larger mantelbuizen, as recorded via AmantelbuisInhoud. For this physical nesting to be plausible, the inner pipe's Diameter must be smaller than the Diameter of every outer pipe it is recorded as lying inside.\n\n# Details\n\n- Rule category (`soort`): Inhoud waarde\n- Applies to (`validatieObjecten`): Amantelbuis\n- For a given Amantelbuis, the AmantelbuisInhoud records that reference it as InhoudID identify the parent (outer) mantelbuizen it lies inside.\n- The assertion requires that the inner pipe's Diameter is strictly smaller than the Diameter of every one of those outer pipes.\n- Diameter is a Text-typed attribute in the data model, so the abstract pattern coerces it to `number()` before comparing; outer pipes whose Diameter is \"KEUZE ONTBREEKT IN LIJST\" (no choice made) are excluded from the comparison, and the check is skipped entirely if the inner pipe's own Diameter is \"KEUZE ONTBREEKT IN LIJST\". Note: an earlier version of this pattern had a bug around this numeric coercion (missing xs:decimal/xs:integer conversion), later fixed.\n\nSee [R.30](./R.30.md), which also concerns mantelbuis/inhoud nesting relationships.\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix."}, {"id": "rules/R.28", "type": "Validation Rule", "title": "R.28 \u2014 Mantelbuis Inhoud aanwezig", "description": "Checks that a protection pipe (mantelbuis) in use has a registered content and a reserve one does not.", "tags": ["consistentie"], "group": "rules", "sz": 27, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "mantelbuis_inhoud_aanwezig.sch", "resource": "../../v12.1/rules/abstract_patterns/consistentie/mantelbuis_inhoud_aanwezig.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nWhether a mantelbuis is expected to have an AmantelbuisInhoud (its recorded content, e.g. a cable) depends on its Bedrijfstoestand: a pipe that is in service should have content registered, while a pipe kept in reserve should not.\n\n# Details\n\n- Rule category (`soort`): Consistentie\n- Applies to (`validatieObjecten`): Amantelbuis\n- If Bedrijfstoestand is \"IN BEDRIJF\", at least one AmantelbuisInhoud referencing the mantelbuis (via MantelbuisID) must exist.\n- If Bedrijfstoestand is \"RESERVE\", no AmantelbuisInhoud referencing the mantelbuis may exist.\n- Both conditions are checked as separate assertions on the same rule context.\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix."}, {"id": "rules/R.29", "type": "Validation Rule", "title": "R.29 \u2014 Verplaatsing goed vastgelegd", "description": "Checks that a cable relocation (Bewerking VERPLAATSEN) is recorded as a pair of objects \u2014 the original BESTAAND object and a new REVISIE object sharing the same GisId \u2014 rather than as a single mutated object.", "tags": ["consistentie"], "group": "rules", "sz": 30, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "verplaatsing_goed_vastgelegd.sch", "resource": "../../v12.1/rules/abstract_patterns/consistentie/verplaatsing_goed_vastgelegd.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA relocation (\"verplaatsing\") of a cable must be recorded as two objects of the same type: the existing object being moved (Status=BESTAAND) and a new object capturing the new geometry (Status=REVISIE, Bewerking=VERPLAATSEN). This rule checks that whenever an object is flagged as a relocation, a matching original object with the same GisId still exists, and that the relocation object itself carries no AssetId.\n\n# Details\n\n- soort: Consistentie\n- validatieObjecten: LSkabel, MSkabel\n- Condition:\n  - For any MSkabel/LSkabel with Status=REVISIE and Bewerking=VERPLAATSEN (\"is_verplaatsing\"):\n    - it must not have an AssetId (`verplaatsing-cannot-have-asset-id`, message `property-not-allowed-for-statuses`);\n    - there must exist a second object of the same NLCS type elsewhere in the file with Status=BESTAAND and the same GisId (`verplaatsing-correctly-applied`, message `verplaatsing-incorrectly-applied`).\n  - Objects that are not a relocation (`is_verplaatsing` false) are not constrained by either assertion.\n\nThis relocation pattern is the explicit exception referenced by [R.5](./R.5.md), whose GisId/AssetId presence check otherwise excludes REVISIE+VERPLAATSEN objects from its normal \"must carry GisId and AssetId\" requirement.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.3", "type": "Validation Rule", "title": "R.3 \u2014 Geometrie binnen Projectvlak", "description": "Checks that every point, line, and area geometry of every NLCS object in the file interacts with the project area of the AprojectReferentie.", "tags": ["geometrie"], "group": "rules", "sz": 30, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "geometrie_binnen_projectvlak.sch", "resource": "../../v12.1/rules/abstract_patterns/geometrie/geometrie_binnen_projectvlak.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nEvery NLCS object's geometry must spatially interact with the project area (the gml:Surface geometry) declared on the AprojectReferentie. This prevents objects from being submitted that lie entirely outside the project's own geographic scope.\n\n# Details\n\n- soort: Geometrie\n- validatieObjecten: Aaanlegtechniek, AbeschermingVlak, Akunstwerk, Amantelbuis, Eaarddraad, Eaardpen, LSkabel, LSmof, LSoverdrachtspunt, MSkabel, MSmof, MSoverdrachtspunt, MSstation, OVLoverdrachtspunt\n- Condition: depending on the geometry type of the object, the check differs:\n  - Point objects (MSmof, MSoverdrachtspunt, LSmof, LSoverdrachtspunt, OVLoverdrachtspunt, Eaardpen): the object's gml:Point must interact with the project area (`ma:point-interacts-with-area`).\n  - Line objects (MSkabel, Amantelbuis, Akunstwerk, Eaarddraad, Aaanlegtechniek, LSkabel): the object's gml:Curve must interact with the project area (`ma:line-interacts-with-area`).\n  - Area objects (MSstation, AbeschermingVlak): the object's gml:Surface must interact with the project area (`ma:area-interacts-with-area`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.30", "type": "Validation Rule", "title": "R.30 \u2014 Mantelbuis Inhoud referenties", "description": "Checks that an AmantelbuisInhoud correctly references a surrounding Amantelbuis and a distinct content object of the declared ObjectTypeInhoud.", "tags": ["consistentie"], "group": "rules", "sz": 30, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "mantelbuis_inhoud_referenties.sch", "resource": "../../v12.1/rules/abstract_patterns/consistentie/mantelbuis_inhoud_referenties.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nAn AmantelbuisInhoud object links a duct (mantelbuis) to the asset it contains. This rule checks that the two references are internally consistent: the content ID must differ from the duct ID, MantelbuisID must actually point to an Amantelbuis object, and InhoudID must point to an object whose type matches the declared ObjectTypeInhoud.\n\n# Details\n\n- soort: Consistentie\n- validatieObjecten: AmantelbuisInhoud\n- Condition:\n  - `mantelbuis-inhoud-is-not-self`: InhoudID must not equal MantelbuisID (message `mantelbuis-inhoud-is-self`).\n  - `mantelbuis-id-refers-to-mantelbuis`: the NLCS object with ID = MantelbuisID must exist and be an Amantelbuis (message `mantelbuis-id-does-not-refer-to-mantelbuis`).\n  - `object-type-inhoud-matches-inhoud`: the NLCS object with ID = InhoudID must have a type name matching the AmantelbuisInhoud's own ObjectTypeInhoud value (message `object-type-inhoud-does-not-match-inhoud`).\n\nThis rule is closely related to [R.27](./R.27.md) and [R.36](./R.36.md), which impose further consistency and geometric constraints on the same mantelbuis/inhoud relationship.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.31", "type": "Validation Rule", "title": "R.31 \u2014 Aanwezigheid bestand bijlage aardpen", "description": "Checks that every Eaardpen (earth pin) has a linked AbestandBijlage attachment of SoortBestand \"Aardingsrapport\".", "tags": ["document"], "group": "rules", "sz": 27, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "aanwezigheid_bestand_bijlage_aardpen.sch", "resource": "../../v12.1/rules/abstract_patterns/document/aanwezigheid_bestand_bijlage_aardpen.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nAn earth pin (Eaardpen) must be documented with a grounding report. This rule checks that an AbestandBijlage object linked to the Eaardpen exists and that its SoortBestand is \"Aardingsrapport\".\n\n# Details\n\n- soort: Document\n- validatieObjecten: Eaardpen\n- Condition (objects related via Eaardpen.ID = AbestandBijlage.AssetObjectID):\n  - `check-bestand-bijlage-present`: at least one related AbestandBijlage must exist (message `object-not-present`, placeholder `Abestandbijlage`).\n  - `check-correct-bestandsoort`: if present, its SoortBestand must equal \"Aardingsrapport\" (message `soort-bestand-not-correct`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.32", "type": "Validation Rule", "title": "R.32 \u2014 Aanwezigheid bestand bijlage kunstwerk", "description": "Checks that every zinker-type Akunstwerk has a linked AbestandBijlage attachment of SoortBestand \"Zinkertekening\".", "tags": ["document"], "group": "rules", "sz": 29, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "aanwezigheid_bestand_bijlage_kunstwerk.sch", "resource": "../../v12.1/rules/abstract_patterns/document/aanwezigheid_bestand_bijlage_kunstwerk.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA subaqueous crossing structure (a \"zinker\") must be documented with a drawing. This rule checks that, for any Akunstwerk whose SoortKunstwerk starts with \"ZINKER\" (e.g. ZINKER, ZINKER_BOOG, ZINKER_SLEEP, ZINKER_OMGEKEERD, ZINKER_SPUIT), a related AbestandBijlage object exists with SoortBestand \"Zinkertekening\".\n\n# Details\n\n- soort: Document\n- validatieObjecten: Akunstwerk\n- Condition (objects related via Akunstwerk.ID = AbestandBijlage.AssetObjectID):\n  - Only applies when `is_zinker` (SoortKunstwerk starts with \"ZINKER\"); non-zinker kunstwerken are not constrained.\n  - `check-bestand-bijlage-present`: for zinker kunstwerken, at least one related AbestandBijlage must exist (message `object-not-present`, placeholder `Abestandbijlage`).\n  - `soort_bestand_correct`: for zinker kunstwerken, the related AbestandBijlage's SoortBestand must equal \"Zinkertekening\" (message `soort-bestand-not-correct`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.33", "type": "Validation Rule", "title": "R.33 \u2014 Aanwezigheid bestand bijlage aanlegtechniek", "description": "Checks that every Aaanlegtechniek with SoortAanlegTechniek \"GESTUURDE TECHNIEK\" has a linked AbestandBijlage attachment of SoortBestand \"Gestuurde boring\".", "tags": ["document"], "group": "rules", "sz": 28, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "aanwezigheid_bestand_bijlage_aanlegtechniek.sch", "resource": "../../v12.1/rules/abstract_patterns/document/aanwezigheid_bestand_bijlage_aanlegtechniek.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA directional-drilling installation technique must be documented with a drilling report. This rule checks that, for any Aaanlegtechniek with SoortAanlegTechniek \"GESTUURDE TECHNIEK\", a related AbestandBijlage object exists with SoortBestand \"Gestuurde boring\".\n\n# Details\n\n- soort: Document\n- validatieObjecten: Aaanlegtechniek\n- Condition (objects related via Aaanlegtechniek.ID = AbestandBijlage.AssetObjectID; rule context is already restricted to `SoortAanlegTechniek = 'GESTUURDE TECHNIEK'`):\n  - `check-bestand-bijlage-present`: at least one related AbestandBijlage must exist (message `object-not-present`, placeholder `Abestandbijlage`).\n  - `bestandbijlage-must-be-gestuurde-boring`: the related AbestandBijlage's SoortBestand must equal \"Gestuurde boring\" (message `soort-bestand-not-correct`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.34", "type": "Validation Rule", "title": "R.34 \u2014 Reden niet-verwijdering ingevuld", "description": "Checks that an abandoned cable (Status REVISIE, Bedrijfstoestand VERLATEN) has a value for RedenNietVerwijdering explaining why it was not removed.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 27, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "reden_niet_verwijdering_ingevuld.sch", "resource": "../../v12.1/rules/abstract_patterns/verplichte_waarde/reden_niet_verwijdering_ingevuld.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nWhen a cable is abandoned in place rather than physically removed, the reason for not removing it must be recorded. This rule checks that any LSkabel/MSkabel with Status=REVISIE and Bedrijfstoestand=VERLATEN has a non-empty RedenNietVerwijdering value.\n\n# Details\n\n- soort: Verplichte waarde\n- validatieObjecten: LSkabel, MSkabel\n- Condition:\n  - `should_be_tested`: Status = 'REVISIE' and Bedrijfstoestand = 'VERLATEN'.\n  - `reden-niet-verwijdering-present`: if `should_be_tested`, RedenNietVerwijdering must exist and be non-empty (message `attribute-not-present`, placeholder `RedenNietVerwijdering`); otherwise the assertion passes vacuously.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.35", "type": "Validation Rule", "title": "R.35 \u2014 Aanwezigheid maaiveldhoogte", "description": "Checks that a revision drawing file (Tekeningtype DEELREVISIE or EINDREVISIE) contains at least one Amaaiveldhoogte (ground level) object.", "tags": ["bestand"], "group": "rules", "sz": 28, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "aanwezigheid_maaiveldhoogte.sch", "resource": "../../v12.1/rules/abstract_patterns/bestand/aanwezigheid_maaiveldhoogte.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nA revision drawing must include at least one ground-level measurement. This rule checks, at the level of the whole NLCS++ file, that a revision-type drawing (Tekeningtype DEELREVISIE or EINDREVISIE) contains one or more Amaaiveldhoogte objects.\n\n# Details\n\n- soort: Bestand\n- validatieObjecten: Document (evaluated at NLCSnetbeheer/file level, not per individual object)\n- Condition:\n  - `is_revisie`: AprojectReferentie/Tekeningtype is one of DEELREVISIE or EINDREVISIE.\n  - `revisie-has-maaiveldhoogte`: if `is_revisie`, the count of Amaaiveldhoogte children must be greater than 0 (message `revisie-no-maaiveldhoogte-present`); otherwise the assertion passes vacuously.\n  - Note this assertion's `properties` list is `rule-number severity` only (no `scope`/`object-type`/`object-id`), consistent with it being a file-level rather than object-level check.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.36", "type": "Validation Rule", "title": "R.36 \u2014 Afstand mantelbuis tot inhoud", "description": "Checks that every content asset related to an Amantelbuis (duct) lies within a configurable maximum distance of that duct's line geometry.", "tags": ["geometrie"], "group": "rules", "sz": 33, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "afstand_mantelbuis_tot_inhoud.sch", "resource": "../../v12.1/rules/abstract_patterns/geometrie/afstand_mantelbuis_tot_inhoud.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nThe assets running through a duct (mantelbuis) should physically lie along that duct, not stray far away from it. This rule checks that every content object linked to an Amantelbuis via AmantelbuisInhoud has geometry within a configurable maximum distance of the duct's own line geometry. The check assumes a duct does not cross itself.\n\n# Details\n\n- soort: Geometrie\n- validatieObjecten: Amantelbuis\n- Condition:\n  - Content objects are gathered via `AmantelbuisInhoud[MantelbuisID = duct ID]/InhoudID`, resolved to their NLCS objects.\n  - Both the duct and each content object's `Geometry` are parsed into lines (`ma:parse-line`).\n  - `inhoud-in-range-of-mantelbuis`: every content object's line must be within `ma:mantelbuis-inhoud-asset-max-distance()` of the duct's line (`ma:line-within-range-of-line`); any that are not are reported together (message `inhoud-assets-not-in-range-of-mantelbuis`, with the offending count and the max distance as placeholders).\n\nThe maximum distance is read from `configuration/sys_config.xml`'s `MantelbuisInhoudMaxAfstand` (currently `1`, in meters) via `ma:mantelbuis-inhoud-asset-max-distance()` \u2014 this is the \"configurable\" threshold called for in the rule's definition. See [sys_config reference](../config/sys-config.md).\n\nThe distance/line-buffer calculation behind this rule has been the subject of recent bugfixes (handling sequential coordinates at the same position, and rounding the computed distance to millimeters before comparing against the threshold to avoid floating-point false positives). See [distance precision rounding decision](../decisions/distance-precision-rounding.md) for the rationale behind those choices.\n\nThis rule is closely related to [R.27](./R.27.md) and [R.30](./R.30.md), which impose further consistency constraints on the same mantelbuis/inhoud relationship.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."}, {"id": "rules/R.37", "type": "Validation Rule", "title": "R.37 \u2014 Inmeetwijze toegestaande waarde", "description": "Checks that Inmeetwijze on linear electrical assets is either GPS or Tachymeter, except for a separately-validated LSkabel AANSLUITNET/Meetlint combination.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 31, "status": "", "state": "", "superseded_by": "", "superseded_cid": null, "stale_after": "", "stale_at": "", "tier": "unverified", "generated": {"by": "claude-code/opus-5-5", "at": "2026-11-10 00:00:00+00:00"}, "verified": [], "sources": [{"title": "NLCS Validatieregels catalog", "resource": "../../v12.1/doc/NLCSValidatieRegels.xml", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}, {"title": "inmeetwijze_toegestaande_waarde.sch", "resource": "../../v12.1/rules/abstract_patterns/inhoud_waarde/inmeetwijze_toegestaande_waarde.sch", "cid": null, "author": "", "usage_count": null, "usage_window": "", "last_modified": ""}], "body": "# Overview\n\nThis rule checks that the value of Inmeetwijze is either \"GPS\" or \"Tachymeter\" for linear electrical assets. The one exception is an LSkabel with Subnettype \"AANSLUITNET\", for which Inmeetwijze \"Meetlint\" is also tolerated here \u2014 that specific combination is excluded from this rule's assertion so it can instead be validated separately at its own severity level by [R.38](./R.38.md).\n\n# Details\n\n- soort: Inhoud waarde\n- validatieObjecten: LSkabel, MSkabel, Amantelbuis, Eaarddraad\n- Condition: `Inmeetwijze` must be a member of the configured allowed values, unless the object is an LSkabel with `Subnettype = 'AANSLUITNET'` and `Inmeetwijze = 'Meetlint'` (the `aansluitnet_meetlint_exception`), in which case the assertion is skipped so R.38 can judge it independently.\n- This rule only checks the *value* of Inmeetwijze; whether a value is present at all is checked separately by [R.6](./R.6.md).\n\nThe abstract pattern reads its allowed-values list via `ma:allowed-inmeetwijzen()`, which returns `configuration/sys_config.xml`'s `ToegestaandeInmeetwijzen` entries (GPS, Tachymeter); see [sys-config](../config/sys-config.md). On violation it emits the `inmeetwijze-not-allowed` message from the message catalog; see [localization-messages](../config/localization-messages.md).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](../domain/scope-severity-model.md) for the exact values."},
