<script>
const NODES=[{"id": "architecture/build-and-release", "type": "Architecture Component", "title": "Build and release", "description": "How the scope-checked schema, config, and docs are packaged into the versioned deliverable consumers actually use.", "tags": ["architecture", "release"], "group": "architecture", "sz": 32, "body": "# Overview\n\nThe artifact netbeheerders/contractors actually consume isn't this source\nrepo directly \u2014 it's a packaged zip produced by `scripts/bundle.sh` and\npublished as a GitHub Release asset by the `Deliverables` workflow (see\n[ci/workflows](/ci/workflows.md)) whenever a `v*` tag is pushed.\n\n`bundle.sh` assembles a `dist/` directory containing:\n- the **scope-checked** base schema, transpiled to XSLT\n  (`validation_schemas/base_scope_checks/v12.xsl` \u2014 see\n  [compilation-pipeline](/architecture/compilation-pipeline.md) for how the\n  scope-checked variant is produced) under `dist/src/base/`\n- the [xsl-function-libraries](/architecture/xsl-function-libraries.md) under\n  `dist/src/xsl_functions/`\n- `configuration/` (both `sys_config.xml` and `user_config.xml`) under\n  `dist/configuration/`\n- `doc/NLCSValidatieRegels.xml` (the rule catalog itself \u2014 needed at runtime\n  by `rule_scope_functions.xsl`) under `dist/doc/`\n- `localization/messages.xml` under `dist/localization/`\n\n...then zips `dist/` as `nlcspp_inhoudelijke_validaties.zip`. This is the\n\"run the same validations on every device\" deliverable the\n[project's stated goal](/domain/nlcs-plus-plus.md) refers to: a\nself-contained bundle a consumer can run against their own NLCS++ files with\njust Saxon, no dependency on this build toolchain.\n\n# Version scoping\n\nEverything here is versioned under `v12` (matching the external\n`NLCS_Netbeheer` XSD version, currently `12.1` per\n`scripts/install_dependencies.sh`'s `NLCS_NETBEHEER_VERSION`). A future\nschema version would add parallel `v13` directories rather than replacing\n`v12` in place.\n\n# Citations\n\n[1] [bundle.sh](../../scripts/bundle.sh)\n[2] [Deliverables.yml](../../.github/workflows/Deliverables.yml)"}, {"id": "architecture/compilation-pipeline", "type": "Architecture Component", "title": "Compilation and execution pipeline", "description": "How a Schematron rule becomes runnable XSLT and produces an SVRL validation report.", "tags": ["architecture", "build"], "group": "architecture", "sz": 39, "body": "# Overview\n\nThere is no persistent validation service \u2014 this repo is a toolchain that\ncompiles [Schematron rules](/architecture/schematron-layering.md) into\nstandalone XSLT, which is then run directly against an NLCS++ XML instance.\nThe pipeline, driven by bash scripts and **Saxon-HE** (Java, XSLT/XPath 3.0)\nplus **SchXSLT2** (a Schematron\u2192XSLT transpiler):\n\n1. **Dependency install** (`scripts/install_dependencies.sh`) \u2014 downloads\n   Saxon-HE, SchXSLT2's `transpile.xsl`, a custom `xerces-cli.jar` (XSD\n   validation), and the external `NLCS_Netbeheer.xsd` /\n   `NLCS_Netbeheer\u003cprovider>Import_Keuzelijst.xsd` schemas that define the\n   NLCS++ input format itself, from `schemas.mijnaansluiting.nl`. None of\n   these are vendored \u2014 they're fetched fresh on every run.\n\n2. **Per-phase transpilation** (`scripts/transpile_phases.sh`) \u2014 for every\n   rule (a Schematron \"phase\"), runs SchXSLT2's `transpile.xsl` (wrapped by\n   `wrappers/transpile_phase_wrapper.xsl`, which works around Saxon CLI not\n   accepting namespaced `schxslt:phase` parameters) against\n   `validation_schemas/base/v12.sch`, producing one standalone `.xsl`\n   stylesheet per rule under `validation_schemas/phases_transpiled/`:\n\n   ```bash\n   java -jar saxon-he.jar -xsl:wrappers/transpile_phase_wrapper.xsl \\\n     -s:validation_schemas/base/v12.sch \\\n     -o:validation_schemas/phases_transpiled/R.36.xsl phase=R.36\n   ```\n\n3. **Execution** \u2014 running that generated XSLT via Saxon against an NLCS++\n   XML instance produces an **SVRL** report (Schematron Validation Report\n   Language) listing `\u003csuccessful-report>`/`\u003cassert-failed>` elements\n   annotated with the `scope`/`severity`/`object-type` properties from\n   [schematron-layering](/architecture/schematron-layering.md).\n   `scripts/validate_rules.sh` does this for every rule against its\n   [test fixtures](/testing/rule-test-fixtures.md), and\n   `transformations/check_validation_reports.xsl` reduces a report to a\n   PASS/FAIL verdict by counting `\u003cassert-failed>` elements.\n\n4. **Scope-checked variant** \u2014 `scripts/add_scope_checks.sh` runs\n   `transformations/abstract_patterns_scope_checks.xsl` and\n   `transformations/base_scope_checks.xsl` to produce a rewritten schema\n   (`validation_schemas/abstract_patterns_scope_checks/`,\n   `validation_schemas/base_scope_checks/v12.sch`) whose abstract patterns\n   additionally assert that each object falls within its expected scope \u2014\n   this variant is what [scope-coverage-tests](/testing/scope-coverage-tests.md)\n   and the release bundle ([build-and-release](/architecture/build-and-release.md))\n   use, not the plain rule logic.\n\nThis whole pipeline exists so that a \"phase\" (= one rule) can be compiled and\nrun in isolation, which is what makes per-rule pass/fail testing in CI\ntractable \u2014 see [rule-test-fixtures](/testing/rule-test-fixtures.md).\n\n# Citations\n\n[1] [transpile_phases.sh](../../scripts/transpile_phases.sh)\n[2] [transpile_phase_wrapper.xsl](../../wrappers/transpile_phase_wrapper.xsl)\n[3] [validate_rules.sh](../../scripts/validate_rules.sh)"}, {"id": "architecture/schematron-layering", "type": "Architecture Component", "title": "Schematron rule layering", "description": "The three-layer design that separates rule metadata from rule logic \u2014 base schema, concrete pattern, abstract pattern.", "tags": ["architecture", "schematron"], "group": "architecture", "sz": 39, "body": "# Overview\n\nThe validation logic is a **Schematron** schema (`queryBinding=\"xslt3\"`) split\nacross three layers so that rule metadata (id, scope, severity) stays separate\nfrom the actual check logic, and so a single implementation can be reused by\nsub-checks that only differ in parameters:\n\n1. **`validation_schemas/base/v12.sch`** \u2014 the root schema. Declares\n   namespaces (`ma`, `gml`, `xs`, `nlcs`, `nvr`, `math`), a global\n   `\u003cproperties>` block (`scope`, `rule-number`, `severity`, `object-type`,\n   `object-id`, `geometries` \u2014 attached to every assert for downstream\n   reporting), one Schematron `\u003cphase>` per rule id (`R.1` \u2026 `R.41`, with\n   `R.4` and `R.8` each activating two patterns), the 5\n   [xsl-function-libraries](/architecture/xsl-function-libraries.md) via\n   `xsl:include`, then `include`s of every concrete pattern and every\n   abstract pattern file.\n\n2. **`validation_schemas/patterns/v12/R.\u003cn>.sch`** (concrete patterns) \u2014 one\n   per rule id (`R.4_A.sch`/`R.4_B.sch` and `R.8_A.sch`/`R.8_B.sch` for the\n   two split rules). Each is a thin, non-abstract pattern that only sets\n   `\u003cparam>`s \u2014 `rule_number`, `scope` (via `ma:scope-name(.)`), `severity`\n   (via `ma:rule-severity-within-scope(\u003cn>, .)`, see\n   [scope-severity-model](/domain/scope-severity-model.md)), `object_type`,\n   `object_id` \u2014 and declares `is-a=\"\u003cabstract-pattern-id>\"` to inherit the\n   actual rule body. Example (`R.36.sch`):\n\n   ```xml\n   \u003cpattern id=\"R.36\" is-a=\"afstand-mantelbuis-tot-inhoud\">\n       \u003cparam name=\"rule_number\" value=\"36\"/>\n       \u003cparam name=\"scope\" value=\"ma:scope-name(.)\"/>\n       \u003cparam name=\"severity\" value=\"ma:rule-severity-within-scope(36, .)\"/>\n       \u003cparam name=\"object_type\" value=\"name(.)\"/>\n       \u003cparam name=\"object_id\" value=\"nlcs:ID\"/>\n   \u003c/pattern>\n   ```\n\n3. **`validation_schemas/abstract_patterns/v12/\u003ccategory>/\u003cname>.sch`**\n   (abstract patterns) \u2014 `abstract=\"true\"` patterns containing the real\n   `\u003crule context=\"...\">`/`\u003cassert>` XPath 3.0 logic. Grouped into 8 category\n   directories that mirror each rule's `soort`: `bestand`, `consistentie`,\n   `document`, `geometrie`, `inhoud_waarde`, `netlogica`, `topologie`,\n   `verplichte_waarde`. Every [rule concept](/rules/index.md) links to its\n   specific abstract pattern file.\n\nThis indirection means the concrete/abstract split can host multiple\nconcrete patterns pointing at one abstract implementation (parameterized\nreuse), and keeps a rule's identity/metadata (id, scope wiring) decoupled\nfrom what it actually checks.\n\n# Turning this into something runnable\n\nThe `.sch` files above are Schematron source, not directly executable.\n[compilation-pipeline](/architecture/compilation-pipeline.md) describes how\nSchXSLT2 transpiles a chosen phase (rule) of this schema into standalone\nXSLT that Saxon can run against an NLCS++ instance document.\n\n# Citations\n\n[1] [base/v12.sch](../../validation_schemas/base/v12.sch)\n[2] [patterns/v12/R.36.sch](../../validation_schemas/patterns/v12/R.36.sch)\n[3] [abstract_patterns/v12/geometrie/afstand_mantelbuis_tot_inhoud.sch](../../validation_schemas/abstract_patterns/v12/geometrie/afstand_mantelbuis_tot_inhoud.sch)"}, {"id": "architecture/xsl-function-libraries", "type": "Architecture Component", "title": "Shared XSL function libraries", "description": "The five custom ma:-namespace XSLT function libraries every rule's logic is built from.", "tags": ["architecture", "xslt"], "group": "architecture", "sz": 36, "body": "# Overview\n\n`validation_schemas/xsl_functions/` holds shared XSLT 3.0 function libraries\nin a custom `ma:` (mijnaansluiting) namespace, included once into\n[`base/v12.sch`](/architecture/schematron-layering.md) and used by every\nabstract pattern:\n\n| File | Purpose |\n|---|---|\n| `geometry_functions.xsl` | Parses and analyzes GML geometry (`gml:Point`/`gml:Curve`/`gml:Surface`): intersection/containment checks, segment length and angle calculations, distance calculations. The largest library \u2014 backs geometric rules like [R.3](/rules/R.3.md), [R.4](/rules/R.4.md), and [R.36](/rules/R.36.md). |\n| `config_functions.xsl` | Reads [`configuration/sys_config.xml`](/config/sys-config.md) \u2014 decimal precision, allowed-value lists, thresholds, exceptions \u2014 e.g. `ma:allowed-inmeetwijzen()` for [R.37](/rules/R.37.md), `ma:mantelbuis-inhoud-asset-max-distance()` for [R.36](/rules/R.36.md), `ma:map-mof-functie()` for [R.26](/rules/R.26.md), and the GisId/AssetId exception lookups for [R.5](/rules/R.5.md). |\n| `localization_functions.xsl` | Looks up a message by id and language in [`localization/messages.xml`](/config/localization-messages.md) (per the `Language` setting in `configuration/user_config.xml`), substituting `{n}` placeholders with rule-specific values before attaching the text to an `assert`. |\n| `rule_scope_functions.xsl` | The scope/severity engine \u2014 reads the `\u003cscopes>` section of `doc/NLCSValidatieRegels.xml` to compute `ma:scope-name`, `ma:rule-severity-within-scope`, and `ma:rule-within-scope-for-object`, matching an object's Tekeningtype/Status/Bedrijfstoestand to one of the 8 scopes. See [scope-severity-model](/domain/scope-severity-model.md). |\n| `helper_functions.xsl` | Misc utilities shared across abstract patterns (e.g. object-existence and attribute-presence helpers used by many \"verplichte kenmerken\" rules). |\n| `connectivity_functions.xsl` | A shared mof/overdrachtspunt \u2194 kabel/eaarddraad touch index (`ma:touching-kabels`, `ma:touching-moffen`, `ma:touching-kabels-via-moffen`), computed once per run and reused by [R.20](/rules/R.20.md), [R.22](/rules/R.22.md), [R.23](/rules/R.23.md), [R.25](/rules/R.25.md), [R.26](/rules/R.26.md), and [R.39](/rules/R.39.md) instead of each doing its own brute-force scan. See [connectivity-index-and-geometry-caching](/decisions/connectivity-index-and-geometry-caching.md) for why. |\n\n# Citations\n\n[1] [validation_schemas/xsl_functions/](../../validation_schemas/xsl_functions/)"}, {"id": "ci/workflows", "type": "CI/CD Pipeline", "title": "GitHub Actions workflows", "description": "The 6 workflows that validate rules/scopes/docs on every PR, check coverage, and publish releases and docs.", "tags": ["ci-cd"], "group": "ci", "sz": 33, "body": "# Overview\n\nAll workflows run on `ubuntu-latest` with JDK 21 Temurin. Most install the\nsame toolchain (`scripts/install_dependencies.sh` \u2014 Saxon-HE, SchXSLT2,\nxerces-cli, external NLCS_Netbeheer schemas) before running.\n\n| Workflow | Trigger | Purpose |\n|---|---|---|\n| `RuleValidation.yml` | PR, push to `main`/`develop` | XSD-validates rule fixtures \u2192 [transpiles phases](/architecture/compilation-pipeline.md) \u2192 runs every rule against its [passing/failing fixtures](/testing/rule-test-fixtures.md) \u2192 uploads SVRL reports as a build artifact \u2192 checks pass/fail verdicts \u2192 [checks object coverage](/testing/coverage-checks.md). |\n| `ScopeValidation.yml` | PR, push to `main`/`develop` | Produces the [scope-checked schema variant](/architecture/compilation-pipeline.md) \u2192 runs [scope-coverage-tests](/testing/scope-coverage-tests.md) to verify every scope's rule set is exactly right. |\n| `DocValidation.yml` | PR/push touching `doc/**` | XSD-validates `doc/NLCSValidatieRegels.xml` itself (`test/XMLValidation.java`) \u2192 regenerates and diff-checks the rendered HTML docs and the [test-visualization](/testing/test-visualization.md) SVGs, failing if either is stale. |\n| `RuleCoverage.yml` | PR, push to `main`/`develop` | Lightweight, no toolchain install \u2014 cross-checks rule ids between `doc/NLCSValidatieRegels.xml` and `validation_schemas/base/v12.sch` via [coverage-checks](/testing/coverage-checks.md). |\n| `Deliverables.yml` | push of a `v*` tag | Produces the scope-checked schema, runs [build-and-release](/architecture/build-and-release.md)'s `bundle.sh`, uploads `nlcspp_inhoudelijke_validaties.zip` as a GitHub Release asset. |\n| `DeployWithGhPages.yml` | push to `main` | Publishes `doc/NLCSValidatieRegels.html` (plus an `index.html` redirect) to GitHub Pages. |\n\n# Citations\n\n[1] [.github/workflows/](../../.github/workflows/)"}, {"id": "config/localization-messages", "type": "Configuration", "title": "Localization messages (messages.xml)", "description": "The nl/en message catalog that validation rules use to produce human-readable failure text.", "tags": ["configuration", "localization"], "group": "config", "sz": 44, "body": "# Overview\n\n`localization/messages.xml` is a flat catalog of `\u003cmessage id=\"...\">` entries,\neach with an `nl` and `en` `\u003cmessage-text>` variant. Message text may contain\n`{1}`, `{2}`, ... placeholders that\n`validation_schemas/xsl_functions/localization_functions.xsl` substitutes with\nrule-specific values (attribute names, expected/found values, thresholds)\nbefore the text is attached to a Schematron `assert`. Which language variant\nis picked is controlled by [user-config](/config/user-config.md)'s `Language`\nsetting.\n\nAbstract pattern implementations call into this catalog by message id \u2014 each\n[rule concept](/rules/index.md) that emits a specific message links back here.\nSeveral ids are generic and reused across many \"verplichte kenmerken\" style\nrules (e.g. `attribute-not-present`, `property-required-for-statuses`), while\nothers are specific to a single rule (e.g.\n`inhoud-assets-not-in-range-of-mantelbuis` for\n[R.36](/rules/R.36.md)).\n\n# Schema\n\n| Message id | Used for |\n|---|---|\n| `no-nlcs-objects-present` | [R.1](/rules/R.1.md) \u2014 file has no NLCS objects. |\n| `invalid-status-for-tekening-type` | [R.2](/rules/R.2.md) \u2014 Status not allowed for the Tekeningsoort. |\n| `object-outside-project-area` | [R.3](/rules/R.3.md) \u2014 geometry outside the project area. |\n| `line-segment-measurement-incorrect` | [R.4](/rules/R.4.md) (R.4-A) \u2014 segment shorter than 10cm or longer than 50m. |\n| `line-angle-larger-than-45` | [R.4](/rules/R.4.md) (R.4-B) \u2014 angle between segments exceeds 45\u00b0. |\n| `attribute-not-present` / `attribute-present` | Generic mandatory-attribute presence/absence checks (R.9\u2013R.15, R.40, R.41, etc). |\n| `property-required-for-statuses` / `property-not-allowed-for-statuses` | Generic status-conditional attribute checks (e.g. R.5). |\n| `object-not-present` | Generic required-related-object checks (R.31\u2013R.33). |\n| `date-in-the-future` | [R.9](/rules/R.9.md), [R.41](/rules/R.41.md) \u2014 a date attribute is in the future. |\n| `point-not-connected-to-any-line` | [R.20](/rules/R.20.md) \u2014 point object not connected to a cable. |\n| `cable-not-connected-to-valid-object` | [R.21](/rules/R.21.md) \u2014 invalid cable endpoint. |\n| `connected-cable-does-not-match-netvlak` | [R.22](/rules/R.22.md) \u2014 joined cables differ in netvlak. |\n| `connected-cable-does-not-match-property` | [R.23](/rules/R.23.md) \u2014 joined cables differ in a shared attribute. |\n| `fase-not-the-same-as-uitvoering` | [R.24](/rules/R.24.md) \u2014 Fase/Uitvoering mismatch. |\n| `connected-fases-not-allowed` / `connected-fases-do-not-match` / `connected-fases-do-not-split` | [R.25](/rules/R.25.md) \u2014 phase-combination checks at a joint. |\n| `cable-amount-incorrect` / `cable-amount-unknown` / `existing-cable-not-connected-to-new-cable` | [R.26](/rules/R.26.md) \u2014 cable-count-vs-Functie checks. |\n| `mantelbuis-inhoud-diameter-larger-than-own` | [R.27](/rules/R.27.md) \u2014 nested duct diameter too large. |\n| `inhoud-found` / `inhoud-not-found` | [R.28](/rules/R.28.md) \u2014 duct-content presence/absence vs Bedrijfstoestand. |\n| `verplaatsing-incorrectly-applied` | [R.29](/rules/R.29.md) \u2014 relocation not recorded with a matching pair. |\n| `mantelbuis-inhoud-is-self` / `mantelbuis-id-does-not-refer-to-mantelbuis` / `object-type-inhoud-does-not-match-inhoud` | [R.30](/rules/R.30.md) \u2014 duct-content reference checks. |\n| `soort-bestand-not-correct` | [R.31](/rules/R.31.md)\u2013[R.33](/rules/R.33.md) \u2014 attached-document SoortBestand mismatch. |\n| `revisie-no-maaiveldhoogte-present` | [R.35](/rules/R.35.md) \u2014 missing ground-level object in a revision. |\n| `inmeetwijze-not-allowed` | [R.37](/rules/R.37.md), [R.38](/rules/R.38.md) \u2014 disallowed survey method. |\n| `inhoud-assets-not-in-range-of-mantelbuis` | [R.36](/rules/R.36.md) \u2014 duct content farther than the configured max distance. |\n| `connected-cables-have-different-verbindingnummer` | [R.39](/rules/R.39.md) \u2014 cable/joint Verbindingnummer mismatch. |\n\nThis table lists the ids confirmed while authoring the rule concepts; it is\nnot necessarily exhaustive of every id in the file.\n\n# Citations\n\n[1] [messages.xml](../../localization/messages.xml)\n[2] [localization_functions.xsl](../../validation_schemas/xsl_functions/localization_functions.xsl)"}, {"id": "config/sys-config", "type": "Configuration", "title": "System configuration (sys_config.xml)", "description": "Version-scoped thresholds, allowed-value lists, and exceptions consumed by several validation rules.", "tags": ["configuration"], "group": "config", "sz": 34, "body": "# Overview\n\n`configuration/sys_config.xml` holds tunable values for rule logic, scoped\nunder a `\u003cv12>` element matching the current NLCS++ version. Values are read\nat validation time by functions in\n`validation_schemas/xsl_functions/config_functions.xsl`, so a rule's actual\nbehavior can be adjusted without touching Schematron pattern code.\n\n# Schema\n\n| Field | Value (v12) | Used by |\n|---|---|---|\n| `DecimalPrecision` | `3` | Numeric rounding precision used across geometric/numeric comparisons. |\n| `MofFuncties/Aftak` | `AFTAK SPLITSEND` | [R.26](/rules/R.26.md) \u2014 maps joint Functie values to the \"Aftak\" category. |\n| `MofFuncties/Eind` | `EINDMOF`, `EINDDOP`, `LOODKOP`, `EIND GEAARD` | [R.26](/rules/R.26.md) \u2014 \"Eind\" category. |\n| `MofFuncties/Verbinding` | `VERBINDING`, `ZEGELWIJZIGING`, `MANTELREPARATIE` | [R.26](/rules/R.26.md) \u2014 \"Verbinding\" category. |\n| `MofFuncties/Faseovergang` | `3FASE 3x1FASE` | [R.26](/rules/R.26.md) \u2014 \"Faseovergang\" category. |\n| `ToegestaandeInmeetwijzen/Inmeetwijze` | `GPS`, `Tachymeter` | [R.37](/rules/R.37.md) \u2014 allowed survey-method values. |\n| `GisIdAssetsIdExceptions/NoGisIdRequired` | `AmantelbuisInhoud` | [R.5](/rules/R.5.md) \u2014 object types exempt from the GisId requirement. |\n| `MantelbuisInhoudMaxAfstand` | `1` (meter) | [R.36](/rules/R.36.md) \u2014 max allowed distance between a protection pipe and its content. |\n\n`GisIdAssetsIdExceptions` also has a commented-out `NoAssetIdRequired` slot,\nreserved for future AssetId exceptions but currently unused.\n\n# Related\n\n[user-config.md](/config/user-config.md) holds the separate `Language`\nsetting consumed by [localization-messages](/config/localization-messages.md).\nThe `DecimalPrecision`/rounding behavior here is closely related to the\ngeometric precision issues discussed in\n[distance-precision-rounding](/decisions/distance-precision-rounding.md).\n\n# Citations\n\n[1] [sys_config.xml](../../configuration/sys_config.xml)\n[2] [config_functions.xsl](../../validation_schemas/xsl_functions/config_functions.xsl)"}, {"id": "config/user-config", "type": "Configuration", "title": "User configuration (user_config.xml)", "description": "The single language setting that selects which localized message text validation reports use.", "tags": ["configuration", "localization"], "group": "config", "sz": 26, "body": "# Overview\n\n`configuration/user_config.xml` is a minimal, per-run config file with a\nsingle field:\n\n```xml\n\u003cconfig>\n    \u003cLanguage>nl\u003c/Language>\n\u003c/config>\n```\n\n`Language` (`nl` or `en`) selects which `xml:lang` variant\n`validation_schemas/xsl_functions/localization_functions.xsl` picks when\nresolving a message id from\n[localization-messages](/config/localization-messages.md) for an SVRL assert\nreport.\n\n# Citations\n\n[1] [user_config.xml](../../configuration/user_config.xml)\n[2] [localization_functions.xsl](../../validation_schemas/xsl_functions/localization_functions.xsl)"}, {"id": "decisions/connectivity-index-and-geometry-caching", "type": "Decision", "title": "Shared connectivity index and geometry caching for mof/kabel touch checks", "description": "Why R.20, R.22, R.23, R.25, R.26, and R.39 now share one precomputed touch index instead of each doing its own brute-force geometry scan.", "tags": ["decision", "performance", "geometry"], "group": "decisions", "sz": 60, "body": "# Context\n\nA stress-test file (`benchmark.xml`: 286 LSkabel, 251 LSmof, 136\nLSoverdrachtspunt, 99 OVLoverdrachtspunt, 7 MSkabel; geometries averaging ~32\nvertices, one line with ~593) took **132 seconds** to validate under\n\"Bestaande Situatie\" \u2014 far too slow for a single file. An earlier, separate\nfix to [xsl-function-libraries](/architecture/xsl-function-libraries.md)'s\n`geometry_functions.xsl` (rounding/line-buffer precision work, unrelated to\nthis decision) had already cut that from an even higher baseline; this\ndecision covers a second, structural fix.\n\nProfiling pointed at [R.20](/rules/R.20.md), [R.22](/rules/R.22.md),\n[R.23](/rules/R.23.md), [R.25](/rules/R.25.md), and [R.26](/rules/R.26.md) \u2014\nplus [R.39](/rules/R.39.md), found to share the identical pattern during\nthis investigation \u2014 as the dominant cost, all built on `ma:point-touches-line`.\n\n# Root causes\n\nReading every abstract pattern that calls `ma:point-touches-line`/\n`ma:parse-line`/`ma:parse-point` (in `helper_functions.xsl`/\n`geometry_functions.xsl`) surfaced two compounding problems:\n\n1. **No caching.** `ma:parse-line`/`ma:parse-point` re-tokenize the raw GML\n   coordinate string and rebuild a fresh element tree on *every* call. Every\n   rule invoked them inside a per-context-node predicate that rescans the\n   whole candidate population, so the same object's geometry was rebuilt\n   thousands of times per run.\n2. **No shared \"which kabels does this mof touch\" index.** R.20, R.22, R.23,\n   R.25, R.26, and R.39 each independently brute-force scanned\n   `//nlcs:MSkabel`/`//nlcs:LSkabel` for every mof/overdrachtspunt. Since\n   `benchmark.sh` runs the full combined schema (all phases in one\n   stylesheet \u2014 see [compilation-pipeline](/architecture/compilation-pipeline.md)),\n   this identical relationship was recomputed 6 separate times per run.\n   R.22 and R.23 additionally **nested** the scan: for every kabel, find\n   connected moffen, then re-scan *all* cables again per connected mof \u2014\n   effectively O(cables\u00b2 \u00d7 moffen-per-cable).\n\n# Decision\n\nAdded `validation_schemas/xsl_functions/connectivity_functions.xsl`\n(see [xsl-function-libraries](/architecture/xsl-function-libraries.md)),\ncomputed lazily once per validation run and reused by all 6 rules:\n\n- Each covered object's geometry (`MSmof`/`LSmof`/`Eaardmof`/\n  `MSoverdrachtspunt`/`LSoverdrachtspunt`/`OVLoverdrachtspunt` on the point\n  side; `MSkabel`/`LSkabel`/`HSkabel`/`Eaarddraad` on the line side) is\n  parsed exactly once.\n- The touch relationship is represented as **two XPath 3.1 maps** \u2014\n  `mof-id -> touching kabel-ids` and its inverse \u2014 rather than a constructed\n  element tree indexed via `xsl:key`. The inverse is derived from the\n  forward map with `map:merge(..., map{'duplicates':'combine'})` instead of\n  re-running the geometry scan a second time.\n- Three public functions replace every rule's inline brute-force predicate:\n  `ma:touching-kabels($point)`, `ma:touching-moffen($kabel)`, and\n  `ma:touching-kabels-via-moffen($moffen, $kabel_type)` (the \"second hop\"\n  R.22/R.23 need \u2014 composes two O(1)-ish map lookups instead of a nested\n  full-document rescan).\n- R.20, R.22, R.23, R.25, R.26, and R.39's abstract patterns were rewritten\n  to call these functions. Every `\u003cassert>` test/message is byte-for-byte\n  unchanged \u2014 only the source of each `$connected_*` variable changed.\n\nThis eliminates the \u00d76 duplicated computation (built once instead of once\nper rule) and replaces R.22/R.23's O(cables\u00b2 \u00d7 moffen) nested rescan with\nO(1)-ish composed lookups, without changing what any rule actually checks.\n\n# Why maps instead of a constructed tree + `xsl:key`\n\nThe first implementation represented the touch table as constructed\n`\u003cTouch mof_id=\"...\" kabel_id=\"...\" kabel_type=\"...\"/>` elements, indexed via\n`xsl:key` \u2014 the more \"obvious\" XSLT idiom, and consistent with how\n[rule_scope_functions.xsl](/architecture/xsl-function-libraries.md) already\nuses a top-level `document()`-backed variable. It worked correctly in\nisolated tests (a minimal stylesheet including just the geometry/config/\nhelper/connectivity libraries) but **intermittently failed once compiled\ninto the full 41-rule schema** and run against the ~142,000-pair cross\nproduct (486 points \u00d7 293 lines), with a Saxon error claiming an empty\nsequence where a point or line node was expected.\n\nThis was tracked down to a genuine Saxon lazy/tail-call evaluation defect,\nnot a logic bug: wrapping every individual pair's check in `xsl:try`/\n`xsl:catch` and re-running all ~142,000 pairs produced **zero** real\nfailures \u2014 every pair evaluates correctly on its own. The error only\nappeared when Saxon was left to lazily defer and batch many thousands of\nthese calls inside one large `xsl:variable`'s constructed content, at which\npoint it would occasionally force a deferred call against a stale context.\n`xsl:try` reliably avoided it (by forcing eager evaluation) in isolation,\nbut the failure mode reappeared once nested inside the much larger compiled\nschema's own template-dispatch machinery, so it wasn't a fix that could be\ntrusted in production.\n\nRebuilding the same relationship as two XPath maps \u2014 `xsl:map`/\n`xsl:map-entry` construction with a pure `for ... return ... if ... then ...\nelse` XPath expression as each entry's value, no element nodes, no\n`xsl:key` \u2014 sidesteps that evaluation path entirely and has run cleanly\nthrough the full schema and benchmark repeatedly since. It's also arguably\nthe more idiomatic XPath 3.1 way to express a lookup table that was never\nmeant to be traversed as a document.\n\n# Explicitly out of scope\n\n- **Spatial/grid indexing.** The remaining cost is the one-time O(points \u00d7\n  lines) index build itself \u2014 every point is still bounding-box-tested\n  against every candidate line at least once. A grid/bucket pre-filter\n  (only comparing objects whose bounding boxes fall in the same or\n  neighboring cell) would cut this further but is a separate, larger piece\n  of work not undertaken here.\n- **R.21** (`geldig_eindpunt_kabel.sch`) calls `ma:parse-point` on the same\n  object populations but checks point-to-point coincidence, not\n  point-to-line touching \u2014 a structurally different relationship the\n  connectivity index above doesn't model. It was deliberately left\n  untouched to keep this change's blast radius limited to the 6 rules that\n  actually share the rewritten relationship, rather than also modifying\n  `ma:parse-point`/`ma:parse-line` themselves (which are called by all 41\n  rules, not just these 6).\n\n# Verification\n\n- All 41 rules' `passing`/`failing` fixtures under\n  [rule-test-fixtures](/testing/rule-test-fixtures.md) produced identical\n  PASS/FAIL verdicts before and after (`scripts/validate_rules.sh` +\n  `scripts/validate_rule_reports.sh`), including R.20/22/23/25/26/39.\n- [coverage-checks](/testing/coverage-checks.md)\n  (`check_rule_coverage.sh`, `check_rule_object_coverage.sh`): zero\n  mismatches.\n- `benchmark.sh` against `benchmark.xml`: **132s \u2192 ~27s** in this\n  environment (~5x), consistent with removing the \u00d76 cross-rule duplication\n  and the R.22/R.23 nested rescans.\n\n# Citations\n\n[1] [connectivity_functions.xsl](../../validation_schemas/xsl_functions/connectivity_functions.xsl)\n[2] [benchmark.xml / benchmark.sh (stress-test fixture and harness, not part of the committed rule test suite)](../../benchmark.sh)"}, {"id": "decisions/distance-precision-rounding", "type": "Decision", "title": "Rounding geometric comparisons to millimeters", "description": "Why distance/touch checks round to a configured decimal precision instead of comparing raw floating-point doubles.", "tags": ["decision", "geometry"], "group": "decisions", "sz": 40, "body": "# Context\n\nSeveral geometric checks \u2014 [R.3](/rules/R.3.md) (geometry within project\narea), [R.4](/rules/R.4.md) (line segment length/angle), and\n[R.36](/rules/R.36.md) (duct-to-content distance) \u2014 rely on\n`geometry_functions.xsl` computing whether two coordinates are \"the same\npoint,\" whether a point lies exactly on a segment, or whether a buffered line\ntouches an area. Comparing raw `xs:double` results of floating-point distance\nmath directly (`= 0`, `a + b = c`) is fragile: real-world surveyed\ncoordinates that are geometrically coincident can differ by a\nfloating-point epsilon, causing an intersection/touch check to spuriously\nfail.\n\n# Decision\n\nTwo related fixes, in order:\n\n1. **`5a58dee` \u2014 \"R.36: Fix line buffer calculation with sequential coords\n   at same position\" (#90)** (2026-05-01). `ma:buffer-line`'s\n   left/right-bounds construction produced degenerate orthogonal segments\n   when two sequential coordinates in a line were at the exact same\n   position (segment length 0) \u2014 a legitimate scenario for surveyed/GML\n   data with duplicate vertices. Fixed by skipping zero-length segments\n   when building the buffer's bounding polygon (`ma:segment-length($segment)\n   != 0` guard), verified with a new `complex.xml` fixture exercising\n   exactly this shape (see [rule-test-fixtures](/testing/rule-test-fixtures.md)).\n\n2. **`1e78ce1` \u2014 \"Limit rounding to millimeters for final interaction\n   checks\" (#92)** (2026-05-07). Introduced `configuration/sys_config.xml`'s\n   `DecimalPrecision` (`3`, i.e. millimeter precision at the project's\n   coordinate units) and a new `ma:trim-decimals` helper\n   (`round($number * 10^precision) div 10^precision`) in\n   [config/sys-config.md](/config/sys-config.md)-backed\n   `helper_functions.xsl`. `ma:point-equals-point` and\n   `ma:point-touches-segment` now round both sides of their equality checks\n   through `ma:trim-decimals` before comparing, instead of comparing raw\n   doubles. `ma:line-touches-area` also gained an additional interaction\n   check (`some $point in $area satisfies ma:point-touches-line($point,\n   $line)`) to catch a line barely touching an area's boundary \u2014 verified\n   with the new `line_barely_touching_area.xml` fixture under\n   [R.3](/rules/R.3.md).\n\n# Why this matters\n\nAny new geometric check built on `point-equals-point`, `point-touches-segment`,\nor `line-touches-area` inherits millimeter-level tolerance automatically \u2014\ndon't reintroduce raw `=` comparisons on distance/coordinate doubles, and\ndon't change `DecimalPrecision` without checking which rules' pass/fail\nfixtures assume 1mm tolerance (notably [R.36](/rules/R.36.md)'s `_offset`\nand `exact_same_position` fixtures).\n\n# Citations\n\n[1] [5a58dee \u2014 R.36: Fix line buffer calculation with sequential coords at same position (#90)](https://github.com/mijnaansluiting/Inhoudelijke-validaties/commit/5a58dee5ae6f40613922d7ad15207575701a2d7a)\n[2] [1e78ce1 \u2014 Limit rounding to millimeters for final interaction checks (#92)](https://github.com/mijnaansluiting/Inhoudelijke-validaties/commit/1e78ce1313103608cae025b24ac141a9d7403b31)\n[3] [geometry_functions.xsl](../../validation_schemas/xsl_functions/geometry_functions.xsl)\n[4] [helper_functions.xsl](../../validation_schemas/xsl_functions/helper_functions.xsl)"}, {"id": "decisions/scope-bound-vs-scopeless-rules", "type": "Decision", "title": "Bestand-category rules are severity-scopeless", "description": "Why file-level rules like R.1/R.2/R.35/R.40 always report severity \"Fout\" instead of being matched against a scope.", "tags": ["decision", "scope"], "group": "decisions", "sz": 40, "body": "# Context\n\n[Rule severity](/domain/scope-severity-model.md) is normally computed by\nmatching the object under validation (its Tekeningsoort/Status/\nBedrijfstoestand) against one of the 8 scopes, then looking up that rule's\n`niveau` within the matched scope. That matching only works when the rule's\nSchematron `\u003crule context>` fires on a per-object basis.\n\nRules of `soort` **Bestand** ([R.1](/rules/R.1.md), [R.2](/rules/R.2.md),\n[R.35](/rules/R.35.md), [R.40](/rules/R.40.md)) don't fit that model \u2014 they\nassert something about the *file as a whole* (context `//nlcs:NLCSnetbeheer`\nor `AprojectReferentie`), not about an individual NLCS object with its own\nStatus/Bedrijfstoestand. There is no single \"object\" to compute a scope from.\n\n# Decision\n\n`ma:rule-severity-within-scope` (in\n[rule_scope_functions.xsl](/architecture/xsl-function-libraries.md))\nspecial-cases rules whose `ma:rule-type` is `Bestand`: rather than attempting\nscope matching, it unconditionally returns `Fout`. This is why\n[scope-severity-model](/domain/scope-severity-model.md)'s matrix shows\n`R.1`, `R.2`, and `R.35` as `Fout` in literally every scope \u2014 the rule\nsimply isn't scope-dependent at all. (`R.40` is the same mechanism, but its\n*own* check logic only applies when Tekeningtype is `DEELREVISIE`/\n`EINDREVISIE`, which is why it shows `\u2013` for the other two Tekeningsoorten\nrather than because of scope matching.)\n\n# History\n\nThis wasn't the original design. Two fixes got here incrementally:\n\n1. **`e365bcb` \u2014 \"R.1 and R.2 always explicitly within scope\"** (2026-01-15).\n   The original code special-cased `object_type = 'NLCSnetbeheer'` to mean\n   \"always in scope\", but that check didn't reliably identify which rules\n   needed it. The fix replaced it with an explicit rule-number allowlist:\n   `$rule_numbers_always_within_scope = (1, 2)`.\n\n2. **`f519af4` \u2014 \"Scopeless rules consistency\" (#88)** (2026-04-14). The\n   allowlist-of-rule-numbers approach was replaced with the current\n   category-based check (`$rule_type = 'Bestand'`), which generalizes to\n   *any* Bestand rule (including `R.35`/`R.40`) instead of needing every new\n   file-level rule added to a hardcoded list. This PR also reworked\n   [R.2](/rules/R.2.md)'s own abstract pattern\n   (`combinatie_nlcs_status_en_tekeningsoort.sch`) to evaluate all objects'\n   statuses in one file-level assert (`distinct-values(*/nlcs:Status)`)\n   instead of one assert per object, and consolidated the corresponding\n   [test fixtures](/testing/rule-test-fixtures.md) (many near-duplicate\n   per-object-type failing fixtures collapsed into one per Tekeningsoort).\n\n# Why this matters\n\nIf a future rule is added with `soort` Bestand, it will automatically be\n`Fout`-severity everywhere via the category check \u2014 no scope-table entry is\nneeded, and none should be added, since [scope-coverage-tests](/testing/scope-coverage-tests.md)\ntests object-level scope matching, not file-level rules.\n\n# Citations\n\n[1] [e365bcb \u2014 R.1 and R.2 always explicitly within scope](https://github.com/mijnaansluiting/Inhoudelijke-validaties/commit/e365bcb213b4cc0e05f4c5efcda50974e9e489ec)\n[2] [f519af4 \u2014 Scopeless rules consistency (#88)](https://github.com/mijnaansluiting/Inhoudelijke-validaties/commit/f519af4517d2a4c181b90ede1096bf24d841ddd4)\n[3] [rule_scope_functions.xsl](../../validation_schemas/xsl_functions/rule_scope_functions.xsl)"}, {"id": "domain/nlcs-plus-plus", "type": "Domain Concept", "title": "NLCS++ and content validation", "description": "What NLCS++ is and why structural XSD validation isn't enough to guarantee usable grid-asset data.", "tags": ["domain", "nlcs"], "group": "domain", "sz": 34, "body": "# Overview\n\nNLCS++ is the Dutch electricity grid-asset information exchange format used\nbetween contractors/surveyors and netbeheerders (grid operators) to hand over\ngeometries and attributes of grid assets \u2014 LS/MS cables, joints (moffen),\nprotection pipes (mantelbuis), transfer points, stations, and related\ndocuments \u2014 as an XML file (namespace `NS_NLCSnetbeheer`).\n\nAn XSD schema (`NLCS_Netbeheer.xsd`, an external dependency fetched at build\ntime \u2014 see [build-and-release](/architecture/build-and-release.md)) guarantees\nthe file is *structurally* valid: the right elements, in the right shape.\nIt says nothing about whether the *content* is sensible \u2014 whether a cable's\ndeclared endpoints actually exist, whether required attributes are filled in,\nwhether geometry sits inside the project area, and so on. This repository\nimplements exactly that layer: **Inhoudelijke Validaties** (content\nvalidations), expressed as Schematron rules \u2014 see\n[schematron-layering](/architecture/schematron-layering.md).\n\n# Why Schematron\n\nSchematron was chosen specifically because it is a decentralized,\nsystem-agnostic way to validate XML content: any party \u2014 a netbeheerder's\nbackend, a contractor's laptop, a CI pipeline \u2014 can run the exact same rule\nset against an NLCS++ file and get identical results, without depending on a\nshared service. That's the stated goal of the project: run the same content\nvalidations \"on every device\" that the netbeheerder itself runs.\n\n# The rule catalog\n\nThe 37 rules (`R.1`\u2013`R.41`, with gaps at `R.16`\u2013`R.19`) are catalogued with\ntheir full Dutch definitions in `doc/NLCSValidatieRegels.xml` (rendered as\nHTML and published to GitHub Pages). Each rule has its own OKF concept under\n[/rules](/rules/index.md). Rules don't all apply with the same severity in\nevery situation \u2014 see [scope-severity-model](/domain/scope-severity-model.md)\nfor how severity depends on the kind of drawing being submitted.\n\n# Citations\n\n[1] [README.md](../../README.md)\n[2] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)"}, {"id": "domain/scope-severity-model", "type": "Domain Concept", "title": "Scope and severity model", "description": "How the same rule can be an error in one drawing context and merely informational in another.", "tags": ["domain", "scope", "severity"], "group": "domain", "sz": 50, "body": "# Overview\n\nA single validation rule (e.g. [R.36](/rules/R.36.md)) does not always carry\nthe same severity. Whether a failed rule is a hard error (`Fout`), merely\n`Informerend` (informational), or a `Waarschuwing` (warning) depends on the\n**scope** the object under validation falls into \u2014 a combination of:\n\n- **Tekeningsoort** (drawing type): `Bestaande Situatie`, `Definitief\n  Ontwerp`, `Deelrevisie`, `Eindrevisie`\n- **Status**: `BESTAAND`, `NIEUW`, `REVISIE`, `VERWIJDERD`\n- **Bedrijfstoestand** (operational state): `IN BEDRIJF`, `RESERVE`,\n  `VERLATEN`\n\n`doc/NLCSValidatieRegels.xml`'s `\u003cscopes>` section defines 8 named scopes,\neach mapping a Tekeningsoort+Status+Bedrijfstoestand combination to a list of\nrules and, per rule, a `niveau` (severity). This lets the same physical check\n(e.g. \"does a cable have valid endpoints\") be strictly enforced during a final\nhandover but only advisory during an as-built (\"Bestaande Situatie\") capture.\n\nThis logic is implemented in `validation_schemas/xsl_functions/rule_scope_functions.xsl`\nvia functions like `ma:scope-name`, `ma:rule-severity-within-scope`, and\n`ma:rule-within-scope-for-object`, and consumed by every concrete pattern in\n`validation_schemas/patterns/v12/` (see\n[schematron-layering](/architecture/schematron-layering.md)) to populate the\n`scope` and `severity` properties attached to every Schematron assert.\n\n# The 8 scopes\n\n| Scope | Tekeningsoort | Status | Bedrijfstoestand |\n|---|---|---|---|\n| Bestaande Situatie | Bestaande Situatie | BESTAAND | IN BEDRIJF, RESERVE, VERLATEN |\n| Definitief Ontwerp | Definitief Ontwerp | NIEUW, REVISIE, VERWIJDERD | IN BEDRIJF, RESERVE, VERLATEN |\n| Deelrevisie nieuwe objecten | Deelrevisie | NIEUW | IN BEDRIJF |\n| Deelrevisie aangepaste objecten | Deelrevisie | REVISIE | IN BEDRIJF, RESERVE |\n| Deelrevisie verlaten objecten | Deelrevisie | REVISIE, VERWIJDERD | VERLATEN |\n| Eindrevisie nieuwe objecten | Eindrevisie | NIEUW | IN BEDRIJF |\n| Eindrevisie aangepaste objecten | Eindrevisie | REVISIE | IN BEDRIJF, RESERVE |\n| Eindrevisie verlaten objecten | Eindrevisie | REVISIE, VERWIJDERD | VERLATEN |\n\n# Rule severity per scope\n\n`F` = Fout (error), `I` = Informerend (informational), `W` = Waarschuwing\n(warning), `\u2013` = rule is not evaluated for this scope at all.\n\n| Rule | Bestaande Situatie | Definitief Ontwerp | Deelrevisie nieuw | Deelrevisie aangepast | Deelrevisie verlaten | Eindrevisie nieuw | Eindrevisie aangepast | Eindrevisie verlaten |\n|---|---|---|---|---|---|---|---|---|\n| [R.1](/rules/R.1.md) | F | F | F | F | F | F | F | F |\n| [R.2](/rules/R.2.md) | F | F | F | F | F | F | F | F |\n| [R.3](/rules/R.3.md) | F | F | F | F | F | F | F | F |\n| [R.4](/rules/R.4.md) | \u2013 | \u2013 | F | F | F | F | F | F |\n| [R.5](/rules/R.5.md) | F | F | F | F | F | F | F | F |\n| [R.6](/rules/R.6.md) | F | \u2013 | F | F | F | F | F | F |\n| [R.7](/rules/R.7.md) | F | F | F | F | F | F | F | F |\n| [R.8](/rules/R.8.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.9](/rules/R.9.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.10](/rules/R.10.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.11](/rules/R.11.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.12](/rules/R.12.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.13](/rules/R.13.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.14](/rules/R.14.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.15](/rules/R.15.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.20](/rules/R.20.md) | I | F | F | F | \u2013 | F | F | \u2013 |\n| [R.21](/rules/R.21.md) | I | \u2013 | I | I | \u2013 | F | F | \u2013 |\n| [R.22](/rules/R.22.md) | I | \u2013 | I | I | \u2013 | F | F | \u2013 |\n| [R.23](/rules/R.23.md) | I | \u2013 | I | I | \u2013 | F | F | \u2013 |\n| [R.24](/rules/R.24.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.25](/rules/R.25.md) | I | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.26](/rules/R.26.md) | I | \u2013 | I | I | \u2013 | F | F | \u2013 |\n| [R.27](/rules/R.27.md) | I | F | F | F | \u2013 | F | F | \u2013 |\n| [R.28](/rules/R.28.md) | I | F | F | F | \u2013 | F | F | \u2013 |\n| [R.29](/rules/R.29.md) | \u2013 | \u2013 | F | F | \u2013 | F | F | \u2013 |\n| [R.30](/rules/R.30.md) | I | F | F | F | \u2013 | F | F | \u2013 |\n| [R.31](/rules/R.31.md) | \u2013 | \u2013 | W | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.32](/rules/R.32.md) | \u2013 | \u2013 | W | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.33](/rules/R.33.md) | \u2013 | \u2013 | W | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.34](/rules/R.34.md) | \u2013 | \u2013 | \u2013 | \u2013 | F | \u2013 | \u2013 | F |\n| [R.35](/rules/R.35.md) | F | F | F | F | F | F | F | F |\n| [R.36](/rules/R.36.md) | F | F | F | F | \u2013 | F | F | \u2013 |\n| [R.37](/rules/R.37.md) | \u2013 | \u2013 | F | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.38](/rules/R.38.md) | \u2013 | \u2013 | W | \u2013 | \u2013 | W | \u2013 | \u2013 |\n| [R.39](/rules/R.39.md) | \u2013 | \u2013 | F | \u2013 | \u2013 | F | \u2013 | \u2013 |\n| [R.40](/rules/R.40.md) | \u2013 | \u2013 | F | F | F | F | F | F |\n| [R.41](/rules/R.41.md) | F | F | F | F | F | F | F | F |\n\nRules `R.1`, `R.2`, `R.3`, `R.5`, `R.7`, `R.35`, and `R.41` are the only rules\nthat are `Fout` in literally every scope \u2014 regardless of drawing type,\nstatus, or operational state. See\n[scope-bound-vs-scopeless-rules](/decisions/scope-bound-vs-scopeless-rules.md)\nfor why `R.1`/`R.2` specifically were made unconditionally in-scope.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog \u2014 `\u003cscopes>` section](../../doc/NLCSValidatieRegels.xml)\n[2] [rule_scope_functions.xsl](../../validation_schemas/xsl_functions/rule_scope_functions.xsl)"}, {"id": "rules/R.1", "type": "Validation Rule", "title": "R.1 \u2014 Bestand bevat NLCS Objecten", "description": "Checks that an NLCS++ file contains exactly one AprojectReferentie plus at least one actual NLCS object, so no \"empty\" project can be submitted.", "tags": ["bestand"], "group": "rules", "sz": 28, "body": "# Overview\n\nAn NLCS++ file must contain at least one NLCS object in addition to its project reference. This rule rejects files that consist only of an AprojectReferentie with no actual content, i.e. an \"empty\" project submission.\n\n# Details\n\n- soort: Bestand\n- validatieObjecten: Document\n- Condition: the file's NLCSnetbeheer element must contain exactly one AprojectReferentie (`count($aprojectreferenties) = 1`), and it must contain at least one other child element that is not an AprojectReferentie (`count($nlcs_objects) > 0`).\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [bestand_bevat_nlcs_objecten.sch](../../validation_schemas/abstract_patterns/v12/bestand/bestand_bevat_nlcs_objecten.sch)"}, {"id": "rules/R.10", "type": "Validation Rule", "title": "R.10 \u2014 Verplichte kenmerken moffen", "description": "Checks that every cable joint (mof) has its baseline required attributes populated, with extra attributes required depending on voltage level.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 31, "body": "# Overview\nThis rule verifies that every mof (cable joint) has a minimal set of attributes filled in, so that its function and connection number are always traceable. Depending on the mof's voltage class, additional attributes are required: low-voltage joints must record whether they sit above ground, while medium- and high-voltage joints must record the installing technician and cross-bonding status.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): HSmof, LSmof, MSmof.\n- Condition:\n  - Every mof (HSmof, LSmof, MSmof) must have a value for `Functie` and `Verbindingnummer`.\n  - Additionally, every `LSmof` must have a value for `Bovengronds`.\n  - Additionally, every `MSmof` and `HSmof` must have a value for `NaamMonteur` and `CrossBondingAanwezig`.\n- The abstract pattern implements this with two separate rule contexts: one for `MSmof | HSmof` (Functie, Verbindingnummer, NaamMonteur, CrossBondingAanwezig) and one for `LSmof` (Functie, Verbindingnummer, Bovengronds).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `attribute-not-present` message from the message catalog for each missing attribute; see [localization-messages](../config/localization-messages.md).\n\n# Citations\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verplichte_kenmerken_moffen.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/verplichte_kenmerken_moffen.sch)"}, {"id": "rules/R.11", "type": "Validation Rule", "title": "R.11 \u2014 Verplichte kenmerken LSoverdrachtspunt", "description": "Checks that every low-voltage transfer point (LSoverdrachtspunt) has its required attributes populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "body": "# Overview\nThis rule verifies that every LSoverdrachtspunt (low-voltage transfer/connection point) has the attributes needed to describe its orientation, function, phasing, and earthing system, so downstream consumers can rely on these being present.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): LSoverdrachtspunt.\n- Condition: every `LSoverdrachtspunt` must have a value for `EigenRichting`, `Functie`, `FaseAanduiding`, and `Aardingsysteem` (asserts `eigen-richting-present`, `functie-present`, `fase-aanduiding-present`, `aardingsysteem-present`).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `attribute-not-present` message from the message catalog for each missing attribute; see [localization-messages](../config/localization-messages.md).\n\n# Citations\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verplichte_kenmerken_lsoverdrachtspunt.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/verplichte_kenmerken_lsoverdrachtspunt.sch)"}, {"id": "rules/R.12", "type": "Validation Rule", "title": "R.12 \u2014 Verplichte kenmerken OVLoverdrachtspunt", "description": "Checks that every overhead-line transfer point (OVLoverdrachtspunt) has its required attributes populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 30, "body": "# Overview\nThis rule verifies that every OVLoverdrachtspunt (overhead-line transfer point) carries a full set of attributes describing its connection set, function, voltage level, connection method, switching configuration, and mast number.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): OVLoverdrachtspunt.\n- Condition: every `OVLoverdrachtspunt` must have a value for `Aansluitset`, `Functie`, `Spanningsniveau`, `Aansluitwijze`, `Schakeling`, and `Mastnummer` (asserts `aansluitset-present`, `functie-present`, `spanningsniveau-present`, `aansluitwijze-present`, `schakeling-present`, `mastnummer-present`).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `attribute-not-present` message from the message catalog for each missing attribute; see [localization-messages](../config/localization-messages.md).\n\n# Citations\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verplichte_kenmerken_ovloverdrachtspunt.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/verplichte_kenmerken_ovloverdrachtspunt.sch)"}, {"id": "rules/R.13", "type": "Validation Rule", "title": "R.13 \u2014 Verplichte kenmerken MSoverdrachtspunt", "description": "Checks that every medium-voltage transfer point (MSoverdrachtspunt) has its Identificatie (EAN code) attribute populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "body": "# Overview\nThis rule verifies that every MSoverdrachtspunt (medium-voltage transfer point) has an `Identificatie` value, which holds the EAN code that uniquely identifies the connection point in downstream systems.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): MSoverdrachtspunt.\n- Condition: every `MSoverdrachtspunt` must have a value for `Identificatie` (EAN code), enforced by assert `v12-msoverdrachtspunt-has-identification`.\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `attribute-not-present` message from the message catalog when `Identificatie` is missing; see [localization-messages](../config/localization-messages.md).\n\n# Citations\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verplichte_kenmerken_msoverdrachtspunt.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/verplichte_kenmerken_msoverdrachtspunt.sch)"}, {"id": "rules/R.14", "type": "Validation Rule", "title": "R.14 \u2014 Verplichte kenmerken Stations en Kasten", "description": "Checks that every station or low-voltage cabinet has its Nummer and Functie attributes populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 29, "body": "# Overview\nThis rule verifies that every station or cabinet object records both an identifying number and its function, so these installations can be uniquely referenced and their role in the network understood.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): HSstation, LSkast, MSstation.\n- Condition: every `LSkast`, `MSstation`, and `HSstation` must have a value for `Nummer` and `Functie` (asserts `object-has-number`, `object-has-functie`).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `attribute-not-present` message from the message catalog for each missing attribute; see [localization-messages](../config/localization-messages.md).\n\n# Citations\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verplichte_kenmerken_stations_en_kasten.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/verplichte_kenmerken_stations_en_kasten.sch)"}, {"id": "rules/R.15", "type": "Validation Rule", "title": "R.15 \u2014 Verplichte kenmerken Mantelbuis", "description": "Checks that every conduit (Mantelbuis) has its Materiaal, Diameter, and Thema attributes populated.", "tags": ["verplichte-waarde"], "group": "rules", "sz": 30, "body": "# Overview\nThis rule verifies that every Mantelbuis (conduit/duct) records its material, diameter, and thematic classification, since these attributes are needed to describe the physical conduit and how it relates to the cables it protects.\n\n# Details\n- Rule category (`soort`): Verplichte waarde (mandatory value).\n- Applies to (`validatieObjecten`): Amantelbuis.\n- Condition: every `Amantelbuis` must have a value for `Materiaal`, `Diameter`, and `Thema` (asserts `mantelbuis-has-materiaal`, `mantelbuis-has-diameter`, `mantelbuis-has-thema`).\n\nThis rule only checks that `Diameter` is *populated*; the value's geometric consistency and unit correctness are checked separately \u2014 see [R.27](R.27.md) and [R.36](R.36.md), which apply additional geometric/value checks specific to Amantelbuis and its `Diameter`.\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `attribute-not-present` message from the message catalog for each missing attribute; see [localization-messages](../config/localization-messages.md).\n\n# Citations\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verplichte_kenmerken_mantelbuis.sch](../../validation_schemas/abstract_patterns/v12/verplichte_waarde/verplichte_kenmerken_mantelbuis.sch)"}, {"id": "rules/R.2", "type": "Validation Rule", "title": "R.2 \u2014 Combinatie NLCS Status en Tekeningsoort", "description": "Checks that the NLCS Status values used by objects in the file are consistent with the Tekeningtype declared on the AprojectReferentie.", "tags": ["bestand"], "group": "rules", "sz": 29, "body": "# Overview\n\nDepending on the Tekeningsoort (drawing type) of the project, only certain NLCS Status values are allowed to occur on the objects in the file. This rule prevents, for example, a \"Bestaande Situatie\" drawing from containing objects with a NIEUW or REVISIE status.\n\n# Details\n\n- soort: Bestand\n- validatieObjecten: Document\n- Condition: the allowed set of Status values is derived from `nlcs:AprojectReferentie/nlcs:Tekeningtype`:\n  - BESTAANDE SITUATIE \u2192 only `BESTAAND`\n  - DEELREVISIE, DEFINITIEF ONTWERP, EINDREVISIE \u2192 `BESTAAND`, `NIEUW`, `REVISIE`, `VERWIJDERD`\n  - VOORONTWERP (and any other/unrecognized Tekeningtype) \u2192 no statuses allowed\n  - The rule fails if any distinct Status value found among the file's objects falls outside the allowed set for the declared Tekeningtype.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [combinatie_nlcs_status_en_tekeningsoort.sch](../../validation_schemas/abstract_patterns/v12/bestand/combinatie_nlcs_status_en_tekeningsoort.sch)"}, {"id": "rules/R.20", "type": "Validation Rule", "title": "R.20 \u2014 Topologie punt objecten Elec", "description": "Checks that Elec point objects are geometrically connected to the correct cable type and do not float unconnected.", "tags": ["topologie"], "group": "rules", "sz": 33, "body": "# Overview\nThis rule verifies that point objects (Geometry of type `gml:Point`) in the electrical network are not left floating in space, but touch a cable line of the correct voltage class \u2014 medium-voltage points must connect to a medium-voltage cable, and low-voltage points must connect to a low-voltage cable.\n\n# Details\n- Rule category (`soort`): Topologie.\n- Applies to (`validatieObjecten`): Eaardmof, LSmof, LSoverdrachtspunt, MSmof, MSoverdrachtspunt, OVLoverdrachtspunt.\n- Condition: a point object may not float; it must be connected to the correct kabel:\n  - `MSmof` and `MSoverdrachtspunt` must be connected to an `MSkabel` \u2014 the pattern parses the point's `Geometry` and asserts (`point-connected-to-kabel`) that it touches at least one `MSkabel/Geometry` line.\n  - `Eaardmof`, `LSmof`, `LSoverdrachtspunt`, and `OVLoverdrachtspunt` must be connected to an `LSkabel` \u2014 the same assertion is checked against `LSkabel/Geometry` lines.\n\nThis point-to-cable topology check is complemented by [R.21](R.21.md), which validates the cable-side topology (valid end points of a kabel).\n\nSeverity for this rule varies by scope; see [scope-severity-model](../domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\nThe abstract pattern emits the `point-not-connected-to-any-line` message from the message catalog when a point object is not touching any line of the expected cable type; see [localization-messages](../config/localization-messages.md).\n\nThe point-to-cable touch check itself is served by a shared connectivity index rather than a per-rule scan; see [connectivity-index-and-geometry-caching](/decisions/connectivity-index-and-geometry-caching.md).\n\n# Citations\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [topologie_punt_objecten_elec.sch](../../validation_schemas/abstract_patterns/v12/topologie/topologie_punt_objecten_elec.sch)"}, {"id": "rules/R.21", "type": "Validation Rule", "title": "R.21 \u2014 Geldig eindpunt Kabel", "description": "Checks that every cable has a valid connected object at both its start and end point.", "tags": ["topologie"], "group": "rules", "sz": 32, "body": "# Overview\n\nEvery cable must be properly connected at both ends: a dangling start or end point indicates a topology error in the network. The rule checks the start and end point of the cable's geometry against the geometries of the object types that are valid endpoints for that cable type.\n\n# Details\n\n- Rule category (`soort`): Topologie\n- Applies to (`validatieObjecten`): Eaarddraad, LSkabel, MSkabel\n- Valid endpoints per cable type:\n\n  | Object type | Valid endpoint types |\n  |---|---|\n  | Eaarddraad | LSmof, MSmof, Eaardmof, Eaardpen, MSstation, LSkast |\n  | MSkabel | MSmof, MSoverdrachtspunt, MSstation |\n  | LSkabel | LSmof, LSoverdrachtspunt, OVLoverdrachtspunt, MSstation, LSkast |\n\n- A cable's start point is checked for point-connection (or, for MSstation/LSkast, area-touching) against the geometries of the applicable endpoint types; the same check is done independently for the end point.\n- The check is skipped entirely for cables with Bedrijfstoestand \"VERLATEN\".\n- Each endpoint check is only performed when that endpoint lies within the project area (`AprojectReferentie`); endpoints outside the project area are not evaluated.\n- Failing endpoints are reported with their geometry (via `ma:create-gml-point`) so the offending point can be located on the map.\n\nSee [R.20](/rules/R.20.md) for the related point-topology rule.\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](/domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [geldig_eindpunt_kabel.sch](../../validation_schemas/abstract_patterns/v12/topologie/geldig_eindpunt_kabel.sch)"}, {"id": "rules/R.22", "type": "Validation Rule", "title": "R.22 \u2014 Kabels zelfde Netvlak", "description": "Checks that cables connected to each other through a joint belong to the same network layer (discipline).", "tags": ["netlogica"], "group": "rules", "sz": 31, "body": "# Overview\n\nCables that are physically joined via a mof must belong to the same netvlak (network layer/discipline) \u2014 an LSkabel should not be spliced directly to an MSkabel or HSkabel, and vice versa, since that would mix voltage levels on one continuous conductor.\n\n# Details\n\n- Rule category (`soort`): Netlogica\n- Applies to (`validatieObjecten`): LSkabel, MSkabel\n- For an MSkabel, the joints (MSmof) touching its line are found, and then any LSkabel or HSkabel that also touches one of those joints is collected; the assertion fails if any such cross-netvlak cable is found.\n- For an LSkabel, the joints (LSmof) touching its line are found, and then any MSkabel or HSkabel touching one of those joints is collected; the assertion fails if any such cross-netvlak cable is found.\n- In both cases the failure message reports the counts and types of the mismatching connected cables.\n\nThe mof/kabel touch relationship (both the direct touch and the \"kabel via a shared mof\" second hop) is served by a shared connectivity index rather than a per-rule, per-kabel rescan; see [connectivity-index-and-geometry-caching](/decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](/domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [kabels_zelfde_netvlak.sch](../../validation_schemas/abstract_patterns/v12/netlogica/kabels_zelfde_netvlak.sch)"}, {"id": "rules/R.23", "type": "Validation Rule", "title": "R.23 \u2014 Verbonden kabels juiste kenmerken", "description": "Checks that cables connected to each other via a joint share the same value for a set of key attributes.", "tags": ["netlogica"], "group": "rules", "sz": 32, "body": "# Overview\n\nCables spliced together through a joint represent one continuous circuit, so certain descriptive attributes must be identical across the splice; a mismatch signals a data-entry error or an inconsistent circuit definition.\n\n# Details\n\n- Rule category (`soort`): Netlogica\n- Applies to (`validatieObjecten`): LSkabel, MSkabel\n- For each MSkabel/LSkabel, the joints (MSmof/LSmof) touching its line are found, and then all other cables of the same type touching one of those joints are collected as \"connected cables\".\n- The rule compares the following attributes of the cable against each connected cable, and reports the distinct mismatching values found:\n  - Bedrijfstoestand\n  - Subnettype\n  - Verbindingnummer\n  - Spanningsniveau\n- Each attribute is checked with a separate assertion, so a mismatch on one attribute does not suppress the check of the others.\n\nSee [R.39](/rules/R.39.md), which also validates a shared attribute \u2014 Verbindingnummer \u2014 across connected cables/joints. The mof/kabel touch relationship this rule composes (touch, then touch-via-mof) is served by a shared connectivity index rather than a per-kabel rescan; see [connectivity-index-and-geometry-caching](/decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](/domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verbonden_kabels_juiste_kenmerken.sch](../../validation_schemas/abstract_patterns/v12/netlogica/verbonden_kabels_juiste_kenmerken.sch)"}, {"id": "rules/R.24", "type": "Validation Rule", "title": "R.24 \u2014 Fase MS Kabel", "description": "Checks that a cable's FaseAanduiding value is consistent with its Uitvoering value.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 29, "body": "# Overview\n\nA cable's declared Fase (phase) must match how the cable is actually constructed, as described by Uitvoering: a 3-phase cable should be built as a \"3x\" execution, while a single-phase cable (L1, L2 or L3) should be built as a \"1x\" execution.\n\n# Details\n\n- Rule category (`soort`): Inhoud waarde\n- Applies to (`validatieObjecten`): MSkabel\n- Expected prefix of Uitvoering derived from FaseAanduiding:\n\n  | FaseAanduiding | Expected Uitvoering prefix |\n  |---|---|\n  | 3 Fasen | \"3x\" |\n  | L1 / L2 / L3 | \"1x\" |\n  | N (or any other value) | no prefix required |\n\n- The assertion checks that Uitvoering starts with the expected prefix.\n- If Uitvoering equals \"KEUZE ONTBREEKT IN LIJST\" (no choice made in the list), OmschrijvingUitvoering is compared against the expected prefix instead.\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](/domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [fase_ms_kabel.sch](../../validation_schemas/abstract_patterns/v12/inhoud_waarde/fase_ms_kabel.sch)"}, {"id": "rules/R.25", "type": "Validation Rule", "title": "R.25 \u2014 Verbonden kabels juiste Fase", "description": "Checks that cables joined at a mof have a Fase combination that is valid for the number of cables connected.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 32, "body": "# Overview\n\nThe set of Fase values on the cables meeting at a joint must be electrically consistent: cables spliced together must carry the same phase(s), except at a designated 3-phase-to-single-phase transition joint where the phases are expected to split.\n\n# Details\n\n- Rule category (`soort`): Inhoud waarde\n- Applies to (`validatieObjecten`): LSmof, MSmof\n- Behaviour depends on the number of cables connected to the joint:\n\n  | Cables connected | Requirement |\n  |---|---|\n  | 1 | No check performed |\n  | 2 | Fase of both cables must be equal |\n  | 3 | Fase of all three cables must be equal |\n  | 4 | One cable must be \"3 Fasen\"; the other three must together be exactly L1, L2 and L3 (a 3-phase to 3\u00d71-phase transition) |\n  | >4 | No check performed |\n\n- Only Fase values within the allowed set (\"3 Fasen\", \"L1\", \"L2\", \"L3\") are permitted at joints with 2, 3 or 4 connections; any other Fase value present triggers a separate assertion.\n- For 4 connections, the rule additionally requires that the four distinct allowed phase values are all represented (i.e., the combined value plus all three split values).\n\nSee [R.26](/rules/R.26.md), which also keys its check off the number of cables connected to a joint. The mof-to-kabel touch check is served by a shared connectivity index rather than a per-rule scan; see [connectivity-index-and-geometry-caching](/decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](/domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verbonden_kabels_juiste_fase.sch](../../validation_schemas/abstract_patterns/v12/inhoud_waarde/verbonden_kabels_juiste_fase.sch)"}, {"id": "rules/R.26", "type": "Validation Rule", "title": "R.26 \u2014 Aantal kabels en mof functie", "description": "Checks that the number of cables connected to a joint matches what is expected for the joint's Functie.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 35, "body": "# Overview\n\nA joint's Functie (function) implies how many cables should physically meet there \u2014 an end cap has one cable, a straight splice has two, a branch has three. This rule verifies the actual connected cable count against the count implied by Functie, and additionally checks the special case of a branch joint on an existing cable.\n\n# Details\n\n- Rule category (`soort`): Inhoud waarde\n- Applies to (`validatieObjecten`): Eaardmof, LSmof, MSmof\n- Functie is first mapped to a functional category via `ma:map-mof-functie` (see config dependency below), then the required number of connected cables is derived:\n\n  | Functie category | Example Functie values | Required cables |\n  |---|---|---|\n  | Eind | EINDMOF, EINDDOP, LOODKOP, EIND GEAARD | 1 |\n  | Verbinding | VERBINDING, ZEGELWIJZIGING, MANTELREPARATIE | 2 |\n  | Faseovergang | 3FASE 3x1FASE | 4 |\n  | Aftak, on an existing cable (at least one connected cable has Status \"BESTAAND\") | AFTAK SPLITSEND | 2, and at least one connected cable must have Status \"NIEUW\" |\n  | Aftak, otherwise | AFTAK SPLITSEND | 3 |\n\n- If Functie cannot be mapped to a known category, a separate assertion flags that the required cable amount is unknown.\n- Eaardmof has no Functie; instead it must simply be connected to at least one Eaarddraad (a dedicated rule branch, not driven by the table above).\n\nConfig dependency: the mapping from Functie strings to the Aftak/Eind/Verbinding/Faseovergang categories is defined by the `MofFuncties` group in `configuration/sys_config.xml` and read via the `ma:map-mof-functie` function \u2014 see [/config/sys-config.md](/config/sys-config.md).\n\nThe mof-to-kabel/Eaarddraad touch check is served by a shared connectivity index rather than a per-rule scan; see [connectivity-index-and-geometry-caching](/decisions/connectivity-index-and-geometry-caching.md).\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](/domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [aantal_kabels_en_mof_functie.sch](../../validation_schemas/abstract_patterns/v12/inhoud_waarde/aantal_kabels_en_mof_functie.sch)"}, {"id": "rules/R.27", "type": "Validation Rule", "title": "R.27 \u2014 Mantelbuis past in mantelbuis", "description": "Checks that a protection pipe (mantelbuis) nested inside one or more other protection pipes has a smaller diameter than each of them.", "tags": ["inhoud-waarde"], "group": "rules", "sz": 31, "body": "# Overview\n\nA mantelbuis can be laid inside one or more other, larger mantelbuizen, as recorded via AmantelbuisInhoud. For this physical nesting to be plausible, the inner pipe's Diameter must be smaller than the Diameter of every outer pipe it is recorded as lying inside.\n\n# Details\n\n- Rule category (`soort`): Inhoud waarde\n- Applies to (`validatieObjecten`): Amantelbuis\n- For a given Amantelbuis, the AmantelbuisInhoud records that reference it as InhoudID identify the parent (outer) mantelbuizen it lies inside.\n- The assertion requires that the inner pipe's Diameter is strictly smaller than the Diameter of every one of those outer pipes.\n- Diameter is a Text-typed attribute in the data model, so the abstract pattern coerces it to `number()` before comparing; outer pipes whose Diameter is \"KEUZE ONTBREEKT IN LIJST\" (no choice made) are excluded from the comparison, and the check is skipped entirely if the inner pipe's own Diameter is \"KEUZE ONTBREEKT IN LIJST\". Note: an earlier version of this pattern had a bug around this numeric coercion (missing xs:decimal/xs:integer conversion), later fixed.\n\nSee [R.30](/rules/R.30.md), which also concerns mantelbuis/inhoud nesting relationships.\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](/domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [mantelbuis_past_in_mantelbuis.sch](../../validation_schemas/abstract_patterns/v12/inhoud_waarde/mantelbuis_past_in_mantelbuis.sch)"}, {"id": "rules/R.28", "type": "Validation Rule", "title": "R.28 \u2014 Mantelbuis Inhoud aanwezig", "description": "Checks that a protection pipe (mantelbuis) in use has a registered content and a reserve one does not.", "tags": ["consistentie"], "group": "rules", "sz": 29, "body": "# Overview\n\nWhether a mantelbuis is expected to have an AmantelbuisInhoud (its recorded content, e.g. a cable) depends on its Bedrijfstoestand: a pipe that is in service should have content registered, while a pipe kept in reserve should not.\n\n# Details\n\n- Rule category (`soort`): Consistentie\n- Applies to (`validatieObjecten`): Amantelbuis\n- If Bedrijfstoestand is \"IN BEDRIJF\", at least one AmantelbuisInhoud referencing the mantelbuis (via MantelbuisID) must exist.\n- If Bedrijfstoestand is \"RESERVE\", no AmantelbuisInhoud referencing the mantelbuis may exist.\n- Both conditions are checked as separate assertions on the same rule context.\n\nSeverity for this rule varies by scope; see [/domain/scope-severity-model.md](/domain/scope-severity-model.md) for the full scope\u00d7severity matrix.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [mantelbuis_inhoud_aanwezig.sch](../../validation_schemas/abstract_patterns/v12/consistentie/mantelbuis_inhoud_aanwezig.sch)"}, {"id": "rules/R.29", "type": "Validation Rule", "title": "R.29 \u2014 Verplaatsing goed vastgelegd", "description": "Checks that a cable relocation (Bewerking VERPLAATSEN) is recorded as a pair of objects \u2014 the original BESTAAND object and a new REVISIE object sharing the same GisId \u2014 rather than as a single mutated object.", "tags": ["consistentie"], "group": "rules", "sz": 32, "body": "# Overview\n\nA relocation (\"verplaatsing\") of a cable must be recorded as two objects of the same type: the existing object being moved (Status=BESTAAND) and a new object capturing the new geometry (Status=REVISIE, Bewerking=VERPLAATSEN). This rule checks that whenever an object is flagged as a relocation, a matching original object with the same GisId still exists, and that the relocation object itself carries no AssetId.\n\n# Details\n\n- soort: Consistentie\n- validatieObjecten: LSkabel, MSkabel\n- Condition:\n  - For any MSkabel/LSkabel with Status=REVISIE and Bewerking=VERPLAATSEN (\"is_verplaatsing\"):\n    - it must not have an AssetId (`verplaatsing-cannot-have-asset-id`, message `property-not-allowed-for-statuses`);\n    - there must exist a second object of the same NLCS type elsewhere in the file with Status=BESTAAND and the same GisId (`verplaatsing-correctly-applied`, message `verplaatsing-incorrectly-applied`).\n  - Objects that are not a relocation (`is_verplaatsing` false) are not constrained by either assertion.\n\nThis relocation pattern is the explicit exception referenced by [R.5](/rules/R.5.md), whose GisId/AssetId presence check otherwise excludes REVISIE+VERPLAATSEN objects from its normal \"must carry GisId and AssetId\" requirement.\n\nSeverity for this rule varies by scope; see [scope \u00d7 severity matrix](/domain/scope-severity-model.md) for the exact values.\n\n# Citations\n\n[1] [NLCS Validatieregels catalog](../../doc/NLCSValidatieRegels.xml)\n[2] [verplaatsing_goed_vastgelegd.sch](../../validation_schemas/abstract_patterns/v12/consistentie/verplaatsing_goed_vastgelegd.sch)"}
